            if (!text3) return;
            event.preventDefault();
            if (text3.startsWith("{")) handleFile(new File([text3], "clipboard.json", { type: "application/json" }));
            else setOverlay({ type: "paste", text: text3 });
          };
          window.addEventListener("dragenter", enter);
          window.addEventListener("dragover", over);
          window.addEventListener("dragleave", leave);
          window.addEventListener("drop", drop);
          document.addEventListener("paste", paste);
          return () => {
            window.removeEventListener("dragenter", enter);
            window.removeEventListener("dragover", over);
            window.removeEventListener("dragleave", leave);
            window.removeEventListener("drop", drop);
            document.removeEventListener("paste", paste);
          };
        }, [handleFile]);
        const appMenu = () => [
          { id: "palette", label: "Команды", icon: "command", onSelect: () => open2({ type: "palette" }) },
          { id: "documents", label: "Документы для цеха", icon: "file-text", onSelect: () => open2({ type: "documents" }) },
          { id: "templates", label: "Библиотека изделий", icon: "library", onSelect: () => open2({ type: "templates" }) },
          { id: "stock", label: "Склад остатков", icon: "warehouse", onSelect: () => open2({ type: "stock" }) },
          { id: "export", label: "Экспорт .fbuild", icon: "file-down", divider: true, onSelect: () => void exportCurrent() },
          { id: "import", label: "Импорт .fbuild", icon: "file-up", onSelect: pickFile },
          { id: "versions", label: "История версий", icon: "history", onSelect: () => open2({ type: "versions" }) },
          { id: "macros", label: "Макросы", icon: "square-terminal", divider: true, onSelect: () => open2({ type: "macros" }) },
          { id: "addons", label: "Дополнения", icon: "puzzle", onSelect: () => open2({ type: "addons" }) },
          { id: "sync", label: "Синхронизировать", icon: "refresh-cw", divider: true, onSelect: () => void workspace.sync() },
          { id: "settings", label: "Настройки", icon: "settings", onSelect: () => open2({ type: "settings" }) }
        ];
        const summary = solved.solved?.summary;
        const statusItems = [
          { id: "parts", label: `${countLabel(project.parts.length, "позиция", "позиции", "позиций")} · ${countLabel(pieces, "деталь", "детали", "деталей")}` },
          ...summary ? [
            { id: "sheets", label: `${countLabel(summary.sheetCount, "лист", "листа", "листов")} · заполнение ${percent(summary.util)}` },
            { id: "cut", label: `Рез ${fmt(summary.cutLength / 1000, 1)} м` }
          ] : [],
          ...solved.computing ? [{ id: "computing", label: "Расчёт раскроя…" }] : [],
          ...unplacedCount ? [{ id: "unplaced", label: `Не размещено: ${unplacedCount}`, tone: "danger" }] : [],
          ...recording.active ? [{ id: "recording", label: `● Запись макроса: ${recording.actions.length}`, tone: "danger" }] : []
        ];
        return html`<div className=${classNames("app", dragging && "is-dropping")} data-tab=${tab}>
          <${AppBar}
            title=${project.name}
            subtitle=${`${countLabel(pieces, "деталь", "детали", "деталей")} · ${materialsSummary(project)}`}
            canUndo=${workspace.canUndo}
            canRedo=${workspace.canRedo}
            onUndo=${() => {
              haptic.select();
              workspace.undo();
            }}
            onRedo=${() => {
              haptic.select();
              workspace.redo();
            }}
            onProjects=${() => open2({ type: "projects" })}
            onDocuments=${() => open2({ type: "documents" })}
            onSettings=${() => open2({ type: "settings" })}
            onPalette=${() => open2({ type: "palette" })}
            onSync=${() => void workspace.sync()}
            menu=${appMenu}
          />
          <${TabBar} tab=${tab} onChange=${setTab} badges=${unplacedCount ? { layout: "!" } : {}} />
          <${ProjectTree}
            project=${project}
            solved=${solved.solved}
            selectedPart=${selectedPart}
            activeSheet=${tab === "layout" ? sheetIndex : null}
            onPart=${(id) => editPart(id)}
            onProduct=${(id) => {
              setActiveProduct(id);
              open2({ type: "product", id });
            }}
            onAddProduct=${() => open2({ type: "templates" })}
            onMaterials=${() => goParams("params-material")}
            onEdges=${() => goParams("params-edges")}
            onSheet=${(index) => {
              layoutSheet.set(index);
              setTab("layout");
            }}
            partMenu=${partMenu}
          />
          <main className="app__main">
            ${tab === "parts" && html`<${PartsView}
              project=${project}
              positions=${positions}
              unplaced=${unplaced}
              dispatch=${dispatch}
              selectedPart=${selectedPart}
              onEdit=${(id) => editPart(id)}
              onAdd=${addPart}
              onPaste=${() => open2({ type: "paste" })}
              onBulk=${(ids, done2) => open2({ type: "bulk", ids, done: done2 })}
              onProduct=${(id) => {
                setActiveProduct(id);
                open2({ type: "product", id });
              }}
              onTemplates=${() => open2({ type: "templates" })}
              partMenu=${partMenu}
            />`}
            ${tab === "params" && html`<${ParamsView} project=${project} dispatch=${dispatch} />`}
            ${tab === "layout" && html`<${LayoutView}
              solved=${solved}
              edges=${project.edgeMaterials}
              theme=${theme}
              display=${settings.display}
              onDisplay=${() => open2({ type: "display" })}
              onDocuments=${() => open2({ type: "documents" })}
              onGoToParts=${() => setTab("parts")}
            />`}
            ${tab === "assembly" && html`<${AssemblyView}
              project=${project}
              positions=${positions}
              theme=${theme}
              dispatch=${dispatch}
              selectedPart=${selectedPart}
              onSelectPart=${setSelectedPart}
              product=${product}
              onProduct=${setActiveProduct}
              onEditPart=${(id) => editPart(id, "assembly")}
              onDocuments=${() => open2({ type: "documents" })}
            />`}
            ${tab === "cam" && html`<${CamView} project=${production2} solved=${solved} theme=${theme} onGoToParts=${() => setTab("parts")} />`}
            ${tab === "report" && html`<${ReportView} project=${production2} solved=${solved} onDocuments=${() => open2({ type: "documents" })} onGoToParts=${() => setTab("parts")} />`}
          </main>
          <aside className="app-inspector" aria-label="Свойства">
            <${InspectorSummary} project=${project} production=${production2} onParams=${() => goParams("params-props")} onDocuments=${() => open2({ type: "documents" })} />
          </aside>
          <${StatusBar} items=${statusItems} onSync=${() => void workspace.sync()} onPalette=${() => open2({ type: "palette" })} />
          ${dragging && html`<div className="dropzone" aria-hidden="true">
            <${Icon} name="file-up" size=${32} />
            <b>Отпустите файл .fbuild для импорта</b>
          </div>`}

          <${PartSheet}
            state=${overlay?.type === "part" ? overlay.state : null}
            project=${project}
            positions=${positions}
            theme=${theme}
            dispatch=${dispatch}
            onClose=${close}
          />
          <${BulkSheet}
            ids=${overlay?.type === "bulk" ? overlay.ids : null}
            project=${project}
            dispatch=${dispatch}
            onClose=${(applied) => {
              if (applied && overlay?.type === "bulk") overlay.done();
              close();
            }}
          />
          <${PasteSheet} open=${overlay?.type === "paste"} initial=${overlay?.type === "paste" ? overlay.text : undefined} project=${project} product=${product} dispatch=${dispatch} onClose=${close} />
          <${ProjectsSheet} open=${overlay?.type === "projects"} workspace=${workspace} onClose=${close} onImportFile=${handleFile} onVersions=${() => open2({ type: "versions" })} />
          <${SettingsSheet} open=${overlay?.type === "settings"} onClose=${close} onSync=${() => void workspace.sync()} />
          <${DisplaySheet} open=${overlay?.type === "display"} onClose=${close} />
          <${DocumentsSheet} open=${overlay?.type === "documents"} project=${production2} solved=${solved.solved} display=${settings.display} onClose=${close} />
          <${ProductSheet} id=${overlay?.type === "product" ? overlay.id : null} project=${project} dispatch=${dispatch} onClose=${close} />
          <${TemplatesSheet} open=${overlay?.type === "templates"} project=${project} dispatch=${dispatch} onClose=${close} onInserted=${setActiveProduct} />
          <${VersionsSheet} open=${overlay?.type === "versions"} project=${project} workspace=${workspace} dispatch=${dispatch} onClose=${close} />
          <${StockSheet} open=${overlay?.type === "stock"} project=${project} solved=${solved.solved} dispatch=${dispatch} onClose=${close} />
          <${ImportSheet} state=${incoming} workspace=${workspace} onClose=${() => setIncoming(null)} />
          <${MacrosSheet} open=${overlay?.type === "macros"} runner=${runner} onClose=${close} />
          <${AddonsSheet} open=${overlay?.type === "addons"} onClose=${close} share=${shareContent} />
          <${ScriptForm} />
          <${CommandPalette} open=${overlay?.type === "palette"} commands=${commands} onClose=${close} />
        </div>`;
      }
      function Splash({ children }) {
        return html`<div className="splash">
          <div className="splash__logo" aria-hidden="true">
            f<b>B</b>
          </div>
          <div className="splash__name">fBuild</div>
          ${children}
        </div>`;
      }
      function LockScreen({ onUnlock }) {
        const [state, setState] = useState("idle");
        const attempt = useCallback(async () => {
          setState("busy");
          if (await unlock()) onUnlock();
          else setState("failed");
        }, [onUnlock]);
        useEffect(() => {
          void attempt();
        }, [attempt]);
        return html`<${Splash}>
          <${Button} variant="primary" size="lg" icon="fingerprint" busy=${state === "busy"} onClick=${() => void attempt()}>
            Разблокировать
          <//>
          ${state === "failed" && html`<${Button} variant="ghost" size="sm" onClick=${openBiometricSettings}>
            Настройки биометрии
          <//>`}
        <//>`;
      }
      function WorkspaceRoot() {
        const ui = useUi();
        const theme = useTheme();
        const notify = useCallback((n2) => ui.notify(n2.message, n2.tone, n2.title), [ui]);
        const workspace = useWorkspace(notify);
        if (workspace.boot.status === "error") {
          return html`<${Splash}>
            <${ErrorState} error=${workspace.boot.error} onRetry=${workspace.retryBoot} />
          <//>`;
        }
        if (workspace.boot.status === "loading" || !workspace.project) {
          return html`<${Splash}>
            <${LoadingState} label=${workspace.boot.status === "loading" ? workspace.boot.progress ?? "Загрузка…" : "Открытие проекта…"} />
          <//>`;
        }
        return html`<${ErrorBoundary}
          fallback=${(error, reset) => html`<${Splash}>
            <${ErrorState} error=${error} onRetry=${reset} />
          <//>`}
        >
          <${Workbench} key=${workspace.project.id} workspace=${workspace} project=${workspace.project} theme=${theme} />
        <//>`;
      }
      function Root() {
        const [locked, setLocked] = useState(null);
        useTheme();
        useEffect(() => {
          void isLocked().then(setLocked, () => setLocked(false));
        }, []);
        if (locked === null)
          return html`<${Splash}>
            <${LoadingState} label="Загрузка…" />
          <//>`;
        if (locked) return html`<${LockScreen} onUnlock=${() => setLocked(false)} />`;
        return html`<${WorkspaceRoot} />`;
      }
      function App() {
        return html`<${UiProvider}>
          <${Root} />
        <//>`;
      }

      function Gate({ title, action, href }) {
        return html`<main className="gate" aria-labelledby="gate-title">
          <div className="gate__logo" aria-hidden="true">
            f<b>B</b>
          </div>
          <h1 id="gate-title" className="gate__title">
            ${title}
          </h1>
          <a className="btn btn--primary btn--lg" href=${href} rel="noopener">
            <${Icon} name="send" />
            <span>${action}</span>
          </a>
        </main>`;
      }
      function OutsideTelegram() {
        return html`<${Gate} title="fBuild работает в Telegram" action="Открыть в Telegram" href=${CONFIG.botLink || "https://t.me/"} />`;
      }
      function UpdateTelegram() {
        return html`<${Gate} title="Обновите Telegram, чтобы открыть fBuild" action="Скачать Telegram" href="https://telegram.org/apps" />`;
      }

      const container = document.getElementById("root");
      if (!container) throw new Error("Нет корневого элемента #root");
      const appRoot = createRoot(container);
      for (const type of ["gesturestart", "gesturechange", "dblclick"]) {
        document.addEventListener(type, (event) => event.target instanceof HTMLElement && !event.target.closest("canvas, .viewport3d") && event.preventDefault(), { passive: false });
      }
      document.addEventListener("wheel", (event) => event.ctrlKey && event.preventDefault(), { passive: false });
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && ["+", "=", "-", "0"].includes(event.key)) event.preventDefault();
      });
      if (isInsideTelegram() && isClientSupported()) {
        initTelegram();
        if (settingsStore.get().fullscreen) setFullscreen(true);
        appRoot.render(
          html`<${StrictMode}>
            <${App} />
          <//>`
        );
      } else {
        const app = isInsideTelegram() ? getWebApp() : null;
        document.documentElement.dataset.theme = app?.colorScheme ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        app?.ready();
        appRoot.render(app ? html`<${UpdateTelegram} />` : html`<${OutsideTelegram} />`);
      }
    </script>
    <noscript>Для работы fBuild нужен JavaScript.</noscript>
  </body>
</html>
