      }

      function abortError() {
        const error = new Error("Расчёт отменён");
        error.name = "AbortError";
        return error;
      }
      function workerUrl() {
        const source = document.getElementById("solver-worker")?.textContent ?? "";
        return URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      }
      function createSolver() {
        let url = null;
        let worker = null;
        let active = null;
        let sequence = 0;
        const settle = (message) => {
          if (!active || message.id !== active.id) return;
          const { resolve, reject } = active;
          active = null;
          if (message.ok) resolve(message.result);
          else reject(new AppError("Не удалось рассчитать раскрой. Проверьте размеры деталей.", message.error));
        };
        const spawn = () => {
          url ??= workerUrl();
          const next = new Worker(url, { name: "fbuild-solver", type: "module" });
          next.onmessage = (event) => settle(event.data);
          next.onerror = (event) => {
            event.preventDefault();
            if (active) settle({ id: active.id, ok: false, error: event.message || "worker" });
            next.terminate();
            worker = null;
          };
          worker = next;
          return next;
        };
        return {
          solve(payload, signal) {
            if (active) {
              active.reject(abortError());
              active = null;
              worker?.terminate();
              worker = null;
            }
            return new Promise((resolve, reject) => {
              const id = ++sequence;
              active = { id, resolve, reject };
              signal?.addEventListener("abort", () => {
                if (active?.id !== id) return;
                active = null;
                worker?.terminate();
                worker = null;
                reject(abortError());
              });
              try {
                (worker ?? spawn()).postMessage({ id, payload });
              } catch (error) {
                settle({ id, ok: false, error: String(error) });
              }
            });
          }
        };
      }

      const solver = createSolver();
      function useSolved(project) {
        const job = useMemo(
          () => buildJob(project),
          [project.material, project.cut, project.parts, project.offcuts, project.defects, project.edgeMaterials]
        );
        const [state, setState] = useState(loading());
        const [solved, setSolved] = useState(null);
        const [attempt, setAttempt] = useState(0);
        useEffect(() => {
          const payload = job.payload;
          if (!payload) {
            setState(loaded(null));
            setSolved(null);
            return undefined;
          }
          const controller = new AbortController();
          setState(loading("Расчёт раскроя…"));
          const timer = setTimeout(() => {
            solver.solve(payload, controller.signal).then(
              (result) => {
                if (controller.signal.aborted) return;
                const next = { job, result, summary: summarize(result, job) };
                setSolved(next);
                setState(loaded(next));
              },
              (error) => {
                if (!controller.signal.aborted && !isAbort(error)) setState(failed(error));
              }
            );
          }, CONFIG.solveDelay);
          return () => {
            clearTimeout(timer);
            controller.abort();
          };
        }, [job.key, attempt]);
        const current = useMemo(
          () => solved && job.payload ? solved.job.key === job.key ? { ...solved, job } : solved : null,
          [solved, job]
        );
        return {
          job,
          state,
          solved: current,
          computing: state.status === "loading" && Boolean(job.payload),
          retry: () => setAttempt((n) => n + 1)
        };
      }

      const CHUNK = 4000;
      const INDEX = "index";
      const projectKey = (id) => `p_${id}`;
      function call(method) {
        return new Promise((resolve, reject) => {
          try {
            method((error, value) => error ? reject(new AppError("Облако Telegram недоступно", String(error))) : resolve(value));
          } catch (error) {
            reject(new AppError("Облако Telegram недоступно", String(error)));
          }
        });
      }
      class CloudRepository {
        mode = "cloud";
        queue = Promise.resolve();
        storage = webApp().CloudStorage;
        enqueue(task) {
          const run = this.queue.then(task);
          this.queue = run.catch(() => undefined);
          return run;
        }
        async read(key) {
          const head = await call((cb) => this.storage.getItem(key, cb)) ?? "";
          const match = /^chunks:(\d{1,4})$/.exec(head);
          if (!match) return null;
          const keys = Array.from({ length: Number(match[1]) }, (_, i) => `${key}_${i}`);
          const values = await call((cb) => this.storage.getItems(keys, cb)) ?? {};
          return keys.map((k) => values[k] ?? "").join("");
        }
        async write(key, value) {
          const head = await call((cb) => this.storage.getItem(key, cb)).catch(() => "") ?? "";
          const previous = Number(/^chunks:(\d{1,4})$/.exec(head)?.[1] ?? 0);
          const parts = Math.max(1, Math.ceil(value.length / CHUNK));
          for (let i = 0; i < parts; i += 1) {
            await call((cb) => this.storage.setItem(`${key}_${i}`, value.slice(i * CHUNK, (i + 1) * CHUNK), cb));
          }
          await call((cb) => this.storage.setItem(key, `chunks:${parts}`, cb));
          if (previous > parts) {
            const stale = Array.from({ length: previous - parts }, (_, i) => `${key}_${parts + i}`);
            await call((cb) => this.storage.removeItems(stale, cb)).catch(() => undefined);
          }
        }
        async readIndex() {
          const raw = await this.read(INDEX);
          if (!raw) return [];
          try {
            const list = JSON.parse(raw);
            return list.flatMap((item) => {
              const parsed = ProjectMetaSchema.safeParse(item);
              return parsed.success ? [parsed.data] : [];
            });
          } catch {
            return [];
          }
        }
        list() {
          return this.enqueue(() => this.readIndex());
        }
        load(id) {
          return this.enqueue(async () => {
            const [index, raw] = await Promise.all([this.readIndex(), this.read(projectKey(id))]);
            if (!raw) return null;
            try {
              return { project: parseProject(JSON.parse(raw)), revision: index.find((m) => m.id === id)?.revision ?? 0 };
            } catch {
              return null;
            }
          });
        }
        save(project, baseRevision) {
          return this.enqueue(async () => {
            const index = await this.readIndex();
            const current = index.find((m) => m.id === project.id);
            if (current && current.revision !== baseRevision) {
              const raw = await this.read(projectKey(project.id));
              if (raw) return { ok: false, conflict: { project: parseProject(JSON.parse(raw)), revision: current.revision } };
            }
            const revision = (current?.revision ?? 0) + 1;
            await this.write(projectKey(project.id), JSON.stringify(project));
            const meta = {
              id: project.id,
              name: project.name,
              updatedAt: project.updatedAt,
              revision,
              parts: project.parts.length
            };
            const next = [meta, ...index.filter((m) => m.id !== project.id)].slice(0, CONFIG.limits.projects);
            await this.write(INDEX, JSON.stringify(next));
            return { ok: true, revision };
          });
        }
        remove(id) {
          return this.enqueue(async () => {
            const index = await this.readIndex();
            await this.write(INDEX, JSON.stringify(index.filter((m) => m.id !== id)));
            const head = await call((cb) => this.storage.getItem(projectKey(id), cb)).catch(() => "") ?? "";
            const count = Number(/^chunks:(\d{1,4})$/.exec(head)?.[1] ?? 0);
            const keys = [projectKey(id), ...Array.from({ length: count }, (_, i) => `${projectKey(id)}_${i}`)];
            await call((cb) => this.storage.removeItems(keys, cb)).catch(() => undefined);
          });
        }
        watch(listener) {
          let known = new Map();
          let first = true;
          let timer = null;
          let stopped = false;
          let online = null;
          const connection = (next) => {
            if (online === next) return;
            online = next;
            listener({ type: "connection", online: next });
          };
          const poll = async () => {
            if (stopped) return;
            if (document.visibilityState === "visible") {
              try {
                const index = await this.list();
                const next = new Map(index.map((m) => [m.id, m.revision]));
                if (!first) {
                  for (const [id, revision] of next) {
                    if ((known.get(id) ?? -1) < revision) listener({ type: "project", id, revision, origin: "cloud" });
                  }
                  for (const id of known.keys()) if (!next.has(id)) listener({ type: "deleted", id, origin: "cloud" });
                }
                first = false;
                known = next;
                connection(true);
              } catch {
                connection(false);
              }
            }
            if (!stopped) timer = setTimeout(poll, CONFIG.pollInterval);
          };
          const wake = () => {
            if (timer) clearTimeout(timer);
            void poll();
          };
          const offActivated = onTelegramEvent("activated", wake);
          document.addEventListener("visibilitychange", wake);
          void poll();
          return () => {
            stopped = true;
            if (timer) clearTimeout(timer);
            offActivated();
            document.removeEventListener("visibilitychange", wake);
          };
        }
      }

      function useTheme() {
        const settings = useStore(settingsStore);
        const [scheme, setScheme] = useState(() => getWebApp()?.colorScheme ?? "dark");
        useEffect(() => onTelegramEvent("themeChanged", () => setScheme(getWebApp()?.colorScheme ?? "dark")), []);
        const theme = settings.theme === "system" ? scheme : settings.theme;
        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          paintTelegramChrome(theme);
        }, [theme]);
        useEffect(() => setHapticsEnabled(settings.haptics), [settings.haptics]);
        return theme;
      }
      function useIssueToasts(project, positions) {
        const ui = useUi();
        const previous = useRef(null);
        useEffect(() => {
          const issues = validateProject(project, positions);
          const keys = new Set(issues.map((i) => i.key));
          if (previous.current?.id === project.id) {
            const known = previous.current.keys;
            const fresh = issues.filter((i) => !known.has(i.key));
            for (const issue of fresh.slice(0, 2)) ui.notify(issue.message, issue.tone, issue.title);
            if (fresh.length > 2) ui.notify(`Ещё замечаний: ${fresh.length - 2}`, "warning", "Проверьте детали");
          }
          previous.current = { id: project.id, keys };
        }, [project, positions, ui]);
      }
      function Workbench({ project, dispatch, workspace, theme }) {
        const [tab, setTab] = useState("parts");
        const [overlay, setOverlay] = useState(null);
        const settings = useStore(settingsStore);
        const solved = useSolved(project);
        const positions = useMemo(() => bomPositions(project.parts), [project.parts]);
        const unplaced = useMemo(() => solved.solved ? unplacedByPart(solved.solved.result, solved.solved.job) : new Map(), [solved.solved]);
        useIssueToasts(project, positions);
        const close = useCallback(() => setOverlay(null), []);
        const pieces = project.parts.reduce((t, p) => t + p.qty, 0);
        const unplacedCount = solved.solved?.summary.unplaced ?? 0;
        return html`<div className="app">
          <${AppBar}
            title=${project.name}
            subtitle=${`${countLabel(pieces, "деталь", "детали", "деталей")} · ${project.material.name} ${project.material.T} мм`}
            onProjects=${() => setOverlay({ type: "projects" })}
            onDocuments=${() => setOverlay({ type: "documents" })}
            onSettings=${() => setOverlay({ type: "settings" })}
          />
          <main className="app__main">
            ${tab === "parts" && html`<${PartsView}
              project=${project}
              positions=${positions}
              unplaced=${unplaced}
              dispatch=${dispatch}
              onEdit=${(id) => setOverlay({ type: "part", state: { mode: "edit", id } })}
              onAdd=${() => setOverlay({ type: "part", state: { mode: "new" } })}
              onPaste=${() => setOverlay({ type: "paste" })}
              onBulk=${(ids, done) => setOverlay({ type: "bulk", ids, done })}
            />`}
            ${tab === "params" && html`<${ParamsView} project=${project} dispatch=${dispatch} />`}
            ${tab === "layout" && html`<${LayoutView}
              solved=${solved}
              edges=${project.edgeMaterials}
              theme=${theme}
              display=${settings.display}
              onDisplay=${() => setOverlay({ type: "display" })}
              onExportPng=${(index) => setOverlay({ type: "png", index })}
              onDocuments=${() => setOverlay({ type: "documents" })}
              onGoToParts=${() => setTab("parts")}
            />`}
            ${tab === "assembly" && html`<${AssemblyView}
              project=${project}
              positions=${positions}
              theme=${theme}
              dispatch=${dispatch}
              onEditPart=${(id) => setOverlay({ type: "part", state: { mode: "edit", id, section: "assembly" } })}
              onDocuments=${() => setOverlay({ type: "documents" })}
            />`}
            ${tab === "report" && html`<${ReportView} project=${project} solved=${solved} onDocuments=${() => setOverlay({ type: "documents" })} onGoToParts=${() => setTab("parts")} />`}
          </main>
          <${TabBar} tab=${tab} onChange=${setTab} badges=${unplacedCount ? { layout: "!" } : {}} />

          <${PartSheet} state=${overlay?.type === "part" ? overlay.state : null} project=${project} positions=${positions} theme=${theme} dispatch=${dispatch} onClose=${close} />
          <${BulkSheet}
            ids=${overlay?.type === "bulk" ? overlay.ids : null}
            project=${project}
            dispatch=${dispatch}
            onClose=${(applied) => {
              if (applied && overlay?.type === "bulk") overlay.done();
              close();
            }}
          />
          <${PasteSheet} open=${overlay?.type === "paste"} project=${project} dispatch=${dispatch} onClose=${close} />
          <${ProjectsSheet} open=${overlay?.type === "projects"} workspace=${workspace} onClose=${close} />
          <${SettingsSheet} open=${overlay?.type === "settings"} onClose=${close} />
          <${DisplaySheet} open=${overlay?.type === "display"} onClose=${close} />
          <${DocumentsSheet} open=${overlay?.type === "documents"} project=${project} solved=${solved.solved} display=${settings.display} onClose=${close} />
          <${PngSheet} sheetIndex=${overlay?.type === "png" ? overlay.index : null} project=${project} solved=${solved.solved} display=${settings.display} onClose=${close} />
        </div>`;
      }
      function Splash({ children }) {
        return html`<div className="splash">
          <div className="splash__logo" aria-hidden="true">
            f<b>B</b>
          </div>
          <div className="splash__name">fBuild</div>
          ${children}
        </div>`;
      }
      function Root({ repo }) {
        const ui = useUi();
        const theme = useTheme();
        const notify = useCallback((n) => ui.notify(n.message, n.tone, n.title), [ui]);
        const workspace = useWorkspace(repo, notify);
        if (workspace.boot.status === "error") {
          return html`<${Splash}>
            <${ErrorState} error=${workspace.boot.error} onRetry=${workspace.retryBoot} />
          <//>`;
        }
        if (workspace.boot.status === "loading" || !workspace.project) {
          return html`<${Splash}>
            <${LoadingState} label=${workspace.boot.status === "loading" ? workspace.boot.progress ?? "Загрузка…" : "Открытие проекта…"} />
          <//>`;
        }
        return html`<${ErrorBoundary}
          fallback=${(error, reset) => html`<${Splash}>
            <${ErrorState} error=${error} onRetry=${reset} />
          <//>`}
        >
          <${Workbench} project=${workspace.project} dispatch=${workspace.dispatch} workspace=${workspace} theme=${theme} />
        <//>`;
      }
      function App() {
        const repo = useMemo(() => new CloudRepository(), []);
        return html`<${UiProvider}>
          <${Root} repo=${repo} />
        <//>`;
      }

      function OutsideTelegram() {
        return html`<main className="gate" aria-labelledby="gate-title">
          <div className="gate__card">
            <div className="gate__logo" aria-hidden="true">
              f<b>B</b>
            </div>
            <h1 id="gate-title" className="gate__title">
              fBuild работает только в Telegram
            </h1>
            <p className="gate__text">
              Раскрой, присадка, спецификации и 3D-сборка доступны в мини-приложении Telegram.
              Откройте fBuild из бота — проекты синхронизируются между телефоном и компьютером.
            </p>
            ${CONFIG.botLink ? html`<a className="btn btn--primary btn--lg gate__action" href=${CONFIG.botLink} rel="noopener">
              <${Icon} name="send" />
              <span>Открыть в Telegram</span>
            </a>` : html`<p className="gate__hint">Попросите администратора ссылку на бота fBuild.</p>`}
          </div>
          <p className="gate__footer">fBuild · CAD/CAM для корпусной мебели</p>
        </main>`;
      }

      const container = document.getElementById("root");
      if (!container) throw new Error("Нет корневого элемента #root");
      const appRoot = createRoot(container);
      if (isInsideTelegram()) {
        initTelegram();
        appRoot.render(
          html`<${StrictMode}>
            <${App} />
          <//>`
        );
      } else {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        appRoot.render(html`<${OutsideTelegram} />`);
      }
    </script>
    <noscript>Для работы fBuild нужен JavaScript.</noscript>
  </body>
</html>
