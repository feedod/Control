    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?external=react",
          "htm": "https://esm.sh/htm@3.1.1",
          "zod": "https://esm.sh/zod@4.6.7",
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <style>
      @layer base, components;

      @layer base {
        :root {
          color-scheme: dark;
          --bg: light-dark(#eef0f2, #17191b);
          --surface-1: light-dark(#ffffff, #1f2124);
          --surface-2: light-dark(#f6f7f8, #26292d);
          --surface-3: light-dark(#e9ecef, #30343a);
          --input: light-dark(#ffffff, #1b1d20);
          --border: light-dark(#dde1e5, #33373d);
          --border-strong: light-dark(#c2c9d0, #474d55);
          --text: light-dark(#1f2328, #f2f4f5);
          --text-2: light-dark(#56606a, #b4bcc4);
          --text-3: light-dark(#87909a, #858e97);
          --accent: #0696d7;
          --accent-hover: #38abdf;
          --accent-text: light-dark(#0679ad, #4cb5ea);
          --accent-soft: light-dark(rgb(6 150 215 / 0.1), rgb(6 150 215 / 0.16));
          --danger: light-dark(#d4372e, #ec4a41);
          --danger-soft: color-mix(in srgb, var(--danger) 14%, transparent);
          --warning: light-dark(#b86e00, #faa21b);
          --success: light-dark(#4f8a10, #87b340);
          --overlay: light-dark(rgb(255 255 255 / 0.94), rgb(31 33 36 / 0.92));
          --shadow: 0 8px 28px light-dark(rgb(20 30 40 / 0.18), rgb(0 0 0 / 0.45));
          --viewport-top: light-dark(#fafbfc, #3d434a);
          --viewport-bottom: light-dark(#d9dee3, #222629);
          --radius: 4px;
          --radius-lg: 8px;
          --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
          --appbar: 52px;
          --tabbar: 58px;
          --safe-top: 0px;
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-left: 0px;
          --safe-right: 0px;
          --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        :root[data-theme="light"] {
          color-scheme: light;
        }

        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        html,
        body,
        #root {
          height: 100%;
          margin: 0;
        }

        html {
          touch-action: manipulation;
        }

        body {
          background: var(--bg);
          color: var(--text);
          font: 14px/1.4 var(--font);
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
          overscroll-behavior: none;
          overflow: hidden;
          text-size-adjust: 100%;
        }

        input,
        textarea,
        [contenteditable] {
          user-select: text;
        }

        button,
        input,
        textarea {
          font: inherit;
          color: inherit;
        }

        button {
          border: 0;
          background: none;
          padding: 0;
          cursor: pointer;
          touch-action: manipulation;
        }

        button:disabled {
          cursor: default;
        }

        :focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        h1,
        h2,
        p {
          margin: 0;
        }

        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .icon {
          flex: none;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .spin {
          animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }

        .text-danger {
          color: var(--danger);
        }

        .text-success {
          color: var(--success);
        }

        .chevron {
          color: var(--text-3);
        }

        .dot {
          display: inline-block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          vertical-align: -1px;
        }
      }

      @layer components {
        .app {
          --statusbar: 0px;
          display: grid;
          grid-template:
            "bar" auto
            "main" minmax(0, 1fr)
            "tabs" auto / minmax(0, 1fr);
          height: var(--tg-viewport, 100dvh);
          padding: var(--safe-top) var(--safe-right) 0 var(--safe-left);
        }

        .appbar {
          grid-area: bar;
        }

        .tabbar {
          grid-area: tabs;
        }

        .app__main {
          position: relative;
          grid-area: main;
          min-width: 0;
          min-height: 0;
          container: main / inline-size;
        }

        .ptree,
        .app-inspector,
        .statusbar {
          display: none;
        }

        @media (width < 600px) {
          .wide-only {
            display: none !important;
          }
        }

        @media (width >= 600px) {
          .app {
            --rail: 76px;
            --statusbar: 26px;
            grid-template:
              "bar bar" auto
              "rail main" minmax(0, 1fr)
              "status status" auto / var(--rail) minmax(0, 1fr);
            padding-bottom: var(--safe-bottom);
          }

          .app > .tabbar {
            grid-area: rail;
            display: flex;
            flex-direction: column;
            gap: 2px;
            height: auto;
            padding: 6px 0;
            overflow-y: auto;
            border-top: 0;
            border-right: 1px solid var(--border);
            scrollbar-width: none;
          }

          .app > .tabbar .tabbar__item {
            flex: none;
            height: 60px;

            &::before {
              top: 12px;
              bottom: 12px;
              left: 0;
              right: auto;
              width: 3px;
              height: auto;
              border-radius: 0 3px 3px 0;
            }
          }

          .app > .statusbar {
            display: flex;
            grid-area: status;
          }

          .narrow-only {
            display: none !important;
          }
        }

        @media (width > 1024px) {
          .app {
            --tree-w: clamp(220px, 17vw, 320px);
            --inspector-w: clamp(300px, 23vw, 400px);
            grid-template:
              "bar bar bar bar" auto
              "rail tree main props" minmax(0, 1fr)
              "status status status status" auto / var(--rail) var(--tree-w) minmax(0, 1fr) var(--inspector-w);
          }

          .app > .ptree {
            display: flex;
            grid-area: tree;
          }

          .app > .app-inspector {
            display: block;
            grid-area: props;
          }
        }

        .appbar {
          display: flex;
          align-items: center;
          gap: 8px;
          height: var(--appbar);
          padding: 0 4px 0 10px;
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
        }

        .appbar__sep {
          width: 1px;
          height: 22px;
          margin: 0 4px;
          background: var(--border);
        }

        @media (width < 400px) {
          .appbar__logo {
            display: none;
          }
        }

        .appbar__logo,
        .splash__logo,
        .gate__logo {
          display: flex;
          flex: none;
          align-items: center;
          justify-content: center;
          white-space: nowrap;
          width: 32px;
          height: 32px;
          border-radius: var(--radius);
          background: var(--accent);
          color: #fff;
          font-weight: 700;
          font-size: 15px;
          letter-spacing: -0.02em;
        }

        .appbar__logo b,
        .splash__logo b,
        .gate__logo b {
          font-weight: 800;
        }

        .appbar__project {
          display: grid;
          flex: 1;
          min-width: 0;
          text-align: start;
          line-height: 1.15;
        }

        .appbar__title {
          display: flex;
          align-items: center;
          gap: 4px;
          min-width: 0;
          font-size: 15px;
          font-weight: 600;
        }

        .appbar__title span {
          display: -webkit-box;
          overflow: hidden;
          line-height: 1.2;
          overflow-wrap: anywhere;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .appbar__subtitle {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        @media (width < 440px) {
          .appbar__subtitle {
            display: none;
          }

          .appbar__title {
            font-size: 14px;
          }
        }

        .appbar__subtitle {
          color: var(--text-3);
          font-size: 11px;
        }

        .appbar__actions {
          display: flex;
          flex: none;
          align-items: center;
          gap: 2px;
        }

        .sync-badge {
          display: grid;
          border-radius: var(--radius);
          place-items: center;
          width: 36px;
          height: 36px;
          color: var(--text-3);
        }

        .sync-badge--ok {
          color: var(--success);
        }

        .sync-badge--busy {
          color: var(--accent-text);
        }

        .sync-badge--warn {
          color: var(--warning);
        }

        .sync-badge--error {
          color: var(--danger);
        }

        .tabbar {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: minmax(0, 1fr);
          height: calc(var(--tabbar) + var(--safe-bottom));

          padding: 0 max(0px, calc((100% - 760px) / 2)) var(--safe-bottom);
          background: var(--surface-1);
          border-top: 1px solid var(--border);
        }

        .tabbar__item {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 3px;
          min-width: 0;
          padding: 6px 2px 4px;
          color: var(--text-3);
          transition: color 0.15s;

          &::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 22%;
            right: 22%;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: transparent;
            transition: background 0.15s;
          }

          &.is-active {
            color: var(--accent-text);
          }

          &.is-active::before {
            background: var(--accent);
          }
        }

        .tabbar__icon {
          position: relative;
          display: grid;
          place-items: center;
        }

        .tabbar__badge {
          position: absolute;
          top: -4px;
          right: -9px;
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 8px;
          background: var(--danger);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
          line-height: 16px;
        }

        .tabbar__label {
          max-width: 100%;
          font-size: clamp(8.5px, calc((100vw / 6 - 6px) / 5.3), 11px);
          font-weight: 600;
          letter-spacing: -0.01em;
          white-space: nowrap;
        }

        .view {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
        }

        .view--center {
          display: grid;
          place-items: center;
          padding: 24px;
        }

        .view__scroll {
          flex: 1;
          min-height: 0;
          overflow-x: hidden;
          overflow-y: auto;
          overscroll-behavior: contain;
        }

        .view__content {
          display: grid;
          gap: 12px;
          width: 100%;
          max-width: 760px;
          margin: 0 auto;
          padding: 12px 12px 24px;

          & > * {
            min-width: 0;
          }
        }

        .dock {
          display: flex;
          gap: 8px;
          padding: 10px 12px;
          background: var(--surface-1);
          border-top: 1px solid var(--border);

          & > .btn {
            flex: 1;
            min-width: 0;
          }
        }

        @container main (width < 480px) {
          .dock > .btn--secondary {
            flex: none;
            width: 44px;
            padding: 0;

            & .btn__label {
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip-path: inset(50%);
              white-space: nowrap;
            }
          }
        }

        @media (width >= 800px) {
          .dock {
            justify-content: center;
          }

          .dock > .btn {
            flex: 0 1 260px;
          }
        }

        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          min-width: 0;
          min-height: 42px;
          padding: 0 16px;
          border: 1px solid transparent;
          border-radius: var(--radius);
          font-size: 14px;
          font-weight: 600;
          line-height: 1.15;
          transition:
            background 0.15s,
            border-color 0.15s,
            opacity 0.15s;
        }

        .btn__label {
          min-width: 0;
          overflow-wrap: anywhere;
          text-wrap: balance;
        }

        .btn--primary {
          background: var(--accent);
          color: #fff;

          &:active:not(:disabled) {
            background: #0580b8;
          }
        }

        .btn--secondary {
          border-color: var(--border-strong);
          background: var(--surface-2);
        }

        .btn--ghost {
          color: var(--accent-text);
        }

        .btn--danger {
          background: var(--danger);
          color: #fff;
        }

        .btn--sm {
          min-height: 34px;
          padding: 0 10px;
          font-size: 13px;
        }

        .btn--lg {
          min-height: 48px;
          font-size: 15px;
        }

        .btn--block {
          width: 100%;
        }

        .btn:disabled {
          opacity: 0.45;
        }

        @media (hover: hover) {
          .btn--primary:hover:not(:disabled) {
            background: var(--accent-hover);
          }

          .btn--secondary:hover:not(:disabled) {
            border-color: var(--accent);
          }

          .icon-btn:hover:not(:disabled) {
            background: var(--surface-3);
          }
        }

        .icon-btn {
          position: relative;
          display: grid;
          flex: none;
          place-items: center;
          width: 40px;
          height: 40px;
          border-radius: var(--radius);
          color: var(--text-2);
          transition: background 0.15s, color 0.15s;

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
          }
        }

        .icon-btn--danger {
          color: var(--danger);
        }

        .icon-btn--overlay {
          color: var(--text);
        }

        .icon-btn:disabled {
          opacity: 0.35;
        }

        .icon-btn__badge {
          position: absolute;
          top: 4px;
          right: 4px;
          min-width: 14px;
          height: 14px;
          border-radius: 7px;
          background: var(--danger);
          color: #fff;
          font-size: 9px;
          font-weight: 700;
          line-height: 14px;
        }

        .button-row {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;

          & .btn {
            flex-direction: column;
            gap: 4px;
            min-height: 60px;
            padding: 8px 4px;
            font-size: 12.5px;
          }

          & .btn__label {
            max-width: 100%;
            white-space: normal;
            text-align: center;
            overflow-wrap: anywhere;
          }
        }

        .form {
          display: grid;
          gap: 14px;

          & > * {
            min-width: 0;
          }
        }

        .form__section-title {
          margin-top: 4px;
          color: var(--text-2);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .form,
        .panel__body,
        .sheet__body {
          container-type: inline-size;
        }

        .grid-2,
        .grid-3 {
          display: grid;
          gap: 10px;
          align-items: end;
        }

        .grid-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        @container (width < 300px) {
          .grid-3 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
        }

        @container (width < 220px) {
          .grid-2,
          .grid-3 {
            grid-template-columns: minmax(0, 1fr);
          }
        }

        .field {
          display: grid;
          gap: 6px;
          min-width: 0;
        }

        .field__head {
          display: flex;
          align-items: center;
          gap: 6px;
          min-width: 0;
        }

        .field__label {
          min-width: 0;
          color: var(--text-2);
          font-size: 12px;
          font-weight: 600;
          line-height: 1.3;
          overflow-wrap: anywhere;
        }

        .field__error {
          font-size: 12px;
          line-height: 1.35;
          overflow-wrap: anywhere;
        }

        .help {
          display: inline-grid;
          flex: none;
          place-items: center;
          width: 16px;
          height: 16px;
          border: 1px solid var(--border-strong);
          border-radius: 50%;
          color: var(--text-3);
          font-size: 10px;
          font-weight: 700;
          line-height: 1;

          &::before {
            position: absolute;
            inset: -12px;
            content: "";
          }

          position: relative;

          @media (hover: hover) {
            &:hover {
              border-color: var(--accent);
              color: var(--accent-text);
            }
          }
        }

        .help__popover {
          position: fixed;
          inset: auto;
          margin: 0;
          padding: 10px 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-1);
          box-shadow: var(--shadow);
          color: var(--text);
          font-size: 12px;
          font-weight: 400;
          line-height: 1.45;
          text-align: start;
          white-space: normal;
        }

        .note {
          color: var(--text-3);
          font-size: 12px;
          line-height: 1.4;
          overflow-wrap: anywhere;
        }

        .note--warning {
          color: var(--warning);
        }

        .field__error {
          color: var(--danger);
        }

        .input {
          display: flex;
          align-items: center;
          min-width: 0;
          min-height: 42px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
          transition: border-color 0.15s, box-shadow 0.15s;

          &:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
          }
        }

        .has-error .input {
          border-color: var(--danger);
        }

        .input.is-disabled {
          opacity: 0.5;
        }

        .input input,
        .input textarea {
          flex: 1;
          width: 100%;
          min-width: 0;
          padding: 9px 10px;
          border: 0;
          outline: 0;
          background: transparent;
          font-size: 15px;
        }

        .input textarea {
          min-height: 72px;
          resize: vertical;
        }

        .input select {
          flex: 1;
          width: 100%;
          min-width: 0;
          padding: 9px 34px 9px 10px;
          border: 0;
          outline: 0;
          background: transparent;
          font-size: 15px;
          appearance: none;
          color: inherit;
        }

        .input--select {
          position: relative;
        }

        .input__chevron {
          position: absolute;
          right: 10px;
          pointer-events: none;
          color: var(--text-3);
        }

        .input__unit {
          flex: none;
          padding-right: 10px;
          color: var(--text-3);
          font-size: 12px;
        }

        .toggle {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          min-height: 42px;
          cursor: pointer;

          &.is-disabled {
            opacity: 0.5;
            cursor: default;
          }
        }

        .toggle__text {
          display: flex;
          align-items: center;
          gap: 6px;
          min-width: 0;
        }

        .toggle__label {
          font-size: 14px;
          font-weight: 500;
        }

        .switch {
          position: relative;
          flex: none;
          width: 42px;
          height: 24px;
          margin: 0;
          border-radius: 12px;
          background: var(--border-strong);
          appearance: none;
          cursor: pointer;
          transition: background 0.15s;

          &::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
            transition: transform 0.15s;
          }

          &:checked {
            background: var(--accent);
          }

          &:checked::before {
            transform: translateX(18px);
          }

          &:disabled {
            opacity: 0.5;
          }
        }

        .segmented {
          display: flex;
          width: 100%;
          min-width: 0;
          padding: 3px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
        }

        .segmented__item {
          flex: 1 1 0;
          min-width: 0;
          min-height: 36px;
          padding: 6px 6px;
          border-radius: 3px;
          color: var(--text-2);
          font-size: 13px;
          font-weight: 600;
          line-height: 1.15;
          overflow-wrap: anywhere;

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
            box-shadow: inset 0 -2px 0 var(--accent);
          }
        }

        .segmented--sm .segmented__item {
          min-height: 32px;
          font-size: 12px;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          min-width: 0;
        }

        .chip {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          max-width: 100%;
          min-height: 32px;
          padding: 4px 12px;
          border: 1px solid var(--border-strong);
          border-radius: 16px;
          background: var(--surface-2);
          color: var(--text-2);
          font-size: 13px;
          font-weight: 500;
          line-height: 1.2;
          text-align: start;

          & span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          &.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-text);
          }

          &:disabled {
            opacity: 0.4;
          }
        }

        .chip__dot {
          flex: none;
          width: 9px;
          height: 9px;
          border-radius: 50%;
        }

        .swatches {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .swatch {
          width: 28px;
          height: 28px;
          border: 2px solid transparent;
          border-radius: 50%;
          box-shadow: inset 0 0 0 2px var(--surface-1);

          &.is-active {
            border-color: var(--text);
          }
        }

        .swatch--custom {
          position: relative;
          display: grid;
          place-items: center;
          background: conic-gradient(#ec4a41, #f5a524, #87b340, #3aa3e3, #9b7cf0, #ec4a41);
          cursor: pointer;

          & input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
          }
        }

        .slider {
          width: 100%;
          accent-color: var(--accent);
        }

        .anchor-field {
          display: flex;
          align-items: center;
          gap: 14px;
          min-width: 0;
        }

        .anchor-field__text {
          display: grid;
          gap: 4px;
          min-width: 0;

          & small {
            color: var(--text-3);
            font-size: 12px;
          }
        }

        .anchor-grid {
          display: grid;
          flex: none;
          grid-template-columns: repeat(3, 40px);
          grid-auto-rows: 40px;
          gap: 4px;
          padding: 4px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
        }

        .anchor-grid__cell {
          border-radius: 3px;
          background: var(--surface-3);
          color: var(--text-2);
          font-size: 16px;

          &:disabled {
            opacity: 0.22;
          }

          &.is-active {
            background: var(--accent);
            color: #fff;
          }
        }

        .search {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 6px;
          min-width: 0;
          height: 36px;
          padding: 0 4px 0 10px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
          color: var(--text-3);

          & input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
          }

          & .icon-btn {
            width: 30px;
            height: 30px;
          }
        }

        .inline-alert {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 10px 12px;
          border-radius: var(--radius);
          background: var(--danger-soft);
          color: var(--danger);
          font-size: 13px;
          overflow-wrap: anywhere;
        }

        .panel {
          min-width: 0;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-1);
        }

        .panel__header {
          display: flex;
          align-items: center;
          gap: 4px;
          min-height: 46px;
          padding-right: 6px;
        }

        .panel__toggle {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 8px;
          min-width: 0;
          min-height: 46px;
          padding: 0 12px;
          text-align: start;
        }

        .panel__chevron {
          color: var(--text-3);
          transition: transform 0.2s;
        }

        .panel.is-collapsed .panel__chevron {
          transform: rotate(-90deg);
        }

        .panel__icon {
          color: var(--accent-text);
        }

        .panel__title {
          color: var(--text);
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          overflow-wrap: anywhere;
        }

        .panel__aside {
          display: flex;
          flex: none;
          align-items: center;
          gap: 2px;
        }

        .panel__body {
          padding: 4px 14px 16px;
        }

        .panel__body--flush {
          padding: 0 0 4px;
        }

        .card {
          display: grid;
          gap: 12px;
          min-width: 0;
          padding: 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-2);
        }

        .card__row {
          display: flex;
          align-items: flex-end;
          gap: 10px;
          min-width: 0;

          & .field {
            flex: 1;
          }
        }

        .card__swatch {
          flex: none;
          width: 10px;
          height: 42px;
          border-radius: 3px;
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--text) 18%, transparent);
        }

        .card__head {
          display: flex;
          align-items: center;
          gap: 10px;
          min-width: 0;

        }

        .card__title {
          display: grid;
          flex: 1;
          min-width: 0;
          line-height: 1.3;

          & b,
          & small {
            overflow-wrap: anywhere;
          }

          & b {
            font-size: 14px;
          }

          & small {
            color: var(--text-2);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
          }
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(var(--stats-cols, 3), minmax(0, 1fr));
          gap: 1px;
          margin: 0;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--border);
        }

        .stats__item {
          min-width: 0;
          padding: 10px clamp(8px, 2.5vw, 12px);
          background: var(--surface-1);
        }

        .stats dt {
          color: var(--text-3);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          overflow-wrap: anywhere;
        }

        .stats dd {
          margin: 2px 0 0;
          overflow: hidden;
          font-size: 17px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .panel .stats {
          border-width: 0 0 1px;
          border-radius: 0;
        }

        .tag,
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          min-width: 0;
          padding: 0 7px;
          border-radius: 3px;
          background: var(--surface-3);
          color: var(--text-2);
          font-size: 11px;
          font-weight: 600;
          line-height: 20px;
          white-space: nowrap;
        }

        .badge {
          background: var(--overlay);
          box-shadow: 0 0 0 1px var(--border);
        }

        .badge--accent {
          background: var(--accent);
          color: #fff;
          box-shadow: none;
        }

        .badge--danger {
          background: var(--danger);
          color: #fff;
          box-shadow: none;
        }

        .state {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          width: 100%;
          min-height: 100%;
          margin: auto;
          padding: 32px 24px;
          text-align: center;
        }

        .state--compact {
          min-height: 0;
          padding: 16px;
        }

        .state__icon {
          color: var(--text-3);
        }

        .state__icon--accent {
          color: var(--accent-text);
        }

        .state--error .state__icon,
        .state--error .state__title {
          color: var(--danger);
        }

        .state__title {
          max-width: 420px;
          font-size: 15px;
          font-weight: 600;
          overflow-wrap: anywhere;
        }

        .state__text {
          max-width: 420px;
          color: var(--text-2);
          font-size: 13px;
          overflow-wrap: anywhere;
        }

        .state__action {
          margin-top: 4px;
        }

        .sheet,
        .dialog {
          padding: 0;
          border: 0;
          color: inherit;
          background: var(--surface-1);
          box-shadow: var(--shadow);
          outline: 0;
          overscroll-behavior: contain;
          transition:
            translate 0.24s var(--ease-out),
            opacity 0.2s,
            scale 0.2s var(--ease-out),
            overlay 0.24s allow-discrete,
            display 0.24s allow-discrete;

          &::backdrop {
            background: rgb(0 0 0 / 0);
            transition:
              background 0.24s,
              overlay 0.24s allow-discrete,
              display 0.24s allow-discrete;
          }

          &[open]::backdrop {
            background: rgb(0 0 0 / 0.5);
          }

          @starting-style {
            &[open]::backdrop {
              background: rgb(0 0 0 / 0);
            }
          }
        }

        .sheet {
          width: 100%;
          max-width: 100%;
          max-height: calc(var(--tg-viewport, 100dvh) - var(--safe-top) - 16px);
          margin: auto 0 0;
          border-radius: 12px 12px 0 0;
          translate: 0 100%;

          &[open] {
            display: flex;
            flex-direction: column;
            translate: 0 0;
          }

          @starting-style {
            &[open] {
              translate: 0 100%;
            }
          }
        }

        .sheet__grip {
          width: 36px;
          height: 4px;
          margin: 8px auto 0;
          border-radius: 2px;
          background: var(--border-strong);
        }

        .sheet__header {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 8px 8px 8px 16px;
          border-bottom: 1px solid var(--border);
        }

        .sheet__titles {
          flex: 1;
          min-width: 0;
          padding-top: 6px;
        }

        .sheet__title {
          font-size: 16px;
          font-weight: 700;
          line-height: 1.3;
          overflow-wrap: anywhere;
          text-wrap: balance;
        }

        .sheet__subtitle {
          margin-top: 2px;
          color: var(--text-3);
          font-size: 12px;
          overflow-wrap: anywhere;
        }

        .sheet__body {
          flex: 1;
          min-height: 0;
          overflow: hidden auto;
          overscroll-behavior: contain;
          padding: 14px 16px 20px;
        }

        .sheet__footer {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 12px calc(10px + var(--safe-bottom));
          border-top: 1px solid var(--border);

          & .btn {
            flex: 1;
          }
        }

        .sheet-tabs {
          position: sticky;
          top: -14px;
          z-index: 2;
          margin: -14px -16px 14px;
          padding: 10px 16px;
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
        }

        @media (width >= 600px) {
          .sheet {
            width: min(440px, 100vw - 64px);
            max-width: none;
            height: var(--tg-viewport, 100dvh);
            max-height: none;
            margin: 0 0 0 auto;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) 0;
            border-left: 1px solid var(--border);
            border-radius: 0;
            translate: 100% 0;

            &[open] {
              translate: 0 0;
            }

            @starting-style {
              &[open] {
                translate: 100% 0;
              }
            }
          }

          .sheet--lg {
            width: min(600px, 100vw - 64px);
          }

          .sheet__grip {
            display: none;
          }

          .sheet__footer {
            padding-bottom: 10px;
          }
        }

        @media (width > 1024px) {
          .sheet[data-docked] {
            position: fixed;
            inset: calc(var(--safe-top) + var(--appbar)) var(--safe-right) calc(var(--safe-bottom) + var(--statusbar, 26px)) auto;
            z-index: 5;
            width: clamp(300px, 23vw, 400px);
            height: auto;
            padding: 0;
            box-shadow: none;
            translate: none;
            transition: none;
          }
        }

        .dialog {
          width: calc(100% - 48px);
          max-width: 400px;
          margin: auto;
          border-radius: var(--radius-lg);
          opacity: 0;
          scale: 0.97;

          &[open] {
            display: grid;
            gap: 10px;
            padding: 20px;
            opacity: 1;
            scale: 1;
          }

          @starting-style {
            &[open] {
              opacity: 0;
              scale: 0.97;
            }
          }
        }

        .dialog__title {
          font-size: 17px;
          font-weight: 700;
          overflow-wrap: anywhere;
          text-wrap: balance;
        }

        .dialog__text {
          color: var(--text-2);
          overflow-wrap: anywhere;
          text-wrap: pretty;
        }

        .dialog__actions {
          display: flex;
          justify-content: flex-end;
          gap: 8px;
          margin-top: 8px;
        }

        .statusbar {
          align-items: center;
          gap: 0;
          height: var(--statusbar);
          overflow-x: auto;
          padding: 0 8px;
          border-top: 1px solid var(--border);
          background: var(--surface-1);
          color: var(--text-3);
          font-size: 11.5px;
          white-space: nowrap;
          scrollbar-width: none;
        }

        .statusbar__item {
          display: inline-flex;
          flex: none;
          align-items: center;
          gap: 5px;
          height: 100%;
          padding: 0 10px;
          border-right: 1px solid var(--border);
          color: inherit;
          font-variant-numeric: tabular-nums;

          &.is-danger {
            color: var(--danger);
            font-weight: 600;
          }

          &.is-warn,
          &.is-warning {
            color: var(--warning);
          }

          &.is-ok {
            color: var(--success);
          }

          &.is-busy {
            color: var(--accent-text);
          }
        }

        button.statusbar__item:hover {
          background: var(--surface-2);
        }

        .statusbar__sync {
          padding-left: 2px;
        }

        .statusbar__end {
          margin-left: auto;
          border-right: 0;
          border-left: 1px solid var(--border);
        }

        .ptree {
          flex-direction: column;
          min-height: 0;
          border-right: 1px solid var(--border);
          background: var(--surface-1);
        }

        .ptree__head,
        .app-inspector__title {
          display: flex;
          flex: none;
          align-items: center;
          gap: 8px;
          height: 34px;
          padding: 0 12px;
          border-bottom: 1px solid var(--border);
          color: var(--text-2);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .ptree__root {
          flex: 1;
          min-height: 0;
          overflow: auto;
          padding: 4px 0 12px;
        }

        .ptree__group {
          padding-left: 14px;
        }

        .ptree__row {
          display: flex;
          align-items: center;
          width: 100%;
          min-height: 28px;
          min-width: 0;
        }

        .ptree__twisty {
          display: grid;
          flex: none;
          place-items: center;
          width: 22px;
          height: 28px;
          color: var(--text-3);
        }

        .ptree__chevron {
          transition: rotate 0.15s;

          &.is-open {
            rotate: 90deg;
          }
        }

        .ptree__label,
        .ptree__item {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 7px;
          min-width: 0;
          height: 28px;
          padding: 0 8px 0 2px;
          border-radius: var(--radius);
          font-size: 13px;
          text-align: start;

          & > span,
          & .ptree__name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            flex: none;
            color: var(--text-3);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
          }

          &:hover {
            background: var(--surface-2);
          }
        }

        .ptree__label {
          height: auto;
          min-height: 28px;
          padding-block: 4px;
          font-weight: 600;

          & > span {
            white-space: normal;
            overflow-wrap: anywhere;
          }
        }

        .ptree__item {
          height: auto;
          min-height: 32px;
          padding: 4px 8px 4px 24px;

          & .ptree__text {
            display: grid;
            flex: 1;
            min-width: 0;
            line-height: 1.25;
          }

          & .ptree__name {
            white-space: normal;
            overflow-wrap: anywhere;
          }

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
            box-shadow: inset 2px 0 var(--accent);
          }
        }

        .ptree__dot {
          flex: none;
          width: 6px;
          height: 6px;
          border-radius: 1px;
          background: var(--border-strong);
        }

        .ptree__swatch {
          flex: none;
          width: 10px;
          height: 10px;
          border-radius: 2px;
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--text) 20%, transparent);
        }

        .ptree__action {
          display: grid;
          flex: none;
          place-items: center;
          width: 26px;
          height: 26px;
          margin-right: 6px;
          border-radius: var(--radius);
          color: var(--text-3);

          &:hover {
            background: var(--surface-2);
            color: var(--accent-text);
          }
        }

        .app-inspector {
          min-height: 0;
          overflow: auto;
          border-left: 1px solid var(--border);
          background: var(--surface-1);
        }

        .app-inspector__body {
          display: grid;
          gap: 12px;
          padding-bottom: 16px;

          & .props,
          & .button-row {
            margin: 0 12px;
          }
        }

        .product-group {
          display: grid;
          gap: 6px;
        }

        .product-group__head {
          display: flex;
          align-items: center;
          gap: 4px;
          min-width: 0;
        }

        .product-group__title {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 8px;
          min-width: 0;
          min-height: 36px;
          padding: 0 6px;
          border-radius: var(--radius);
          text-align: start;

          & b {
            min-width: 0;
            overflow-wrap: anywhere;
          }

          & small {
            color: var(--text-3);
            font-size: 12px;
            white-space: nowrap;
          }

          &:hover {
            background: var(--surface-2);
          }
        }

        .product-group__fx,
        .part-row__fx {
          color: var(--accent-text);
        }

        .product-group__empty {
          padding: 4px 8px 8px;
        }

        .part-list__item {
          content-visibility: auto;
          contain-intrinsic-size: auto 66px;
        }

        .part-row.is-active {
          background: var(--accent-soft);
          box-shadow: inset 0 0 0 1px var(--accent);
        }

        .product-switch {
          padding: 8px 12px 0;
        }

        .menu {
          position: fixed;
          inset: auto;
          min-width: 220px;
          max-width: min(320px, calc(100vw - 16px));
          max-height: calc(100dvh - 16px);
          margin: 0;
          padding: 4px;
          overflow: auto;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-1);
          box-shadow: var(--shadow);
          color: var(--text);
        }

        .menu__item {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 36px;
          padding: 0 10px;
          border-radius: 3px;
          font-size: 13.5px;
          text-align: start;

          &.has-divider {
            margin-top: 5px;
            position: relative;

            &::before {
              content: "";
              position: absolute;
              inset: -3px 0 auto;
              height: 1px;
              background: var(--border);
            }
          }

          &:hover:not(:disabled),
          &:focus-visible {
            background: var(--accent-soft);
            outline: 0;
          }

          &.is-danger {
            color: var(--danger);
          }

          &:disabled {
            opacity: 0.45;
          }
        }

        .menu__spacer {
          width: 16px;
        }

        .menu__label {
          flex: 1;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        .menu__shortcut,
        .palette kbd {
          padding: 1px 5px;
          border: 1px solid var(--border);
          border-radius: 3px;
          color: var(--text-3);
          font: 600 10.5px/1.5 var(--font);
          white-space: nowrap;
        }

        .palette {
          width: min(640px, calc(100vw - 24px));
          max-height: min(560px, calc(var(--tg-viewport, 100dvh) - 96px));
          margin: max(56px, 12dvh) auto auto;
          padding: 0;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius-lg);
          background: var(--surface-1);
          box-shadow: var(--shadow);
          color: inherit;

          &[open] {
            display: flex;
            flex-direction: column;
          }

          &::backdrop {
            background: rgb(0 0 0 / 0.45);
          }
        }

        .palette__search {
          display: flex;
          flex: none;
          align-items: center;
          gap: 10px;
          padding: 0 12px;
          border-bottom: 1px solid var(--border);
          color: var(--text-3);

          & input {
            flex: 1;
            min-width: 0;
            height: 48px;
            border: 0;
            background: none;
            font-size: 15px;
            outline: 0;
          }
        }

        .palette__list {
          flex: 1;
          min-height: 0;
          overflow: auto;
          padding: 6px;
        }

        .palette__item {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 38px;
          padding: 0 10px;
          border-radius: var(--radius);
          text-align: start;

          & small {
            color: var(--text-3);
            font-size: 11.5px;
            white-space: nowrap;
          }

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
          }
        }

        .palette__label {
          flex: 1;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        .palette__empty {
          padding: 24px;
          color: var(--text-3);
          text-align: center;
        }

        .vars {
          display: grid;
          gap: 6px;
        }

        .vars__head,
        .vars__row {
          display: grid;
          grid-template-columns: minmax(56px, 0.6fr) minmax(0, 1.6fr) minmax(64px, 0.8fr) 40px;
          align-items: center;
          gap: 6px;
        }

        .vars__head {
          color: var(--text-3);
          font-size: 11px;
          font-weight: 600;
        }

        .vars__name,
        .vars__expr {
          min-width: 0;
          height: 36px;
          padding: 0 8px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--input);
          font: 500 13.5px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;

          &:focus {
            border-color: var(--accent);
            outline: 0;
          }
        }

        .vars__value {
          color: var(--text-2);
          font-variant-numeric: tabular-nums;
          text-align: end;

          &.is-error {
            color: var(--danger);
            font-weight: 600;
          }
        }

        .vars__error {
          grid-column: 1 / -1;
        }

        .input--formula input {
          color: var(--accent-text);
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        .template-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 8px;
        }

        .template-card {
          display: grid;
          gap: 6px;
          justify-items: start;
          width: 100%;
          height: 100%;
          padding: 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);
          color: var(--accent-text);
          text-align: start;

          & b {
            color: var(--text);
            font-size: 14px;
          }

          & small {
            color: var(--text-3);
            font-size: 11.5px;
            overflow-wrap: anywhere;
          }

          &:hover {
            border-color: var(--accent);
          }
        }

        .dropzone {
          position: fixed;
          inset: 12px;
          z-index: 50;
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 10px;
          border: 2px dashed var(--accent);
          border-radius: var(--radius-lg);
          background: color-mix(in oklab, var(--bg) 85%, transparent);
          color: var(--accent-text);
          pointer-events: none;
        }

        .import__preview {
          width: 100%;
          max-height: 240px;
          object-fit: contain;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: #fff;
        }

        .viewer-readout {
          position: absolute;
          top: 10px;
          left: 50%;
          z-index: 3;
          display: grid;
          justify-items: center;
          gap: 2px;
          padding: 6px 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--overlay);
          translate: -50% 0;
          font-variant-numeric: tabular-nums;

          & b {
            color: var(--accent-text);
            font-size: 15px;
          }

          & small {
            color: var(--text-3);
            font-size: 11px;
          }
        }

        .sync-card {
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
          text-align: start;

          & > span {
            display: grid;
            flex: 1;
            min-width: 0;
          }

          & small {
            color: var(--text-3);
            overflow-wrap: anywhere;
          }

          &.is-ok > .icon:first-child {
            color: var(--success);
          }

          &.is-warn > .icon:first-child {
            color: var(--warning);
          }

          &.is-error > .icon:first-child {
            color: var(--danger);
          }
        }

        .toasts {
          position: fixed;
          inset: calc(var(--safe-top) + var(--appbar) + 8px) auto auto 50%;
          width: min(480px, calc(100% - 24px));
          margin: 0;
          padding: 0;
          overflow: visible;
          border: 0;
          background: none;
          translate: -50% 0;
          pointer-events: none;
        }

        .toast {
          position: relative;
          display: flex;
          align-items: flex-start;
          gap: 10px;
          width: 100%;
          overflow: hidden;
          padding: 11px 12px 11px 16px;
          border-radius: 6px;
          background: #2b2f33;
          color: #fff;
          box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
          text-align: start;
          pointer-events: auto;
          --tone: var(--success);
          transition:
            opacity 0.18s,
            translate 0.18s var(--ease-out);

          @starting-style {
            opacity: 0;
            translate: 0 -8px;
          }

          & + & {
            margin-top: 8px;
          }

          &::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            background: var(--tone);
          }

          & > .icon {
            margin-top: 1px;
            color: var(--tone);
          }
        }

        .toast--error {
          --tone: var(--danger);
        }

        .toast--warning {
          --tone: var(--warning);
        }

        .toast--info {
          --tone: var(--accent-hover);
        }

        .toast__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          font-size: 13px;
          overflow-wrap: anywhere;

          & b {
            font-size: 13.5px;
          }

          & span {
            color: #d4d8dc;
          }
        }

        .toast__close {
          margin-top: 2px;
          color: #8f979f;
        }

        .list-toolbar {
          display: flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
        }

        .list-toolbar__count {
          flex: 1;
          font-weight: 600;
          text-align: center;
        }

        .part-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-1);

          & li + li {
            border-top: 1px solid var(--border);
          }
        }

        .part-row {
          display: grid;
          grid-template-columns: 30px minmax(0, 1fr) auto 16px;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 60px;
          padding: 8px 10px 8px 12px;
          box-shadow: inset 3px 0 0 hsl(var(--hue, 200) 55% 55%);
          text-align: start;

          &:active {
            background: var(--surface-2);
          }

          &.is-selected {
            background: var(--accent-soft);
          }

          &.has-issue {
            box-shadow: inset 3px 0 0 var(--danger);
          }
        }

        .part-row__no {
          display: grid;
          place-items: center;
          width: 30px;
          height: 30px;
          border-radius: var(--radius);
          background: light-dark(hsl(var(--hue, 200) 60% 90%), hsl(var(--hue, 200) 30% 30% / 0.55));
          color: var(--text);
          font-size: 13px;
          font-weight: 700;
        }

        .part-row__main {
          display: grid;
          gap: 3px;
          min-width: 0;
        }

        .part-row__name {
          font-size: 14.5px;
          font-weight: 600;
          overflow-wrap: anywhere;
        }

        .part-row__meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 4px 8px;
          min-width: 0;
          color: var(--text-2);
          font-size: 12px;
        }

        .part-row__aside {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .part-row__lock {
          color: var(--text-3);
        }

        .part-row__qty {
          min-width: 44px;
          padding: 2px 8px;
          border-radius: 12px;
          background: var(--surface-3);
          font-size: 12px;
          font-weight: 700;
          text-align: center;
          white-space: nowrap;
        }

        @media (width <= 359px) {
          .part-row__lock,
          .part-row__aside .edge-glyph {
            display: none;
          }
        }

        .checkbox {
          display: grid;
          place-items: center;
          width: 24px;
          height: 24px;
          margin: 3px;
          border: 2px solid var(--border-strong);
          border-radius: 4px;
          color: #fff;

          &.is-checked {
            border-color: var(--accent);
            background: var(--accent);
          }
        }

        .edge-glyph {
          display: inline-block;
          flex: none;
          border: 3px solid transparent;
          border-radius: 2px;
          background: var(--surface-3);
        }

        .edge-editor {
          display: grid;
          gap: 12px;
        }

        .edge-editor__head {
          display: flex;
          align-items: flex-start;
          gap: 14px;
        }

        .edge-editor__quick {
          display: grid;
          flex: 1;
          gap: 6px;
          min-width: 0;
        }

        .edge-editor__row {
          display: grid;
          grid-template-columns: 52px minmax(0, 1fr);
          align-items: start;
          gap: 8px;
        }

        .edge-editor__side {
          display: grid;
          padding-top: 4px;
          line-height: 1.2;

          & small {
            color: var(--text-3);
            font-size: 11px;
          }
        }

        .schematic {
          position: relative;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius);

          & canvas {
            display: block;
            touch-action: manipulation;
          }
        }

        .schematic__empty {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          color: var(--text-3);
          font-size: 13px;
        }

        .feature-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-2);
        }

        .feature-row {
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
          min-height: 52px;
          padding: 8px 10px 8px 14px;
          border-bottom: 1px solid var(--border);
          text-align: start;

          &:last-child {
            border-bottom: 0;
          }

          &:active {
            background: var(--surface-3);
          }
        }

        .feature-row__dot {
          flex: none;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--dot, var(--text-3));

          &.is-ring {
            border: 2px dashed var(--dot);
            background: transparent;
          }

          &.is-square {
            border: 2px solid var(--text-3);
            border-radius: 2px;
            background: transparent;
          }
        }

        .feature-row__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;

          & b {
            font-size: 14px;
            font-weight: 600;
          }

          & small {
            overflow: hidden;
            color: var(--text-2);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        }

        .preset-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 8px;
        }

        .preset-card {
          display: grid;
          align-content: start;
          gap: 4px;
          min-width: 0;
          min-height: 66px;
          padding: 10px 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-2);
          text-align: start;

          & b {
            font-size: 14px;
            font-weight: 600;
          }

          & small {
            color: var(--text-2);
            font-size: 11.5px;
            line-height: 1.3;
          }

          &.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: inset 3px 0 0 var(--accent);
          }
        }

        .group-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 6px 4px 6px 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);
        }

        .group-row__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;

          & b {
            overflow-wrap: anywhere;
          }

          & small {
            color: var(--text-2);
            font-size: 12px;
          }
        }

        .bulk-preview {
          display: grid;
          gap: 6px;
          padding: 10px 12px;
          border: 1px dashed var(--border-strong);
          border-radius: var(--radius);
          font-size: 12.5px;

          & div {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
          }

          & span,
          & b {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & span,
          & small {
            color: var(--text-3);
          }
        }

        .section-nav {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding: 8px max(12px, calc((100% - 760px) / 2 + 12px));
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
          scrollbar-width: none;
        }

        .section-nav__item {
          flex: none;
          min-height: 30px;
          padding: 0 12px;
          border: 1px solid var(--border-strong);
          border-radius: 15px;
          color: var(--text-2);
          font-size: 12.5px;
          font-weight: 600;

          &:active {
            background: var(--accent-soft);
            color: var(--accent-text);
          }
        }

        .view__content .panel {
          scroll-margin-top: 8px;
        }

        .mode-list,
        .doc-list {
          display: grid;
          gap: 8px;
        }

        .mode,
        .doc {
          display: flex;
          align-items: center;
          gap: 12px;
          min-width: 0;
          padding: 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-2);
          text-align: start;
        }

        .mode.is-active,
        .doc.is-active {
          border-color: var(--accent);
          background: var(--accent-soft);
        }

        .doc.is-muted .doc__text small {
          color: var(--warning);
        }

        .mode__radio,
        .radio {
          flex: none;
          width: 20px;
          height: 20px;
          border: 2px solid var(--border-strong);
          border-radius: 50%;
        }

        .mode.is-active .mode__radio,
        .doc.is-active .radio {
          border: 6px solid var(--accent);
        }

        .mode__text,
        .doc__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
        }

        .mode__text b,
        .doc__text b {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 0 8px;
          font-size: 14.5px;
          font-weight: 600;
        }

        .doc__text em {
          color: var(--text-3);
          font-size: 11px;
          font-style: normal;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .mode__text small,
        .doc__text small {
          color: var(--text-2);
          font-size: 12px;
          overflow-wrap: anywhere;
        }

        .doc__icon {
          display: grid;
          flex: none;
          place-items: center;
          width: 40px;
          height: 40px;
          border-radius: var(--radius);
          background: var(--surface-3);
          color: var(--accent-text);
        }

        .list-editor {
          display: grid;
          gap: 10px;

          &.is-disabled {
            opacity: 0.55;
          }
        }

        .list-editor__row {
          display: grid;
          grid-template-columns: 22px minmax(0, 1fr) 40px;
          align-items: end;
          gap: 8px;
        }

        .list-editor__extra {
          grid-column: 2 / -1;
        }

        .list-editor__index {
          padding-bottom: 12px;
          color: var(--text-3);
          font-weight: 700;
        }

        .list-editor__fields {
          display: grid;
          gap: 8px;
        }

        @media (width <= 420px) {
          .list-editor__fields {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          }
        }

        .table-wrap {
          overflow-x: auto;
        }

        .table {
          width: 100%;
          border-collapse: collapse;
          font-size: 13.5px;

          & th {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-3);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: start;
            text-transform: uppercase;
          }

          & td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
          }

          & .num {
            text-align: right;
            white-space: nowrap;
          }
        }

        .table__group td {
          padding-top: 12px;
          background: var(--surface-2);
          color: var(--accent-text);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .table__group small {
          color: var(--text-3);
          font-weight: 500;
          letter-spacing: 0;
          text-transform: none;
        }

        .table__name {
          display: block;
          overflow-wrap: anywhere;
        }

        .table__sub {
          display: block;
          margin-top: 2px;
          color: var(--text-3);
          font-size: 12px;
        }

        .table tr.is-clickable {
          cursor: pointer;
        }

        .table tr.is-clickable:active {
          background: var(--surface-2);
        }

        .table tfoot td {
          color: var(--text-2);
        }

        .table__total td {
          color: var(--text);
          font-size: 15px;
          font-weight: 700;
        }

        .view--layout {
          gap: 0;

          & > .stats {
            border-width: 1px 0 0;
            border-radius: 0;
          }
        }

        .viewport {
          position: relative;
          flex: 1;
          min-height: 240px;
          overflow: hidden;
          background: linear-gradient(180deg, var(--viewport-top), var(--viewport-bottom));
        }

        .viewport__canvas {
          position: absolute;
          inset: 0;
          touch-action: none;

          & canvas {
            display: block;
          }
        }

        .viewport__top {
          position: absolute;
          top: 10px;
          left: 10px;
          right: 10px;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
          pointer-events: none;

          & > * {
            pointer-events: auto;
          }
        }

        .pager {
          display: flex;
          align-items: center;
          min-width: 0;
          max-width: 100%;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);

          & .icon-btn {
            width: 36px;
            height: 36px;
          }
        }

        .pager__label {
          display: grid;
          min-width: 0;
          padding: 2px 4px;
          line-height: 1.2;
          text-align: center;

          & b {
            overflow: hidden;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            overflow: hidden;
            color: var(--text-3);
            font-size: 11px;
            white-space: nowrap;
          }
        }

        .viewer-toolbar {
          position: absolute;
          bottom: 12px;
          left: 50%;
          z-index: 3;
          display: flex;
          align-items: center;
          gap: 2px;
          max-width: calc(100% - 16px);
          padding: 4px;
          overflow-x: auto;
          border-radius: 6px;
          background: rgb(32 35 38 / 0.94);
          box-shadow: 0 4px 16px rgb(0 0 0 / 0.35);
          transform: translateX(-50%);
          scrollbar-width: none;

          & .icon-btn {
            width: 40px;
            height: 40px;
            color: #e8ecef;
          }

          & .icon-btn.is-active {
            background: rgb(6 150 215 / 0.3);
            color: #7fd0f5;
          }
        }

        .viewer-toolbar__sep {
          flex: none;
          width: 1px;
          height: 24px;
          margin: 0 3px;
          background: rgb(255 255 255 / 0.16);
        }

        .inspector {
          position: absolute;
          left: 10px;
          right: 10px;
          bottom: 64px;
          z-index: 4;
          display: flex;
          align-items: center;
          gap: 10px;
          max-width: 560px;
          margin: 0 auto;
          padding: 10px 6px 10px 12px;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
        }

        .inspector__swatch {
          flex: none;
          width: 6px;
          align-self: stretch;
          border-radius: 3px;
          background: hsl(var(--hue) 55% 55%);
        }

        .inspector__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          font-size: 12.5px;

          & b {
            overflow: hidden;
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & > span {
            color: var(--text-2);
            overflow-wrap: anywhere;
          }
        }

        .inspector__edges {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;

          & i {
            padding: 0 6px;
            border-left: 3px solid var(--edge);
            background: var(--surface-3);
            font-size: 11px;
            font-style: normal;
          }
        }

        .thumbs {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding: 8px 12px;
          background: var(--surface-1);
          border-top: 1px solid var(--border);
          scrollbar-width: thin;
        }

        .thumb {
          position: relative;
          display: grid;
          flex: none;
          gap: 4px;
          padding: 6px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);

          &.is-active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
          }
        }

        .thumb__count {
          position: absolute;
          top: 3px;
          right: 3px;
          padding: 0 4px;
          border-radius: 3px;
          background: var(--accent);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
        }

        .thumb__meta {
          display: flex;
          justify-content: space-between;
          gap: 6px;
          font-size: 11px;

          & span {
            color: var(--text-3);
          }
        }

        .viewport3d {
          position: relative;
          height: min(58vh, 540px);
          min-height: 300px;
          overflow: hidden;
          background: linear-gradient(180deg, var(--viewport-top) 0%, var(--viewport-bottom) 100%);
          border-bottom: 1px solid var(--border);

          & > .state {
            height: 100%;
          }
        }

        .viewer {
          position: absolute;
          inset: 0;
          touch-action: none;
        }

        .viewer__canvas {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
        }

        .viewer.is-fullscreen {
          position: fixed;
          z-index: 40;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
          background: linear-gradient(180deg, var(--viewport-top) 0%, var(--viewport-bottom) 100%);
        }

        .viewer--fallback {
          display: flex;
          flex-direction: column;
        }

        .viewer__stage {
          position: relative;
          flex: 1;
          min-height: 0;

          & canvas {
            position: absolute;
            inset: 0;
          }
        }

        .viewer-banner {
          display: flex;
          flex: none;
          align-items: center;
          gap: 10px;
          width: calc(100% - 20px);
          max-width: 560px;
          margin: 0 auto 10px;
          padding: 10px 10px 10px 12px;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
          color: var(--warning);

          & span {
            display: grid;
            flex: 1;
            gap: 2px;
            min-width: 0;
            color: var(--text);
            font-size: 13px;
            overflow-wrap: anywhere;
          }

          & small {
            color: var(--text-2);
            font-size: 12px;
          }
        }

        .viewcube {
          position: absolute;
          top: 10px;
          right: 10px;
          z-index: 3;
          width: 84px;
          height: 84px;
        }

        .viewcube__cube {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }

        .viewcube__face {
          position: absolute;
          inset: 14px;
          display: grid;
          place-items: center;
          border: 1px solid light-dark(#b7c0c8, #5b636c);
          background: light-dark(rgb(246 248 250 / 0.94), rgb(52 57 63 / 0.94));
          color: var(--text-2);
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          backface-visibility: hidden;
          transition: background 0.15s, color 0.15s;

          &:hover,
          &:focus-visible {
            background: var(--accent);
            color: #fff;
          }
        }

        .viewcube__face--front {
          transform: translateZ(28px);
        }

        .viewcube__face--back {
          transform: rotateY(180deg) translateZ(28px);
        }

        .viewcube__face--right {
          transform: rotateY(90deg) translateZ(28px);
        }

        .viewcube__face--left {
          transform: rotateY(-90deg) translateZ(28px);
        }

        .viewcube__face--top {
          transform: rotateX(90deg) translateZ(28px);
        }

        .viewcube__face--bottom {
          transform: rotateX(-90deg) translateZ(28px);
        }

        .viewcube__home {
          position: absolute;
          top: -2px;
          left: -34px;
          width: 32px;
          height: 32px;
          background: var(--overlay);
          box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);
        }

        .viewer-panel {
          position: absolute;
          top: 10px;
          left: 10px;
          bottom: 66px;
          z-index: 4;
          display: flex;
          flex-direction: column;
          width: min(320px, calc(100% - 20px));
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
          backdrop-filter: blur(10px);
        }

        @media (width <= 560px) {
          .viewer-panel {
            top: auto;
            right: 10px;
            width: auto;
            max-height: 58%;
          }
        }

        .viewer-panel__header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-height: 40px;
          padding: 0 4px 0 12px;
          border-bottom: 1px solid var(--border);
          font-size: 12px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .viewer-panel__body {
          flex: 1;
          min-height: 0;
          overflow-y: auto;
          padding: 10px 12px 14px;
        }

        .viewer-panel__hint {
          color: var(--text-2);
          font-size: 13px;
        }

        .view-buttons {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }

        .tree {
          display: grid;
          gap: 10px;
        }

        .tree__reset {
          justify-self: start;
          color: var(--accent-text);
          font-size: 12.5px;
          font-weight: 600;
        }

        .tree__group-title {
          margin-bottom: 4px;
          color: var(--text-3);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .tree__item {
          display: flex;
          align-items: center;
          border-radius: var(--radius);

          &.is-selected {
            background: var(--accent-soft);
          }

          &.is-hidden {
            opacity: 0.45;
          }

          & .icon-btn {
            width: 32px;
            height: 32px;
          }
        }

        .tree__name {
          display: flex;
          flex: 1;
          align-items: baseline;
          gap: 8px;
          min-width: 0;
          min-height: 34px;
          padding: 6px 6px;
          text-align: start;

          & b {
            flex: none;
            min-width: 18px;
            color: var(--accent-text);
          }

          & span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-3);
          }
        }

        .props {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          gap: 6px 12px;
          margin: 0;
          font-size: 13px;

          & dt {
            color: var(--text-3);
          }

          & dd {
            margin: 0;
            overflow-wrap: anywhere;
          }
        }

        .props__row {
          display: contents;
        }

        .delivery {
          display: grid;
          gap: 12px;
          padding: 12px;
          border: 1px solid var(--accent);
          border-radius: var(--radius-lg);
          background: var(--accent-soft);
        }

        .delivery__file {
          display: flex;
          align-items: center;
          gap: 10px;
          min-width: 0;
          color: var(--accent-text);

          & span {
            display: grid;
            min-width: 0;
          }

          & b {
