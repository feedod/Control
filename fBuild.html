      /** Холст мини-схемы. Только тапы: по отверстию или вырезу открывается редактор. */
      function PartSchematic({ part, theme, selectedId, onTap, height = 220 }) {
        const wrapRef = useRef(null);
        const canvasRef = useRef(null);
        const [size, setSize] = useState({ w: 0, dpr: 1 });
        useLayoutEffect(() => {
          const node = wrapRef.current;
          if (!node) return void 0;
          const observer = new ResizeObserver(([entry]) => {
            const w = Math.round(entry.contentRect.width);
            setSize((s) => (s.w === w ? s : { w, dpr: Math.min(window.devicePixelRatio || 1, 3) }));
          });
          observer.observe(node);
          return () => observer.disconnect();
        }, []);
        const valid = part.L > 0 && part.W > 0;
        const view = useMemo(
          () => (size.w && valid ? fitSchematic(part, size.w, height, 34) : null),
          [part.L, part.W, size.w, height, valid],
        );
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas || !size.w) return;
          const { w, dpr } = size;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(height * dpr);
          const ctx = canvas.getContext("2d");
          const palette = schematicPalette(theme);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = palette.background;
          ctx.fillRect(0, 0, w, height);
          if (view) {
            drawPartSchematic(ctx, {
              part,
              view,
              palette,
              k: 1,
              selectedId,
              numbers: part.holes.length <= 40,
            });
          }
        }, [part, view, theme, selectedId, size, height]);
        const onClick = (event) => {
          if (!view || !onTap) return;
          const rect = event.currentTarget.getBoundingClientRect();
          const hit = hitTestSchematic(part, view, event.clientX - rect.left, event.clientY - rect.top);
          if (hit) {
            haptic.select();
            onTap(hit);
          }
        };
        return el(
          "div",
          { className: "schematic", ref: wrapRef, style: { height } },
          el("canvas", {
            ref: canvasRef,
            onClick,
            role: "img",
            "aria-label": `Схема детали ${fmt(part.L)} × ${fmt(part.W)} мм`,
            style: { width: "100%", height },
          }),
          !valid && el("div", { className: "schematic__empty" }, "Укажите размеры детали"),
        );
      }

      /** Шторка выбора фурнитуры: пресет → параметры → предпросмотр → добавить. */
      function HardwareSheet({ open, part, T, theme, onClose, onApply, onRemoveGroup }) {
        const [presetId, setPresetId] = useState(FURNITURE_PRESETS[0].id);
        const [params, setParams] = useState(() => ({ ...FURNITURE_PRESETS[0].defaults }));
        const preset = FURNITURE_PRESETS.find((p) => p.id === presetId);
        const resolved = presetParams(preset, params, T);
        const length = part ? edgeLength(part, resolved.edge) : 0;
        const autoN = part && length > 0 ? preset.countFor(length, resolved.endOffset) : 0;
        const generated = useMemo(
          () => (part && length > 0 ? applyPreset(part, preset, params, T) : []),
          [part, preset, params, T, length],
        );
        const groups = useMemo(() => {
          const map = new Map();
          for (const hole of part?.holes ?? []) {
            if (!hole.group) continue;
            if (!map.has(hole.group)) map.set(hole.group, []);
            map.get(hole.group).push(hole);
          }
          return [...map];
        }, [part]);
        if (!part) return null;
        const set = (patch) => setParams((p) => ({ ...p, ...patch }));
        const pick = (id) => {
          const next = FURNITURE_PRESETS.find((p) => p.id === id);
          haptic.select();
          setPresetId(id);
          setParams({ ...next.defaults, edge: params.edge });
        };
        const preview = { ...part, holes: [...part.holes, ...generated] };
        const showLine = resolved.lineOffset > 0;
        return el(
          Sheet,
          {
            open,
            title: "Фурнитура",
            onClose,
            footer: el(
              Button,
              {
                variant: "primary",
                icon: LuPlus,
                disabled: !generated.length || part.holes.length + generated.length > CONFIG.limits.holes,
                onClick: () => onApply(generated),
              },
              `Добавить ${generated.length} ${plural(generated.length, "отверстие", "отверстия", "отверстий")}`,
            ),
          },
          el(
            "div",
            { className: "form" },
            el(
              "div",
              { className: "preset-grid" },
              FURNITURE_PRESETS.map((p) =>
                el(
                  "button",
                  {
                    key: p.id,
                    type: "button",
                    className: cx("preset-card", p.id === presetId && "is-active"),
                    "aria-pressed": p.id === presetId,
                    onClick: () => pick(p.id),
                  },
                  el("b", null, p.name),
                  el("small", null, p.hint),
                ),
              ),
            ),
            el(Segmented, {
              label: "Вариант",
              value: resolved.mode,
              options: preset.modes.map((m) => ({ value: m.id, label: m.label })),
              onChange: (mode) => set({ mode, lineOffset: null }),
            }),
            el(
              Field,
              { label: `Привязка к кромке · длина ${fmt(length)} мм` },
              el(Segmented, {
                label: "Кромка",
                size: "sm",
                value: resolved.edge,
                options: EDGE_SIDES.map((s, i) => ({ value: i, label: s.short })),
                onChange: (edge) => set({ edge }),
              }),
            ),
            el(
              Field,
              { label: `Количество · авто ${autoN}` },
              el(Segmented, {
                label: "Количество",
                size: "sm",
                value: resolved.count,
                options: [{ value: 0, label: "Авто" }, ...[1, 2, 3, 4, 5, 6].map((n) => ({ value: n, label: String(n) }))],
                onChange: (count) => set({ count }),
              }),
            ),
            el(
              "div",
              { className: "grid-2" },
              el(NumberInput, {
                label: "От торцов",
                unit: "мм",
                value: resolved.endOffset,
                max: Math.max(0, length / 2),
                onChange: (endOffset) => set({ endOffset }),
              }),
              showLine
                ? el(NumberInput, {
                    label: "От края",
                    unit: "мм",
                    value: resolved.lineOffset,
                    max: CONFIG.limits.size,
                    onChange: (lineOffset) => set({ lineOffset }),
                  })
                : el(NumberInput, { label: "От края", unit: "мм", value: 0, disabled: true, onChange: () => void 0 }),
            ),
            preset.id === "hinge" &&
              resolved.mode === "cup" &&
              el(Toggle, {
                label: "Крепёж чашки Ø8",
                hint: "Два отверстия ±22,5 мм под запрессовку",
                checked: Boolean(resolved.pins),
                onChange: (pins) => set({ pins }),
              }),
            el(PartSchematic, { part: preview, theme, height: 190 }),
            groups.length > 0 && el("div", { className: "form__section-title" }, "Установлено на детали"),
            groups.map(([group, holes]) =>
              el(
                "div",
                { key: group, className: "group-row" },
                el(
                  "span",
                  { className: "group-row__text" },
                  el("b", null, groupLabel(group, holes)),
                  el("small", null, `${holes.length} ${plural(holes.length, "отверстие", "отверстия", "отверстий")}`),
                ),
                el(IconButton, {
                  icon: LuTrash2,
                  label: "Удалить пакет фурнитуры",
                  className: "icon-btn--danger",
                  onClick: () => onRemoveGroup(group),
                }),
              ),
            ),
          ),
        );
      }

      /** Редактор одного отверстия: только числовые поля и чипы. */
      function HoleSheet({ part, holeId, theme, onPatch, onClose }) {
        const ui = useUi();
        const hole = part?.holes.find((h) => h.id === holeId) ?? null;
        const index = part?.holes.findIndex((h) => h.id === holeId) ?? -1;
        const update = (patch) => {
          const next = snapHoleToSide({ ...hole, ...patch }, part);
          onPatch({ holes: part.holes.map((h) => (h.id === hole.id ? next : h)) });
        };
        const remove = () => {
          onPatch({ holes: part.holes.filter((h) => h.id !== hole.id) });
          haptic.warning();
          onClose();
        };
        const removeGroup = async () => {
          const ok = await ui.confirm({
            title: "Удалить пакет фурнитуры?",
            message: groupLabel(hole.group, part.holes.filter((h) => h.group === hole.group)),
            confirmLabel: "Удалить",
            danger: true,
          });
          if (!ok) return;
          onPatch({ holes: part.holes.filter((h) => h.group !== hole.group) });
          haptic.warning();
          onClose();
        };
        const locked = hole ? lockedAxis(hole.side) : null;
        return el(
          Sheet,
          {
            open: Boolean(hole),
            title: hole ? `Отверстие ${index + 1}` : "Отверстие",
            onClose,
            footer:
              hole &&
              el(
                Fragment,
                null,
                el(IconButton, { icon: LuTrash2, label: "Удалить отверстие", className: "icon-btn--danger", onClick: remove }),
                hole.group &&
                  el(Button, { variant: "ghost", onClick: removeGroup }, "Удалить пакет"),
                el(Button, { variant: "primary", onClick: onClose }, "Готово"),
              ),
          },
          hole &&
            el(
              "div",
              { className: "form" },
              el(PartSchematic, { part, theme, selectedId: hole.id, height: 160 }),
              el(ChipSelect, {
                label: "Тип отверстия",
                value: hole.type,
                wrap: true,
                options: HOLE_TYPES.map((t) => ({ value: t.id, label: t.label, color: t.color })),
                onChange: (type) => update({ type }),
              }),
              el(
                Field,
                { label: "Сторона сверления" },
                el(Segmented, {
                  label: "Сторона",
                  size: "sm",
                  value: hole.side,
                  options: HOLE_SIDES.map((s) => ({ value: s.id, label: s.short })),
                  onChange: (side) => update({ side }),
                }),
              ),
              el(
                "div",
                { className: "grid-2" },
                el(NumberInput, {
                  label: "X от левого края",
                  unit: "мм",
                  value: hole.x,
                  max: part.L,
                  disabled: locked === "x",
                  onChange: (x) => update({ x }),
                }),
                el(NumberInput, {
                  label: "Y от нижнего края",
                  unit: "мм",
                  value: hole.y,
                  max: part.W,
                  disabled: locked === "y",
                  onChange: (y) => update({ y }),
                }),
              ),
              el(
                "div",
                { className: "grid-2" },
                el(NumberInput, { label: "Диаметр", unit: "мм", value: hole.d, min: 0.5, max: 200, onChange: (d) => update({ d }) }),
                el(NumberInput, { label: "Глубина", unit: "мм", value: hole.depth, min: 0.5, max: 200, onChange: (depth) => update({ depth }) }),
              ),
              locked &&
                el("p", { className: "field__hint" }, "Торцевое отверстие: координата по торцу задана самим торцом."),
            ),
        );
      }

      /** Редактор выреза, радиуса или фаски с привязкой к 9 точкам. */
      function ModifierSheet({ part, modId, theme, onPatch, onClose }) {
        const mod = part?.modifiers.find((m) => m.id === modId) ?? null;
        const index = part?.modifiers.findIndex((m) => m.id === modId) ?? -1;
        const update = (patch) => {
          const next = { ...mod, ...patch };
          if (isCornerModifier(next.type) && !CORNER_ANCHORS.includes(next.anchor)) next.anchor = 8;
          if (isCornerModifier(next.type) && !(next.r > 0)) next.r = 10;
          onPatch({ modifiers: part.modifiers.map((m) => (m.id === mod.id ? next : m)) });
        };
        const remove = () => {
          onPatch({ modifiers: part.modifiers.filter((m) => m.id !== mod.id) });
          haptic.warning();
          onClose();
        };
        const corner = mod && isCornerModifier(mod.type);
        const offsetMin = -CONFIG.limits.size;
        return el(
          Sheet,
          {
            open: Boolean(mod),
            title: mod ? `Обработка М${index + 1}` : "Обработка",
            onClose,
            footer:
              mod &&
              el(
                Fragment,
                null,
                el(IconButton, { icon: LuTrash2, label: "Удалить", className: "icon-btn--danger", onClick: remove }),
                el(Button, { variant: "primary", onClick: onClose }, "Готово"),
              ),
          },
          mod &&
            el(
              "div",
              { className: "form" },
              el(PartSchematic, { part, theme, selectedId: mod.id, height: 170 }),
              el(Segmented, {
                label: "Тип",
                value: mod.type,
                options: MODIFIER_TYPES.map((t) => ({ value: t.id, label: t.label })),
                onChange: (type) => update({ type }),
              }),
              el(
                "div",
                { className: "anchor-field" },
                el(AnchorPicker, { value: mod.anchor, cornersOnly: corner, onChange: (anchor) => update({ anchor }) }),
                el(
                  "div",
                  { className: "anchor-field__text" },
                  el("b", null, ANCHOR_NAMES[mod.anchor]),
                  el(
                    "small",
                    null,
                    corner
                      ? "Угол детали, к которому применяется обработка"
                      : "Отступы считаются от точки привязки внутрь детали",
                  ),
                ),
              ),
              corner
                ? el(NumberInput, {
                    label: mod.type === "radius" ? "Радиус" : "Катет фаски",
                    unit: "мм",
                    value: mod.r,
                    max: CONFIG.limits.size,
                    onChange: (r) => update({ r }),
                  })
                : el(
                    Fragment,
                    null,
                    mod.type === "rect"
                      ? el(
                          "div",
                          { className: "grid-2" },
                          el(NumberInput, { label: "Ширина (по X)", unit: "мм", value: mod.w, onChange: (w) => update({ w }) }),
                          el(NumberInput, { label: "Высота (по Y)", unit: "мм", value: mod.h, onChange: (h) => update({ h }) }),
                        )
                      : el(NumberInput, { label: "Диаметр", unit: "мм", value: mod.w, onChange: (w) => update({ w }) }),
                    el(
                      "div",
                      { className: "grid-2" },
                      el(NumberInput, { label: "Отступ X", unit: "мм", min: offsetMin, value: mod.dx, onChange: (dx) => update({ dx }) }),
                      el(NumberInput, { label: "Отступ Y", unit: "мм", min: offsetMin, value: mod.dy, onChange: (dy) => update({ dy }) }),
                    ),
                    mod.type === "rect" &&
                      el(NumberInput, {
                        label: "Радиус углов выреза",
                        unit: "мм",
                        value: mod.r,
                        hint: "0 — острые углы (под пилу), от 3 мм — под фрезу ЧПУ",
                        onChange: (r) => update({ r }),
                      }),
                  ),
            ),
        );
      }

      /** Раздел «Сборка»: роль, группа, номер позиции. */
      function AssemblyFields({ part, position, groups, onPatch }) {
        const suggestions = [...new Set([...ASSEMBLY_GROUPS, ...groups])];
        return el(
          "div",
          { className: "form" },
          el(
            Field,
            { label: "Роль в изделии" },
            el(ChipSelect, {
              label: "Роль",
              value: part.role,
              wrap: true,
              options: PART_ROLES.map((r) => ({ value: r.id, label: r.label })),
              onChange: (role) =>
                onPatch(part.assemblyGroup ? { role } : { role, assemblyGroup: inferGroup(role) }),
            }),
          ),
          el(TextInput, {
            label: "Группа сборки",
            value: part.assemblyGroup,
            placeholder: "Например, Корпус",
            maxLength: 40,
            onChange: (assemblyGroup) => onPatch({ assemblyGroup }),
          }),
          el(ChipSelect, {
            label: "Группы",
            value: part.assemblyGroup,
            options: suggestions.map((g) => ({ value: g, label: g })),
            onChange: (assemblyGroup) => onPatch({ assemblyGroup }),
          }),
          el(NumberInput, {
            label: "Номер позиции",
            value: part.itemNumber,
            integerOnly: true,
            max: 9999,
            hint: part.itemNumber
              ? "Ручной номер. 0 — вернуть автоматическую нумерацию."
              : `Автоматически: поз. ${position ?? "—"}. Введите число, чтобы закрепить свой номер.`,
            onChange: (itemNumber) => onPatch({ itemNumber }),
          }),
          el(
            "p",
            { className: "field__hint" },
            "Роль определяет место детали в 3D-модели корпуса, группа — раздел спецификации.",
          ),
        );
      }

      const PART_SECTIONS = [
        { value: "size", label: "Деталь" },
        { value: "drill", label: "Присадка" },
        { value: "assembly", label: "Сборка" },
      ];

      function PartSheet({ state, project, dispatch, onClose, theme, positions }) {
        const ui = useUi();
        const blank = () => createPart({ L: 600, W: 400 });
        const [draft, setDraft] = useState(blank);
        const [section, setSection] = useState("size");
        const [sub, setSub] = useState(null);
        const isNew = state?.mode === "new";
        const existingIndex =
          !isNew && state ? project.parts.findIndex((p) => p.id === state.id) : -1;
        const existing = existingIndex >= 0 ? project.parts[existingIndex] : null;
        useEffect(() => {
          if (isNew) setDraft(blank());
          setSection(state?.section ?? "size");
          setSub(null);
        }, [isNew, state]);
        const part = isNew ? draft : existing;
        const open = Boolean(state) && Boolean(part);
        const patch = (values) => {
          if (isNew) setDraft((d) => ({ ...d, ...values }));
          else dispatch({ type: "part/update", id: existing.id, patch: values });
        };
        const remove = async () => {
          const ok = await ui.confirm({
            title: "Удалить деталь?",
            message: existing.name || `Позиция ${positions.get(existing.id)}`,
            confirmLabel: "Удалить",
            danger: true,
          });
          if (!ok) return;
          dispatch({ type: "part/remove", id: existing.id });
          haptic.warning();
          onClose();
        };
        const add = () => {
          if (!(draft.L > 0 && draft.W > 0)) {
            haptic.error();
            ui.notify("Длина и ширина должны быть больше нуля", "error", "Укажите размеры");
            return;
          }
          dispatch({ type: "part/add", part: draft });
          haptic.success();
          ui.notify("Деталь добавлена в список");
          setDraft(
            createPart({
              L: draft.L,
              W: draft.W,
              edges: [...draft.edges],
              grain: draft.grain,
              role: draft.role,
              assemblyGroup: draft.assemblyGroup,
            }),
          );
        };
        const groups = useMemo(
          () => [...new Set(project.parts.map((p) => p.assemblyGroup).filter(Boolean))],
          [project.parts],
        );
        const footer = !part
          ? null
          : isNew
            ? el(
                Fragment,
                null,
                el(Button, { variant: "secondary", onClick: onClose }, "Готово"),
                el(Button, { variant: "primary", icon: LuPlus, onClick: add }, "Добавить"),
              )
            : el(
                Fragment,
                null,
                el(IconButton, { icon: LuTrash2, label: "Удалить деталь", className: "icon-btn--danger", onClick: remove }),
                el(IconButton, {
                  icon: LuCopy,
                  label: "Дублировать деталь",
                  onClick: () => {
                    dispatch({ type: "part/duplicate", id: existing.id });
                    haptic.tap();
                    ui.notify("Копия добавлена следом за деталью", "success", "Деталь продублирована");
                  },
                }),
                el(Button, { variant: "primary", onClick: onClose }, "Готово"),
              );
        const holesCount = part ? part.holes.length + part.modifiers.length : 0;
        const position = existing ? positions.get(existing.id) : null;
        return el(
          Fragment,
          null,
          el(
            Sheet,
            { open, title: isNew ? "Новая деталь" : `Деталь · поз. ${position}`, onClose, footer },
            part &&
              el(
                Fragment,
                null,
                el(
                  "div",
                  { className: "sheet-tabs" },
                  el(Segmented, {
                    label: "Раздел",
                    value: section,
                    options: PART_SECTIONS.map((s) =>
                      s.value === "drill" && holesCount ? { ...s, label: `${s.label} · ${holesCount}` } : s,
                    ),
                    onChange: setSection,
                  }),
                ),
                section === "size" &&
                  el(PartForm, {
                    part,
                    number: position,
                    material: project.material,
                    cut: project.cut,
                    onPatch: patch,
                  }),
                section === "drill" &&
                  el(DrillingPanel, { part, theme, T: project.material.T, onPatch: patch, onOpen: setSub }),
                section === "assembly" &&
                  el(AssemblyFields, { part, position, groups, onPatch: patch }),
              ),
          ),
          el(HardwareSheet, {
            open: open && sub?.type === "hardware",
            part: open ? part : null,
            T: project.material.T,
            theme,
            onClose: () => setSub(null),
            onApply: (holes) => {
              patch({ holes: [...part.holes, ...holes] });
              haptic.success();
              ui.notify(`Добавлено отверстий: ${holes.length}`, "success", "Фурнитура установлена");
              setSub(null);
            },
            onRemoveGroup: (group) => {
              patch({ holes: part.holes.filter((h) => h.group !== group) });
              haptic.warning();
            },
          }),
          el(HoleSheet, {
            part: open && sub?.type === "hole" ? part : null,
            holeId: sub?.id,
            theme,
            onPatch: patch,
            onClose: () => setSub(null),
          }),
          el(ModifierSheet, {
            part: open && sub?.type === "mod" ? part : null,
            modId: sub?.id,
            theme,
            onPatch: patch,
            onClose: () => setSub(null),
          }),
        );
      }

      /** Массовое редактирование: имя (с нумерацией), роль, группа. */
      function BulkSheet({ state, project, dispatch, onClose }) {
        const [name, setName] = useState("");
        const [numbered, setNumbered] = useState(false);
        const [role, setRole] = useState("keep");
        const [group, setGroup] = useState("");
        const ui = useUi();
        useEffect(() => {
          if (!state) return;
          setName("");
          setNumbered(false);
          setRole("keep");
          setGroup("");
        }, [state]);
        const ids = state?.ids ?? [];
        const targets = project.parts.filter((p) => ids.includes(p.id));
        const changed = name.trim() || role !== "keep" || group.trim();
        const apply = () => {
          const patches = {};
          targets.forEach((part, i) => {
            const patch = {};
            if (name.trim()) patch.name = (numbered ? `${name.trim()} ${i + 1}` : name.trim()).slice(0, CONFIG.limits.name);
            if (role !== "keep") patch.role = role;
            if (group.trim()) patch.assemblyGroup = group.trim().slice(0, 40);
            patches[part.id] = patch;
          });
          dispatch({ type: "parts/patch-many", patches });
          haptic.success();
          ui.notify(`Изменено деталей: ${targets.length}`, "success", "Массовое редактирование");
          onClose(true);
        };
        return el(
          Sheet,
          {
            open: Boolean(state),
            title: `Выбрано: ${targets.length}`,
            onClose: () => onClose(false),
            footer: el(
              Button,
              { variant: "primary", icon: LuPencil, disabled: !changed, onClick: apply },
              "Применить",
            ),
          },
          el(
            "div",
            { className: "form" },
            el(TextInput, {
              label: "Новое имя",
              value: name,
              placeholder: "Не менять",
              maxLength: CONFIG.limits.name,
              onChange: setName,
            }),
            el(Toggle, {
              label: "Добавить порядковый номер",
              hint: name.trim() ? `${name.trim()} 1, ${name.trim()} 2, …` : "Полка 1, Полка 2, …",
              checked: numbered,
              disabled: !name.trim(),
              onChange: setNumbered,
            }),
            el(
              Field,
              { label: "Роль" },
              el(ChipSelect, {
                label: "Роль",
                value: role,
                wrap: true,
                options: [{ value: "keep", label: "Не менять" }, ...PART_ROLES.map((r) => ({ value: r.id, label: r.label }))],
                onChange: setRole,
              }),
            ),
            el(TextInput, { label: "Группа сборки", value: group, placeholder: "Не менять", maxLength: 40, onChange: setGroup }),
            el(ChipSelect, {
              label: "Группы",
              value: group,
              options: ASSEMBLY_GROUPS.map((g) => ({ value: g, label: g })),
              onChange: setGroup,
            }),
            el(
              "div",
              { className: "bulk-preview" },
              targets.slice(0, 6).map((p, i) =>
                el(
                  "div",
                  { key: p.id },
                  el("span", null, p.name || "Без названия"),
                  el(Icon, { as: LuChevronRight, size: 14 }),
                  el("b", null, name.trim() ? (numbered ? `${name.trim()} ${i + 1}` : name.trim()) : p.name || "Без названия"),
                ),
              ),
              targets.length > 6 && el("small", null, `и ещё ${targets.length - 6}`),
            ),
          ),
        );
      }

      function PartsView({ project, dispatch, onEdit, onAdd, onPaste, onBulk, unplacedIds, positions }) {
        const ui = useUi();
        const [selecting, setSelecting] = useState(false);
        const [selected, setSelected] = useState(() => new Set());
        const pieces = countPieces(project);
        const area = project.parts.reduce((t, p) => t + p.L * p.W * p.qty, 0) / 1e6;
        // Выбор сбрасывается, если деталь удалили в другом месте.
        useEffect(() => {
          setSelected((s) => {
            const alive = new Set([...s].filter((id) => project.parts.some((p) => p.id === id)));
            return alive.size === s.size ? s : alive;
          });
        }, [project.parts]);
        const toggle = (id) => {
          haptic.select();
          setSelected((s) => {
            const next = new Set(s);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            return next;
          });
        };
        const exit = () => {
          setSelecting(false);
          setSelected(new Set());
        };
        const allSelected = selected.size === project.parts.length && project.parts.length > 0;
        const ids = project.parts.filter((p) => selected.has(p.id)).map((p) => p.id);
        const clear = async () => {
          const ok = await ui.confirm({
            title: "Удалить все детали?",
            message: "Список деталей текущего проекта будет очищен.",
            confirmLabel: "Удалить",
            danger: true,
          });
          if (ok) {
            dispatch({ type: "parts/replace", parts: [] });
            haptic.warning();
          }
        };
        const removeSelected = async () => {
          const ok = await ui.confirm({
            title: `Удалить ${ids.length} ${plural(ids.length, "деталь", "детали", "деталей")}?`,
            message: "Выбранные позиции будут удалены из проекта.",
            confirmLabel: "Удалить",
            danger: true,
          });
          if (!ok) return;
          dispatch({ type: "parts/remove-many", ids });
          haptic.warning();
          ui.notify(`Удалено деталей: ${ids.length}`);
          exit();

      /**
       * Проверка проекта после каждого изменения: новые проблемы показываются тостом
       * один раз. При открытии проекта старые проблемы не «выстреливают».
       */
      function useIssueToasts(project, positions, notify) {
        const previous = useRef({ id: null, keys: new Set() });
        useEffect(() => {
          if (!project) return;
          const issues = project.parts.flatMap((part) =>
            validatePart(part, project.material, project.cut, positions.get(part.id)),
          );
          const keys = new Set(issues.map((i) => i.key));
          if (previous.current.id === project.id) {
            const fresh = issues.filter((i) => !previous.current.keys.has(i.key));
            if (fresh.length) haptic.warning();
            for (const issue of fresh.slice(0, 2)) notify(issue.message, issue.tone, issue.title);
            if (fresh.length > 2) notify(`Ещё замечаний: ${fresh.length - 2}`, "warning", "Проверьте детали");
          }
          previous.current = { id: project.id, keys };
        }, [project, positions, notify]);
      }

      const ASSEMBLY_COLORS = {

      /**

        const horizontals = [...tops, ...bottoms, ...shelves];
        const H = sides.length

            ? Math.max(...facades.map((p) => Math.max(p.L, p.W)))

        const D = sides.length
          ? Math.max(...sides.map((p) => p.W))

        const inner = horizontals.length ? Math.max(...horizontals.map((p) => p.L)) : 600;
        const overlayTop = tops.length && sides.length >= 2 && tops[0].L >= inner + 2 * T - 1;
        const outer = sides.length >= 2 ? (overlayTop ? tops[0].L : inner + 2 * T) : inner;

        const boxes = [];
        const add = (part, kind, size, pos) =>
          boxes.push({ partId: part.id, no: positions.get(part.id), role: part.role, kind, size, pos });

        // Боковины: первые две — по краям, остальные — перегородки внутри.

            add(p, "carcass", [T, p.L, p.W], [x, p.L / 2, D - p.W / 2]);

        tops.forEach((p, i) => add(p, "carcass", [p.L, T, p.W], [0, topY + i * T, D - p.W / 2]));
        const overlayBottom = bottoms.length && sides.length >= 2 && bottoms[0].L >= inner + 2 * T - 1;
        const bottomY = overlayBottom ? -T / 2 : T / 2;

        // а если места нет — как внутренние ящики за дверями.

        let cursor = -outer / 2;

        for (const p of tall) {
          const height = Math.max(p.L, p.W);
          const width = Math.min(p.L, p.W);

          cursor += width + gap;
        }
        let stackY = 0;
        let innerY = T + 4;
        for (const p of short) {
          const width = Math.max(p.L, p.W);
          const height = Math.min(p.L, p.W);
          if (outer / 2 - cursor >= width - 1) {
            add(p, "facade", [width, height, T], [cursor + width / 2, stackY + height / 2, frontZ]);
            stackY += height + gap;
          } else {
            add(p, "drawer", [Math.min(width, inner - 8), height, T], [0, innerY + height / 2, D - 30]);
            innerY += height + 4;
          }
        }

        const hidden = valid
          .filter((p) => p.role === "other")
          .reduce((t, p) => t + p.qty, 0);

        // Группы для InstancedMesh: одинаковый размер + тип материала = один draw call.
        const groupsMap = new Map();
        for (const box of boxes) {
          const key = `${box.kind}:${box.size.map((v) => round(v, 1)).join("x")}`;
          if (!groupsMap.has(key)) groupsMap.set(key, { key, kind: box.kind, size: box.size, items: [] });
          groupsMap.get(key).items.push(box);

        const min = [Infinity, Infinity, Infinity];
        const max = [-Infinity, -Infinity, -Infinity];
        for (const b of boxes) {
          for (let a = 0; a < 3; a += 1) {
            min[a] = Math.min(min[a], b.pos[a] - b.size[a] / 2);
            max[a] = Math.max(max[a], b.pos[a] + b.size[a] / 2);
          }

        const bounds = boxes.length
          ? { min, max, center: min.map((v, a) => (v + max[a]) / 2), size: max.map((v, a) => v - min[a]) }

        return { boxes, groups: [...groupsMap.values()], bounds, hidden, T };
      }

      /** Геометрия рёбер всех экземпляров группы в одном буфере — один draw call на группу. */

      /** Одинаковые детали — один InstancedMesh + один буфер рёбер. */

      /**
       * Снимок сборки для PDF: отдельный WebGL-рендер без React,
       * поверх — выноски с номерами позиций (как в сборочном чертеже Inventor).
       */
      async function renderAssemblySnapshot(layout, width, height) {
        const { canvas, ctx } = makeCanvas(width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        if (!layout.boxes.length) {
          drawText(ctx, "Назначьте роли деталям, чтобы собрать модель", width / 2, height / 2, {
            size: 22,
            color: PRINT.muted,
            align: "center",

          const sun = new THREE.DirectionalLight("#ffffff", 1.5);

              polygonOffsetFactor: 1,

              mergedEdges(THREE, group, SCENE_SCALE),

            size: 22,
            color: PRINT.muted,
            align: "center",
          });

          renderer?.dispose();
          renderer?.forceContextLoss();
        }

      }

      /** Выноски с номерами позиций: луч от центра модели наружу, без наложений. */
      function drawBalloons(ctx, anchors, width, height) {
        const cx0 = anchors.reduce((t, a) => t + a.x, 0) / anchors.length;
        const cy0 = anchors.reduce((t, a) => t + a.y, 0) / anchors.length;
        const r = 17;
        const placed = [];
        anchors
          .map((a) => ({ ...a, angle: Math.atan2(a.y - cy0, a.x - cx0 || 0.001) }))
          .sort((a, b) => a.angle - b.angle)
          .forEach((a) => {
            let reach = 90;
            let bx;
            let by;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              bx = clamp(a.x + Math.cos(a.angle) * reach, r + 4, width - r - 4);
              by = clamp(a.y + Math.sin(a.angle) * reach, r + 4, height - r - 4);
              if (placed.every((p) => Math.hypot(p.x - bx, p.y - by) > r * 2.3)) break;
              reach += 22;
            }
            placed.push({ x: bx, y: by });
            ctx.strokeStyle = "#1d242b";
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(bx, by);
            ctx.stroke();
            ctx.fillStyle = "#1d242b";
            ctx.beginPath();
            ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bx, by, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = PRINT.brand;
            ctx.lineWidth = 2;
            ctx.stroke();

          });

                if (isBetter(s, best?.s)) best = { x: f.x, y: f.y, w, h, r: false, s };
              }
              if (rotatable && Math.abs(w - h) > EPS && h <= f.w + EPS && w <= f.h + EPS) {
                const s = this.score(f, h, w);
                if (isBetter(s, best?.s)) best = { x: f.x, y: f.y, w: h, h: w, r: true, s };
              }
            }
            return best;
          }
          occupy(rect) {
            const next = [];
            for (const f of this.free) {
              if (!intersects(f, rect)) {
                next.push(f);
                continue;
              }
              if (rect.x > f.x + EPS) next.push({ x: f.x, y: f.y, w: rect.x - f.x, h: f.h });
              if (rect.x + rect.w < f.x + f.w - EPS) {
                next.push({ x: rect.x + rect.w, y: f.y, w: f.x + f.w - rect.x - rect.w, h: f.h });
              }
              if (rect.y > f.y + EPS) next.push({ x: f.x, y: f.y, w: f.w, h: rect.y - f.y });
              if (rect.y + rect.h < f.y + f.h - EPS) {
                next.push({ x: f.x, y: rect.y + rect.h, w: f.w, h: f.y + f.h - rect.y - rect.h });
              }
            }
            this.free = next.filter(
              (a, i) =>
                !next.some((b, j) => j !== i && isInside(a, b) && (!isInside(b, a) || j < i)),
            );
            this.used.push(rect);
          }
          place(p) {
            this.occupy(p);
          }
          block(rect) {
            this.occupy(rect);
          }
        }
        class GuillotineBin {
          constructor(width, height, choice, split, merge) {
            this.choice = SCORE[choice];
            this.split = SPLIT[split];
            this.merge = merge;
            this.free = [{ x: 0, y: 0, w: width, h: height }];
          }
          block(o) {
            const next = [];
            for (const f of this.free) {
              if (!intersects(f, o)) {
                next.push(f);
                continue;
              }
              const x0 = Math.max(f.x, o.x);
              const x1 = Math.min(f.x + f.w, o.x + o.w);
              const y0 = Math.max(f.y, o.y);
              const y1 = Math.min(f.y + f.h, o.y + o.h);
              if (x0 > f.x + EPS) next.push({ x: f.x, y: f.y, w: x0 - f.x, h: f.h });
              if (x1 < f.x + f.w - EPS) next.push({ x: x1, y: f.y, w: f.x + f.w - x1, h: f.h });
              if (y0 > f.y + EPS) next.push({ x: x0, y: f.y, w: x1 - x0, h: y0 - f.y });
              if (y1 < f.y + f.h - EPS) next.push({ x: x0, y: y1, w: x1 - x0, h: f.y + f.h - y1 });
            }
            this.free = next;
          }
          find(w, h, rotatable) {
            let best = null;
            this.free.forEach((f, i) => {
              if (w <= f.w + EPS && h <= f.h + EPS) {
                const s = this.choice(f, w, h);
                if (isBetter(s, best?.s)) best = { i, x: f.x, y: f.y, w, h, r: false, s };
              }
              if (rotatable && Math.abs(w - h) > EPS && h <= f.w + EPS && w <= f.h + EPS) {
                const s = this.choice(f, h, w);
                if (isBetter(s, best?.s)) best = { i, x: f.x, y: f.y, w: h, h: w, r: true, s };
              }
            });
            return best;
          }
          place(p) {
            const f = this.free[p.i];
            this.free.splice(p.i, 1);
            const restW = f.w - p.w;
            const restH = f.h - p.h;
            const horizontal = this.split(f, p.w, p.h);
            const right = horizontal
              ? { x: f.x + p.w, y: f.y, w: restW, h: p.h }
              : { x: f.x + p.w, y: f.y, w: restW, h: f.h };
            const bottom = horizontal
              ? { x: f.x, y: f.y + p.h, w: f.w, h: restH }
              : { x: f.x, y: f.y + p.h, w: p.w, h: restH };
            for (const r of [right, bottom]) if (r.w > EPS && r.h > EPS) this.free.push(r);
            if (this.merge) this.mergeFree();
          }
          mergeFree() {
            const list2 = this.free;
            let merged = true;
            while (merged) {
              merged = false;
              for (let i = 0; i < list2.length && !merged; i += 1) {
                for (let j = i + 1; j < list2.length; j += 1) {
                  const a = list2[i];
                  const b = list2[j];
                  const vertical =
                    Math.abs(a.x - b.x) < EPS &&
                    Math.abs(a.w - b.w) < EPS &&
                    (Math.abs(a.y + a.h - b.y) < EPS || Math.abs(b.y + b.h - a.y) < EPS);
                  const horizontal =
                    Math.abs(a.y - b.y) < EPS &&
                    Math.abs(a.h - b.h) < EPS &&
                    (Math.abs(a.x + a.w - b.x) < EPS || Math.abs(b.x + b.w - a.x) < EPS);
                  if (vertical) {
                    list2[i] = { x: a.x, y: Math.min(a.y, b.y), w: a.w, h: a.h + b.h };
                  } else if (horizontal) {
                    list2[i] = { x: Math.min(a.x, b.x), y: a.y, w: a.w + b.w, h: a.h };
                  } else {
                    continue;
                  }
                  list2.splice(j, 1);
                  merged = true;
                  break;
                }
              }
            }
          }
        }
        function variantsFor(mode, pieces) {
          const guillotine = [];
          for (const sort of ["area", "side", "height", "width", "perimeter"]) {
            for (const split of ["slas", "llas", "minas", "maxas"]) {
              for (const choice of ["baf", "bssf"]) {
                guillotine.push({ engine: "guillotine", choice, split, sort, merge: false });
              }
            }
          }
          const strips = [];
          for (const sort of ["height", "side", "area"]) {
            for (const choice of ["baf", "bssf", "blsf"]) {
              strips.push({ engine: "guillotine", choice, split: "strip", sort, merge: false });
            }
          }
          const nesting = [
            ...["bssf", "baf", "cp", "blsf"].map((rule) => ({
              engine: "maxrects",
              rule,
              sort: "area",
              global: true,
            })),
            ...["area", "side", "perimeter", "width", "height"].flatMap((sort) =>
              ["bssf", "baf", "cp", "bl"].map((rule) => ({ engine: "maxrects", rule, sort })),
            ),
            ...guillotine
              .filter((v) => v.split === "slas" || v.split === "maxas")
              .map((v) => ({ ...v, merge: true })),
          ];
          const list2 = { guillotine, strips, nesting }[mode] ?? guillotine;
          const limit = pieces > 2e3 ? 6 : pieces > 800 ? 16 : list2.length;
          return list2.slice(0, limit);
        }
        function describe(v) {
          if (v.engine === "maxrects")
            return `MaxRects · ${v.rule.toUpperCase()}${v.global ? " · global" : ""} · ${v.sort}`;
          if (v.split === "strip") return `Полосы · ${v.choice.toUpperCase()} · ${v.sort}`;
          return `Гильотина · ${v.choice.toUpperCase()} · ${v.split.toUpperCase()} · ${v.sort}`;
        }
        function createBin(v, w, h) {
          return v.engine === "maxrects"
            ? new MaxRectsBin(w, h, v.rule)
            : new GuillotineBin(w, h, v.choice, v.split, v.merge);
        }
        function packVariant(ctx, v) {
          let rest = [...ctx.items].sort(SORT[v.sort]);
          const bins = [];
          let offcutIndex = 0;
          let sheetNumber = 0;
          while (rest.length) {
            const stock =
              offcutIndex < ctx.offcuts.length
                ? ctx.offcuts[offcutIndex++]
                : ctx.sheet(++sheetNumber);
            const bw = stock.w - 2 * stock.trim + ctx.kerf;
            const bh = stock.h - 2 * stock.trim + ctx.kerf;
            const bin = createBin(v, bw, bh);
            for (const d of stock.defects) {
              bin.block({
                x: d.x - stock.trim,
                y: d.y - stock.trim,
                w: d.w + ctx.kerf,
                h: d.h + ctx.kerf,
              });
            }
            const placed = [];
            if (v.global) {
              const groups = new Map();
              for (const item of rest) {
                const key = `${item.w}:${item.h}:${item.rot ? 1 : 0}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(item);
              }
              for (;;) {
                let best = null;
                let group = null;
                for (const g of groups.values()) {
                  if (!g.length) continue;
                  const p = bin.find(g[0].w, g[0].h, g[0].rot);
                  if (!p) continue;
                  const larger = group && g[0].w * g[0].h > group[0].w * group[0].h;
                  if (!best || isBetter(p.s, best.s) || (isSameScore(p.s, best.s) && larger)) {
                    best = p;
                    group = g;
                  }
                }
                if (!best) break;
                bin.place(best);
                placed.push({ item: group.shift(), p: best });
              }
              rest = [...groups.values()].flat().sort(SORT[v.sort]);
            } else {
              const left = [];
              for (const item of rest) {
                const p = bin.find(item.w, item.h, item.rot);
                if (p) {
                  bin.place(p);
                  placed.push({ item, p });
                } else {
                  left.push(item);
                }
              }
              rest = left;
            }
            if (!placed.length) {
              if (stock.kind === "offcut") continue;
              break;
            }
            bins.push({ stock, placed });
          }
          return { bins, rest };
        }
        function evaluate(run, usableArea) {
          let sheets = 0;
          let squares = 0;
          for (const b of run.bins) {
            if (b.stock.kind !== "sheet") continue;
            sheets += 1;
            const used = b.placed.reduce((t, x) => t + x.item.w * x.item.h, 0) / usableArea;
            squares += used * used;
          }
          return [run.rest.length, sheets, -squares];
        }
        function compare(a, b) {
          for (let i = 0; i < a.length; i += 1) {
            if (a[i] < b[i] - EPS) return -1;
            if (a[i] > b[i] + EPS) return 1;
          }
          return 0;
        }
        function transposeContext(ctx) {
          return {
            ...ctx,
            items: ctx.items.map((it) => ({ ...it, w: it.h, h: it.w })),
            offcuts: ctx.offcuts.map((o) => ({ ...o, w: o.h, h: o.w })),
            sheet: (n) => {
              const s = ctx.sheet(n);
              return {
                ...s,
                w: s.h,
                h: s.w,
                defects: s.defects.map((d) => ({ x: d.y, y: d.x, w: d.h, h: d.w })),
              };
            },
          };
        }
        function wasteAreas(sheet, kerf) {
          const { w: W, h: H, trim } = sheet;
          const blocks = [...sheet.placed, ...sheet.defects];
          const round2 = (v) => Math.round(v * 1e3) / 1e3;
          const xs = [
            ...new Set([trim, W - trim, ...blocks.flatMap((r) => [r.x, r.x + r.w])].map(round2)),
          ]
            .filter((v) => v >= trim - EPS && v <= W - trim + EPS)
            .sort((a, b) => a - b);
          const ys = [
            ...new Set([trim, H - trim, ...blocks.flatMap((r) => [r.y, r.y + r.h])].map(round2)),
          ]
            .filter((v) => v >= trim - EPS && v <= H - trim + EPS)
            .sort((a, b) => a - b);
          const nx = xs.length - 1;
          const ny = ys.length - 1;
          if (nx < 1 || ny < 1) return [];
          const free = new Uint8Array(nx * ny);
          const used = new Uint8Array(nx * ny);
          for (let j = 0; j < ny; j += 1) {
            const cy = (ys[j] + ys[j + 1]) / 2;
            for (let i = 0; i < nx; i += 1) {
              const cx2 = (xs[i] + xs[i + 1]) / 2;
              free[j * nx + i] = blocks.some(
                (r) => cx2 > r.x && cx2 < r.x + r.w && cy > r.y && cy < r.y + r.h,
              )
                ? 0
                : 1;
            }
          }
          const out = [];
          for (let j = 0; j < ny; j += 1) {
            for (let i = 0; i < nx; i += 1) {
              const id = j * nx + i;
              if (!free[id] || used[id]) continue;
              let i2 = i;
              while (i2 + 1 < nx && free[j * nx + i2 + 1] && !used[j * nx + i2 + 1]) i2 += 1;
              let j2 = j;
              for (; j2 + 1 < ny; j2 += 1) {
                let open = true;
                for (let t = i; t <= i2 && open; t += 1) {
                  const q = (j2 + 1) * nx + t;
                  open = Boolean(free[q] && !used[q]);
                }
                if (!open) break;
              }
              for (let jj = j; jj <= j2; jj += 1)
                for (let t = i; t <= i2; t += 1) used[jj * nx + t] = 1;
              out.push({
                x: xs[i],
                y: ys[j],
                w: round2(xs[i2 + 1] - xs[i]),
                h: round2(ys[j2 + 1] - ys[j]),
              });
            }
          }
          const min = Math.max(kerf * 1.5, 10);
          return out.filter((r) => r.w > min && r.h > min);
        }
        function unionLength(intervals) {
          intervals.sort((a, b) => a[0] - b[0]);
          let total = 0;
          let start = -Infinity;
          let end = -Infinity;
          for (const [a, b] of intervals) {
            if (a > end + EPS) {
              if (end > start) total += end - start;
              start = a;
              end = b;
            } else if (b > end) {
              end = b;
            }
          }
          if (end > start) total += end - start;
          return total;
        }
        function cutLength(sheet, kerf) {
          const { w: W, h: H, trim } = sheet;
          const lines = { x: new Map(), y: new Map() };
          const add = (axis, c, a, b, lo, hi) => {
            if (c <= lo + kerf + EPS || c >= hi - kerf - EPS) return;
            const key = Math.round(c * 10);
            if (!lines[axis].has(key)) lines[axis].set(key, []);
            lines[axis].get(key).push([a, b]);
          };
          for (const p of sheet.placed) {
            add("y", p.y - kerf / 2, p.x, p.x + p.w, trim, H - trim);
            add("y", p.y + p.h + kerf / 2, p.x, p.x + p.w, trim, H - trim);
            add("x", p.x - kerf / 2, p.y, p.y + p.h, trim, W - trim);
            add("x", p.x + p.w + kerf / 2, p.y, p.y + p.h, trim, W - trim);
          }
          let total = 0;
          for (const axis of ["x", "y"])
            for (const list2 of lines[axis].values()) total += unionLength(list2);
          if (trim > 0) total += 2 * (W + H);
          return total;
        }
        function cncOrder(placed) {
          const sorted = [...placed].sort((a, b) => a.y - b.y || a.x - b.x);
          const rows = [];
          for (const p of sorted) {
            const row = rows.find((r) => Math.abs(r.y - p.y) < 1);
            if (row) row.items.push(p);
            else rows.push({ y: p.y, items: [p] });
          }
          return rows.flatMap((r, i) => r.items.sort((a, b) => (i % 2 ? b.x - a.x : a.x - b.x)));
        }
        function solve(job) {
          const started = Date.now();
          const kerf = job.kerf;
          const trim = job.trim;
          const usableW = job.sheet.w - 2 * trim + kerf;
          const usableH = job.sheet.h - 2 * trim + kerf;
          const offcuts = [];
          for (const o of job.offcuts) {
            for (let i = 0; i < o.qty; i += 1)
              offcuts.push({ kind: "offcut", w: o.w, h: o.h, trim: 0, defects: [] });
          }
          offcuts.sort((a, b) => a.w * a.h - b.w * b.h);
          const fits = (w, h, rot, bw, bh) =>
            (w <= bw + EPS && h <= bh + EPS) || (rot && h <= bw + EPS && w <= bh + EPS);
          const items = [];
          const unplaced = new Map();
          job.parts.forEach((part, pi) => {
            const w = part.w + kerf;
            const h = part.h + kerf;
            const ok =
              fits(w, h, part.rot, usableW, usableH) ||
              offcuts.some((o) => fits(w, h, part.rot, o.w + kerf, o.h + kerf));
            for (let i = 0; i < part.qty; i += 1) {
              if (ok) items.push({ pi, w, h, rot: part.rot });
              else unplaced.set(pi, (unplaced.get(pi) ?? 0) + 1);
            }
          });
          const defectsFor = (n) => job.defects.filter((d) => d.sheet === 0 || d.sheet === n);
          const ctx = {
            items,
            offcuts,
            kerf,
            sheet: (n) => ({
              kind: "sheet",
              n,
              w: job.sheet.w,
              h: job.sheet.h,
              trim,
              defects: defectsFor(n),
            }),
          };
          const usableArea = usableW * usableH;
          const variants = variantsFor(job.mode, items.length);
          const orientations = job.sheet.w === job.sheet.h ? [false] : [false, true];
          let best = null;
          let tried = 0;
          for (const transposed of orientations) {
            const context = transposed ? transposeContext(ctx) : ctx;
            for (const v of variants) {
              if (best && Date.now() - started > TIME_BUDGET_MS) break;
              const run = packVariant(context, v);
              const score = evaluate(run, usableArea);
              tried += 1;
              if (!best || compare(score, best.score) < 0) best = { run, score, v, transposed };
            }
          }
          for (const it of best.run.rest) unplaced.set(it.pi, (unplaced.get(it.pi) ?? 0) + 1);
          const sheets = [];
          for (const { stock, placed } of best.run.bins) {
            const original = best.transposed
              ? {
                  ...stock,
                  w: stock.h,
                  h: stock.w,
                  defects: stock.defects.map((d) => ({ x: d.y, y: d.x, w: d.h, h: d.w })),
                }
              : stock;
            let parts = placed.map(({ item, p }) => {
              const part = job.parts[item.pi];
              const bx = best.transposed ? p.y : p.x;
              const by = best.transposed ? p.x : p.y;
              return {
                pi: item.pi,
                x: original.trim + bx,
                y: original.trim + by,
                w: p.r ? part.h : part.w,
                h: p.r ? part.w : part.h,
                r: p.r,
              };
            });
            parts =
              job.mode === "nesting"
                ? cncOrder(parts)
                : parts.sort((a, b) => a.y - b.y || a.x - b.x);
            const sheet = {
              kind: original.kind,
              n: original.n ?? 0,
              w: original.w,
              h: original.h,
              trim: original.trim,
              defects: original.defects,
              placed: parts,
            };
            sheet.used = parts.reduce((t, p) => t + p.w * p.h, 0);
            sheet.util = sheet.used / (sheet.w * sheet.h);
            sheet.waste = wasteAreas(sheet, kerf);
            sheet.cut = cutLength(sheet, kerf);
            sheet.signature = [
              sheet.kind,
              sheet.w,
              sheet.h,
              JSON.stringify(sheet.defects),
              parts.map((p) => `${p.pi},${p.x},${p.y},${p.r ? 1 : 0}`).join(";"),
            ].join("|");
            const twin = sheets.find((s) => s.signature === sheet.signature);
            if (twin) {
              twin.count += 1;
              twin.numbers.push(sheet.n);
            } else {
              sheet.count = 1;
              sheet.numbers = [sheet.n];
              sheets.push(sheet);
            }
          }
          return {
            sheets,
            unplaced: [...unplaced].map(([pi, count]) => ({ pi, count })),
            strategy: describe(best.v) + (best.transposed ? " · поперёк" : ""),
            tried,
            ms: Date.now() - started,
          };
        }
        return { solve };
      }
