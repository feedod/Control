      const INSETS = { top: 64, right: 16, bottom: 60, left: 42 };
      function SheetCanvas({
        sheet,
        job,
        theme,
        display,
        selected,
        onSelect,
        apiRef,
        resetKey
      }) {
        const wrap = useRef(null);
        const canvas = useRef(null);
        const view = useRef(null);
        const size = useRef({ width: 0, height: 0, dpr: 1 });
        const frame = useRef(0);
        const state = useRef({ sheet, job, theme, display, selected, onSelect });
        state.current = { sheet, job, theme, display, selected, onSelect };
        const draw = useCallback(() => {
          cancelAnimationFrame(frame.current);
          frame.current = requestAnimationFrame(() => {
            const node = canvas.current;
            const v = view.current;
            const s = state.current;
            if (!node || !v) return;
            const { width, height, dpr } = size.current;
            const ctx = node.getContext("2d");
            if (!ctx) return;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);
            drawSheet(ctx, {
              sheet: s.sheet,
              job: s.job,
              palette: { ...PALETTES[s.theme], background: null },
              display: s.display,
              view: v,
              selected: s.selected,
              textScale: TEXT_SCALE[s.display.text]
            });
          });
        }, []);
        const fitScale = useCallback(() => {
          const { width, height } = size.current;
          const s = state.current.sheet;
          if (!width || !height) return 1;
          return Math.max(0.01, Math.min((width - INSETS.left - INSETS.right) / s.w, (height - INSETS.top - INSETS.bottom) / s.h));
        }, []);
        const fit = useCallback(() => {
          const { width, height } = size.current;
          const s = state.current.sheet;
          if (!width) return;
          const scale = fitScale();
          view.current = {
            scale,
            x: INSETS.left + (width - INSETS.left - INSETS.right - s.w * scale) / 2,
            y: INSETS.top + (height - INSETS.top - INSETS.bottom - s.h * scale) / 2
          };
          draw();
        }, [draw, fitScale]);
        const zoomAt = useCallback(
          (factor, px, py) => {
            const v = view.current;
            if (!v) return;
            const base = fitScale();
            const scale = clamp(v.scale * factor, base * 0.5, Math.max(base * 40, 6));
            const ratio = scale / v.scale;
            view.current = { scale, x: px - (px - v.x) * ratio, y: py - (py - v.y) * ratio };
            draw();
          },
          [draw, fitScale]
        );
        useEffect(() => {
          apiRef.current = { fit, zoom: (factor) => zoomAt(factor, size.current.width / 2, size.current.height / 2) };
        }, [apiRef, fit, zoomAt]);
        useLayoutEffect(() => {
          const node = wrap.current;
          const c = canvas.current;
          if (!node || !c) return undefined;
          const observer = new ResizeObserver(([entry]) => {
            if (!entry) return;
            const { width, height } = entry.contentRect;
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const first = !size.current.width;
            size.current = { width, height, dpr };
            c.width = Math.round(width * dpr);
            c.height = Math.round(height * dpr);
            c.style.width = `${width}px`;
            c.style.height = `${height}px`;
            if (first || !view.current) fit();
            else draw();
          });
          observer.observe(node);
          return () => {
            observer.disconnect();
            cancelAnimationFrame(frame.current);
          };
        }, [draw, fit]);
        useEffect(() => fit(), [resetKey, fit]);
        useEffect(() => draw(), [sheet, job, theme, display, selected, draw]);
        useEffect(() => {
          const c = canvas.current;
          if (!c) return undefined;
          const pointers = new Map();
          let gesture = null;
          let lastTap = null;
          const local = (e) => {
            const rect = c.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
          };
          const startPan = (point) => {
            if (view.current) gesture = { type: "pan", start: point, view: { ...view.current }, moved: false, time: performance.now() };
          };
          const onDown = (e) => {
            if (!view.current) return;
            c.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, local(e));
            if (pointers.size === 1) startPan(local(e));
            if (pointers.size === 2) {
              const [a, b] = [...pointers.values()];
              gesture = { type: "pinch", distance: Math.hypot(a.x - b.x, a.y - b.y) || 1, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, view: { ...view.current } };
            }
          };
          const onMove = (e) => {
            if (!pointers.has(e.pointerId) || !gesture) return;
            pointers.set(e.pointerId, local(e));
            if (gesture.type === "pan") {
              const p = pointers.get(e.pointerId) ?? gesture.start;
              const dx = p.x - gesture.start.x;
              const dy = p.y - gesture.start.y;
              if (!gesture.moved && Math.hypot(dx, dy) < 6) return;
              gesture.moved = true;
              view.current = { ...gesture.view, x: gesture.view.x + dx, y: gesture.view.y + dy };
              draw();
            } else if (pointers.size >= 2) {
              const [a, b] = [...pointers.values()];
              const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
              const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
              const base = fitScale();
              const scale = clamp(gesture.view.scale * distance / gesture.distance, base * 0.5, Math.max(base * 40, 6));
              const mmX = (gesture.mid.x - gesture.view.x) / gesture.view.scale;
              const mmY = (gesture.mid.y - gesture.view.y) / gesture.view.scale;
              view.current = { scale, x: mid.x - mmX * scale, y: mid.y - mmY * scale };
              draw();
            }
          };
          const onUp = (e) => {
            if (!pointers.has(e.pointerId)) return;
            const point = local(e);
            pointers.delete(e.pointerId);
            if (gesture?.type === "pan" && !gesture.moved && performance.now() - gesture.time < 400 && view.current) {
              const now = performance.now();
              if (lastTap && now - lastTap.time < 320 && Math.hypot(point.x - lastTap.x, point.y - lastTap.y) < 28) {
                lastTap = null;
                if (view.current.scale > fitScale() * 1.4) fit();
                else zoomAt(2.5, point.x, point.y);
              } else {
                lastTap = { ...point, time: now };
                const v = view.current;
                state.current.onSelect(hitTestSheet(state.current.sheet, (point.x - v.x) / v.scale, (point.y - v.y) / v.scale));
              }
            }
            const rest = [...pointers.values()][0];
            if (pointers.size === 1 && rest) startPan(rest);
            else if (pointers.size === 0) gesture = null;
          };
          const onWheel = (e) => {
            e.preventDefault();
            const p = local(e);
            zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
          };
          c.addEventListener("pointerdown", onDown);
          c.addEventListener("pointermove", onMove);
          c.addEventListener("pointerup", onUp);
          c.addEventListener("pointercancel", onUp);
          c.addEventListener("wheel", onWheel, { passive: false });
          return () => {
            c.removeEventListener("pointerdown", onDown);
            c.removeEventListener("pointermove", onMove);
            c.removeEventListener("pointerup", onUp);
            c.removeEventListener("pointercancel", onUp);
            c.removeEventListener("wheel", onWheel);
          };
        }, [draw, fit, fitScale, zoomAt]);
        return html`<div className="viewport__canvas" ref=${wrap}>
          <canvas ref=${canvas} role="img" aria-label="Карта раскроя листа" />
        </div>`;
      }

      function SheetThumb({ sheet, job, theme, active, onClick }) {

          const scale = Math.min((width - 4) / sheet.w, (height - 4) / sheet.h);
          drawSheet(ctx, { sheet, job, palette: PALETTES[theme], display: { edges: false }, view: { scale, x: (width - sheet.w * scale) / 2, y: (height - sheet.h * scale) / 2 }, compact: true });

      const opposite = (edge) => edge === 0 ? 1 : edge === 1 ? 0 : edge === 2 ? 3 : 2;
      function autoCount(length, endOffset, step) {
        const span = Math.max(0, length - 2 * endOffset);
        return clamp(Math.floor(span / step) + 1, 2, 24);
      }
      function positionsAlong(length, count, endOffset) {
        if (count <= 1) return [length / 2];
        const step = (length - 2 * endOffset) / (count - 1);
        return Array.from({ length: count }, (_, i) => round(endOffset + i * step, 2));
      }
      const presetBase = (d, T, patch) => ({
        mode: "",
        edge: 2,

          lineOffsetFor: (mode, T) => mode === "face" ? T / 2 : 0,
          countFor: (length, endOffset) => autoCount(length, endOffset, 350),
          generate: ({ mode, edge, positions, lineOffset, T }) => mode === "face" ? positions.map((t) => ({
            edge,
            t,
            inset: lineOffset,
            face: "A",
            purpose: "confirmat",
            d: 7,
            depth: T,
            through: true,
            hardware: true,
            form: "countersink",
            csD: 10,
            csAngle: 90

            edge,
            t,
            inset: 0,
            face: `e${edge}`,
            purpose: "confirmat",
            d: 5,
            depth: 50
          }))

        {
          id: "hinge",
          name: "Петля 35 мм",
          hint: "Чашка Ø35 × 12,5 · планка 37/32",
          modes: [
            { id: "cup", label: "Фасад (чашка)" },
            { id: "plate", label: "Корпус (планка)" }
          ],
          fields: { ...FIELDS, pins: true, lineOffset: "От кромки до оси" },
          defaults: (d, T) => presetBase(d, T, { mode: "cup", endOffset: d.hingeEnd, lineOffset: d.hingeInset }),
          lineOffsetFor: (mode, _T, d) => mode === "cup" ? d.hingeInset : d.plateLine,
          countFor: (length) => length <= 900 ? 2 : length <= 1600 ? 3 : length <= 2000 ? 4 : 5,
          generate: ({ mode, edge, positions, lineOffset, pins }) => {
            const holes = [];

              if (mode === "cup") {
                holes.push({ edge, t, inset: lineOffset, face: "A", purpose: "hinge-cup", d: 35, depth: 12.5, hardware: true });
                if (pins) {
                  holes.push({ edge, t: t - 22.5, inset: lineOffset + 9.5, face: "A", purpose: "hinge-pin", d: 8, depth: 11 });
                  holes.push({ edge, t: t + 22.5, inset: lineOffset + 9.5, face: "A", purpose: "hinge-pin", d: 8, depth: 11 });
                }

                for (const shift of [-16, 16]) {

                    t: t + shift,
                    inset: lineOffset,
                    face: "A",
                    purpose: "hinge-plate",
                    d: 5,
                    depth: 12,
                    form: "threaded",
                    thread: "euro"
                  });

          hint: "Эксцентрик Ø15 · тяга Ø8 × 34 в торец",

          countFor: (length, endOffset) => autoCount(length, endOffset, 350),
          generate: ({ mode, edge, positions, lineOffset }) => positions.flatMap(

      function PartSchematic({
        part,
        edges,
        theme,
        selectedId,
        onTap,
        height = 220
      }) {
        const wrap = useRef(null);
        const canvas = useRef(null);
        const [width, setWidth] = useState(0);
        useLayoutEffect(() => {
          const node = wrap.current;
          if (!node) return undefined;
          const observer = new ResizeObserver(([entry]) => setWidth(Math.round(entry?.contentRect.width ?? 0)));
          observer.observe(node);
          return () => observer.disconnect();
        }, []);
        const valid = part.L > 0 && part.W > 0;
        const view = useMemo(() => width && valid ? fitSchematic(part, width, height, 34) : null, [part.L, part.W, width, height, valid]);
        useEffect(() => {
          const node = canvas.current;
          if (!node || !width) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 3);
          node.width = Math.round(width * dpr);
          node.height = Math.round(height * dpr);
          const ctx = node.getContext("2d");
          if (!ctx) return;
          const palette = PALETTES[theme];
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = palette.background ?? "#000";
          ctx.fillRect(0, 0, width, height);
          if (view) drawPartSchematic(ctx, { part, edges, view, palette, selectedId: selectedId ?? null, numbers: part.holes.length <= 60 });
        }, [part, edges, view, theme, selectedId, width, height]);
        return html`<div className="schematic" ref=${wrap} style=${{ height }}>
          <canvas
            ref=${canvas}
            role="img"
            aria-label=${`Схема детали ${part.L} × ${part.W} мм`}
            style=${{ width: "100%", height }}
            onClick=${(event) => {
              if (!view || !onTap) return;
              const rect = event.currentTarget.getBoundingClientRect();
              const hit = hitTestSchematic(part, view, event.clientX - rect.left, event.clientY - rect.top);
              if (hit) {
                haptic.select();
                onTap(hit);
              }
            }}
          />
          ${!valid && html`<div className="schematic__empty">Укажите размеры детали</div>`}
        </div>`;
      }

      function operationMeta(op) {
        switch (op.type) {
          case "radius":
            return `${ANCHORS[op.anchor]} · R${fmt(op.r, 1)}`;
          case "chamfer":
            return `${ANCHORS[op.anchor]} · ${fmt(op.r, 1)} × 45°`;
          case "notch":
            return `${ANCHORS[op.anchor]} · ${fmt(op.w, 1)} × ${fmt(op.h, 1)}`;
          case "groove":
          case "rebate":
          case "edgeGroove":
            return `${EDGE_SIDES[op.edge]?.short ?? ""} · ${fmt(op.width, 1)} × ${fmt(op.depth, 1)}${op.type === "groove" ? ` · от кромки ${fmt(op.offset, 1)}` : ""}`;
          case "circle":
            return `${ANCHORS[op.anchor]} · Ø${fmt(op.w, 1)} · ${op.through ? "насквозь" : `глуб. ${fmt(op.depth, 1)}`}`;
          case "rect":
            return `${ANCHORS[op.anchor]} · ${fmt(op.w, 1)} × ${fmt(op.h, 1)} · ${op.through ? "насквозь" : `глуб. ${fmt(op.depth, 1)}`}`;
        }
      }

          onPatch({ holes: part.holes.map((h) => h.id === hole.id ? next : h) });
        };
        const remove = () => {
          onPatch({ holes: part.holes.filter((h) => h.id !== hole.id) });

          const members = part.holes.filter((h) => h.group === hole.group);

          });
          if (!ok) return;
          onPatch({ holes: part.holes.filter((h) => h.group !== hole.group) });
          onClose();
        };
        const makePattern = () => {
          const copies = linearPattern(hole, pattern.count, pattern.stepX, pattern.stepY);
          onPatch({ holes: [...part.holes.filter((h) => h.id !== hole.id), ...copies] });
          ui.notify(`Создан массив: ${copies.length} отв.`, "success", "Массив");

              <${NumberInput} label="Шаг X" unit="мм" min=${-5000} max=${5000} value=${pattern.stepX} onChange=${(stepX) => setPattern((p) => ({ ...p, stepX }))} />
              <${NumberInput} label="Шаг Y" unit="мм" min=${-5000} max=${5000} value=${pattern.stepY} onChange=${(stepY) => setPattern((p) => ({ ...p, stepY }))} />
            </div>
            <${Button} variant="secondary" icon="copy-plus" onClick=${makePattern} disabled=${!pattern.stepX && !pattern.stepY}>
              Создать массив из ${pattern.count} отв.
            <//>
          </div>
        <//>`;
      }

      function defaultsFor(type, op, part, T) {
        switch (type) {
          case "radius":
          case "chamfer":
            return { anchor: CORNER_ANCHORS.includes(op.anchor) ? op.anchor : 8, r: op.r > 0 ? op.r : 20 };
          case "notch":
            return { anchor: CORNER_ANCHORS.includes(op.anchor) ? op.anchor : 8, w: Math.min(100, part.L / 4), h: Math.min(60, part.W / 4) };
          case "groove":
            return { edge: op.edge, offset: 12, width: 4, depth: Math.min(8, T / 2), face: "A", start: 0, end: 0 };
          case "rebate":
            return { edge: op.edge, width: 10, depth: Math.min(8, T / 2), face: "A", start: 0, end: 0 };
          case "edgeGroove":
            return { edge: op.edge, offset: Math.max(0, (T - 4) / 2), width: Math.min(4, T), depth: 10, start: 0, end: 0 };
          case "circle":
            return { w: Math.min(60, part.W / 3), anchor: 4, dx: 0, dy: 0, through: true };
          case "rect":
            return { w: Math.min(100, part.L / 4), h: Math.min(100, part.W / 4), through: true };
        }
      }
      function OperationSheet({
        part,
        opId,
        T,
        edges,
        theme,
        onPatch,
        onClose
      }) {
        const op = part?.operations.find((o) => o.id === opId) ?? null;
        if (!part || !op) return html`<${Sheet} open=${false} title="Обработка" onClose=${onClose} />`;
        const index = part.operations.indexOf(op);
        const update = (patch) => onPatch({ operations: part.operations.map((o) => o.id === op.id ? { ...o, ...patch } : o) });
        const remove = () => {
          onPatch({ operations: part.operations.filter((o) => o.id !== op.id) });
          onClose();
        };
        const corner = isCornerOperation(op.type);
        const along = op.type === "groove" || op.type === "rebate" || op.type === "edgeGroove";
        const length = along ? edgeLength(part, op.edge) : 0;
        const offsetMin = -10_000;
        return html`<${Sheet}
          open
          size="lg"
          title=${`М${index + 1} · ${operationLabel(op.type)}`}
          subtitle=${OPERATION_TYPES.find((t) => t.id === op.type)?.hint}
          onClose=${onClose}
          footer=${html`<${Fragment}>
            <${IconButton} icon="trash-2" label="Удалить обработку" variant="danger" onClick=${remove} />
            <${Button} variant="primary" onClick=${onClose}>
              Готово
            <//>
          <//>`}
        >
          <div className="form">
            <${PartSchematic} part=${part} edges=${edges} theme=${theme} selectedId=${op.id} height=${170} />
            <${Field} label="Тип обработки">
              <${ChipSelect}
                label="Тип"
                value=${op.type}
                options=${OPERATION_TYPES.map((t) => ({ value: t.id, label: t.short }))}
                onChange=${(type) => update({ type, ...defaultsFor(type, op, part, T) })}
              />
            <//>

            ${along && html`<${Fragment}>
              <${Field} label=${`Кромка · длина ${fmt(length)} мм`}>
                <${Segmented} label="Кромка" size="sm" value=${op.edge} options=${EDGE_SIDES.map((s) => ({ value: s.id, label: s.short }))} onChange=${(edge) => update({ edge })} />
              <//>
              ${op.type !== "edgeGroove" && html`<${Field} label="Пласть">
                <${Segmented}
                  label="Пласть"
                  size="sm"
                  value=${op.face}
                  options=${[
                    { value: "A", label: "A (лицевая)" },
                    { value: "B", label: "B (обратная)" }
                  ]}
                  onChange=${(face) => update({ face })}
                />
              <//>`}
              <div className="grid-3">
                ${op.type !== "rebate" && html`<${NumberInput}
                  label=${op.type === "edgeGroove" ? "От пласти A" : "От кромки"}
                  unit="мм"
                  max=${op.type === "edgeGroove" ? T : 10_000}
                  value=${op.offset}
                  onChange=${(offset) => update({ offset })}
                />`}
                <${NumberInput} label="Ширина" unit="мм" max=${op.type === "edgeGroove" ? T : 10_000} value=${op.width} onChange=${(width) => update({ width })} />
                <${NumberInput} label="Глубина" unit="мм" max=${200} value=${op.depth} onChange=${(depth) => update({ depth })} />
              </div>
              <div className="grid-2">
                <${NumberInput} label="Отступ от начала" unit="мм" max=${length} value=${op.start} hint="0 — паз на всю длину" onChange=${(start) => update({ start })} />
                <${NumberInput} label="Отступ от конца" unit="мм" max=${length} value=${op.end} onChange=${(end) => update({ end })} />
              </div>
            <//>`}

            ${(op.type === "rect" || op.type === "circle") && html`<${Fragment}>
              <div className="anchor-field">
                <${AnchorPicker} value=${op.anchor} onChange=${(anchor) => update({ anchor })} />
                <div className="anchor-field__text">
                  <b>${ANCHOR_NAMES[op.anchor]}</b>
                  <small>Отступы X/Y считаются от точки привязки внутрь детали</small>
                </div>
              </div>
              ${op.type === "rect" ? html`<div className="grid-2">
                <${NumberInput} label="Ширина (по X)" unit="мм" value=${op.w} onChange=${(w) => update({ w })} />
                <${NumberInput} label="Высота (по Y)" unit="мм" value=${op.h} onChange=${(h) => update({ h })} />
              </div>` : html`<${NumberInput} label="Диаметр" unit="мм" value=${op.w} onChange=${(w) => update({ w })} />`}
              <div className="grid-2">
                <${NumberInput} label="Отступ X" unit="мм" min=${offsetMin} value=${op.dx} onChange=${(dx) => update({ dx })} />
                <${NumberInput} label="Отступ Y" unit="мм" min=${offsetMin} value=${op.dy} onChange=${(dy) => update({ dy })} />
              </div>
              ${op.type === "rect" && html`<${NumberInput} label="Радиус углов" unit="мм" value=${op.r} hint="0 — острые углы (пила), от 3 мм — фреза ЧПУ" onChange=${(r) => update({ r })} />`}
              <${Toggle} label="Насквозь" hint="Выключите, чтобы получился карман на заданную глубину" checked=${op.through} onChange=${(through) => update({ through })} />
              ${!op.through && html`<div className="grid-2">
                <${NumberInput} label="Глубина кармана" unit="мм" max=${T} value=${op.depth} onChange=${(depth) => update({ depth })} />
                <${Field} label="Пласть">
                  <${Segmented}
                    label="Пласть"
                    size="sm"
                    value=${op.face}
                    options=${[
                      { value: "A", label: "A" },
                      { value: "B", label: "B" }
                    ]}
                    onChange=${(face) => update({ face })}
                  />
                <//>
              </div>`}
            <//>`}

            ${corner && html`<${Fragment}>
              <div className="anchor-field">
                <${AnchorPicker} value=${op.anchor} allowed=${CORNER_ANCHORS} onChange=${(anchor) => update({ anchor })} />
                <div className="anchor-field__text">
                  <b>${ANCHOR_NAMES[op.anchor]}</b>
                  <small>Угол детали, к которому применяется обработка</small>
                </div>
              </div>
              ${op.type === "notch" ? html`<div className="grid-2">
                <${NumberInput} label="Вырез по X" unit="мм" value=${op.w} onChange=${(w) => update({ w })} />
                <${NumberInput} label="Вырез по Y" unit="мм" value=${op.h} onChange=${(h) => update({ h })} />
              </div>` : html`<${NumberInput} label=${op.type === "radius" ? "Радиус" : "Катет фаски"} unit="мм" value=${op.r} onChange=${(r) => update({ r })} />`}
            <//>`}
          </div>
        <//>`;
      }

      function EdgeEditor({ part, materials, onPatch }) {
        const options = [{ value: "", label: "Без кромки" }, ...materials.map((m) => ({ value: m.id, label: m.name, color: m.color }))];
        const setSide = (side, value) => {
          const edges = [...part.edges];
          edges[side] = value;
          onPatch({ edges });
        };
        return html`<div className="edge-editor">
          <div className="edge-editor__head">
            <${EdgeGlyph} edges=${part.edges} materials=${materials} size=${1.6} />
            <div className="edge-editor__quick">
              <span className="field__label">Все стороны</span>
              <${ChipSelect}
                label="Кромка на все стороны"
                value=${part.edges.every((e) => e === part.edges[0]) ? part.edges[0] : "__mixed"}
                options=${options}
                onChange=${(value) => onPatch({ edges: [value, value, value, value] })}
              />
            </div>
          </div>
          ${EDGE_SIDES.map((side) => html`<div key=${side.id} className="edge-editor__row">
            <span className="edge-editor__side" title=${side.label}>
              <b>${side.short}</b>
              <small>${fmt(side.id < 2 ? part.L : part.W)} мм</small>
            </span>
            <${ChipSelect} label=${side.label} value=${part.edges[side.id]} options=${options} onChange=${(value) => setSide(side.id, value)} />
          </div>`)}
        </div>`;
      }
      function PartForm({
        part,
        material,
        cut,
        edges,
        onPatch
      }) {
        const workL = material.L - 2 * cut.trim;
        const workW = material.W - 2 * cut.trim;
        const fits = !(part.L > 0 && part.W > 0) || part.L <= workL && part.W <= workW || (!material.grain || !part.grain) && part.W <= workL && part.L <= workW;
        return html`<div className="form">
          <${TextInput} label="Название" value=${part.name} placeholder="Например, Боковина" maxLength=${CONFIG.limits.name} onChange=${(name) => onPatch({ name })} />
          <div className="grid-3">
            <${NumberInput} label="Длина (L)" unit="мм" value=${part.L} max=${CONFIG.limits.size} onChange=${(L) => onPatch({ L })} />
            <${NumberInput} label="Ширина (W)" unit="мм" value=${part.W} max=${CONFIG.limits.size} onChange=${(W) => onPatch({ W })} />
            <${NumberInput} label="Кол-во" unit="шт" value=${part.qty} integer min=${1} max=${CONFIG.limits.quantity} onChange=${(qty) => onPatch({ qty })} />
          </div>
          <${Button} variant="ghost" icon="arrow-left-right" onClick=${() => onPatch({ L: part.W, W: part.L })} disabled=${!(part.L > 0 || part.W > 0)}>
            Поменять длину и ширину
          <//>
          ${!fits && html`<p className="inline-alert" role="alert">
            <${Icon} name="triangle-alert" size=${16} />
            Деталь больше рабочей области листа ${fmt(workL)} × ${fmt(workW)} мм
          </p>`}
          <${Toggle}
            label="Учитывать текстуру"
            hint=${material.grain ? "Деталь не поворачивается при раскрое — текстура вдоль длины" : "Материал без текстуры — поворот разрешён всегда"}
            checked=${part.grain}
            disabled=${!material.grain}
            onChange=${(grain) => onPatch({ grain })}
          />
          <div className="form__section-title">Кромка</div>
          ${edges.length ? html`<${EdgeEditor} part=${part} materials=${edges} onPatch=${onPatch} />` : html`<p className="field__hint">Добавьте кромочные материалы во вкладке «Параметры».</p>`}
          <${TextInput} label="Примечание" value=${part.note} multiline maxLength=${200} placeholder="Видно в карточке детали" onChange=${(note) => onPatch({ note })} />
        </div>`;
      }

      function AssemblyFields({ part, position, groups, onPatch }) {
        const suggestions = [... new Set([...ASSEMBLY_GROUPS, ...groups])];
        return html`<div className="form">
          <${Field} label="Роль в изделии">
            <${ChipSelect}
              label="Роль"
              value=${part.role}
              options=${PART_ROLES.map((r) => ({ value: r.id, label: r.label }))}
              onChange=${(role) => onPatch(part.group ? { role } : { role, group: defaultGroup(role) })}
            />
          <//>
          <${TextInput} label="Группа сборки" value=${part.group} maxLength=${40} placeholder="Например, Корпус" onChange=${(group) => onPatch({ group })} />
          <${ChipSelect} label="Группы" value=${part.group} options=${suggestions.map((g) => ({ value: g, label: g }))} onChange=${(group) => onPatch({ group })} />
          <${NumberInput}
            label="Номер позиции"
            integer
            max=${9999}
            value=${part.itemNumber}
            hint=${part.itemNumber ? "Ручной номер. 0 — вернуть автоматическую нумерацию." : `Автоматически: поз. ${position ?? "—"}. Введите число, чтобы закрепить свой номер.`}
            onChange=${(itemNumber) => onPatch({ itemNumber })}
          />
          <p className="field__hint">Роль определяет место детали в 3D-модели корпуса, группа — раздел спецификации.</p>
        </div>`;
      }
      function PartSheet({
        state,
        project,
        positions,
        theme,
        dispatch,
        onClose
      }) {
        const ui = useUi();
        const [draft, setDraft] = useState(() => createPart({ L: 600, W: 400 }));
        const [section, setSection] = useState("size");
        const [sub, setSub] = useState(null);
        const isNew = state?.mode === "new";
        const existing = state?.mode === "edit" ? project.parts.find((p) => p.id === state.id) ?? null : null;
        useEffect(() => {
          if (state?.mode === "new") setDraft(createPart({ L: 600, W: 400 }));
          setSection(state?.mode === "edit" ? state.section ?? "size" : "size");
          setSub(null);
        }, [state]);
        const part = isNew ? draft : existing;
        const open = Boolean(state && part);
        const groups = useMemo(() => [...new Set(project.parts.map((p) => p.group).filter(Boolean))], [project.parts]);
        const patch = (values) => {
          if (isNew) setDraft((d) => ({ ...d, ...values }));
          else if (existing) dispatch({ type: "part/update", id: existing.id, patch: values });
        };
        const add = () => {
          if (!(draft.L > 0 && draft.W > 0)) {
            ui.notify("Длина и ширина должны быть больше нуля", "error", "Укажите размеры");
            return;
          }
          dispatch({ type: "part/add", part: draft });
          ui.notify(`«${draft.name || "Деталь"}» добавлена`, "success");
          setDraft(createPart({ L: draft.L, W: draft.W, edges: [...draft.edges], grain: draft.grain, role: draft.role, group: draft.group }));
        };
        const remove = async () => {
          if (!existing) return;
          const ok = await ui.confirm({ title: "Удалить деталь?", message: existing.name || `Позиция ${positions.get(existing.id)}`, confirmLabel: "Удалить", danger: true });
          if (!ok) return;
          dispatch({ type: "part/remove", id: existing.id });
          onClose();
        };
        const position = existing ? positions.get(existing.id) : undefined;
        const features = part ? part.holes.length + part.operations.length : 0;
        return html`<${Fragment}>
          <${Sheet}
            open=${open}
            size="lg"
            title=${isNew ? "Новая деталь" : `Поз. ${position ?? "—"} · ${existing?.name || "Без названия"}`}
            subtitle=${part && part.L > 0 ? `${fmt(part.L, 1)} × ${fmt(part.W, 1)} × ${fmt(project.material.T, 1)} мм · ${roleLabel(part.role)}` : undefined}
            onClose=${onClose}
            footer=${isNew ? html`<${Fragment}>
              <${Button} variant="secondary" onClick=${onClose}>
                Готово
              <//>
              <${Button} variant="primary" icon="plus" onClick=${add}>
                Добавить
              <//>
            <//>` : html`<${Fragment}>
                      <${IconButton} icon="trash-2" label="Удалить деталь" variant="danger" onClick=${() => void remove()} />
                      <${IconButton}
                        icon="copy"
                        label="Дублировать деталь"
                        onClick=${() => {
                          if (!existing) return;
                          dispatch({ type: "part/duplicate", id: existing.id });
                          ui.notify("Копия добавлена следом за деталью", "success", "Деталь продублирована");
                        }}
                      />
                      <${Button} variant="primary" onClick=${onClose}>
                        Готово
                      <//>
                    <//>`}
          >
            ${part && html`<${Fragment}>
              <div className="sheet-tabs">
                <${Segmented}
                  label="Раздел"
                  value=${section}
                  options=${[
                    { value: "size", label: "Деталь" },
                    { value: "drill", label: features ? `Присадка · ${features}` : "Присадка" },
                    { value: "assembly", label: "Сборка" }
                  ]}
                  onChange=${setSection}
                />
              </div>
              ${section === "size" && html`<${PartForm} part=${part} material=${project.material} cut=${project.cut} edges=${project.edgeMaterials} onPatch=${patch} />`}
              ${section === "drill" && html`<${DrillingPanel} part=${part} T=${project.material.T} edges=${project.edgeMaterials} theme=${theme} onPatch=${patch} onOpen=${setSub} />`}
              ${section === "assembly" && html`<${AssemblyFields} part=${part} position=${position} groups=${groups} onPatch=${patch} />`}
            <//>`}
          <//>
          <${HardwareSheet}
            open=${open && sub?.type === "hardware"}
            part=${open ? part : null}
            T=${project.material.T}
            defaults=${project.drilling}
            edges=${project.edgeMaterials}
            theme=${theme}
            onClose=${() => setSub(null)}
            onApply=${(holes) => {
              if (!part) return;
              patch({ holes: [...part.holes, ...holes] });
              ui.notify(`Добавлено отверстий: ${holes.length}`, "success", "Фурнитура установлена");
              setSub(null);
            }}
            onRemoveGroup=${(group) => part && patch({ holes: part.holes.filter((h) => h.group !== group) })}
          />
          <${HoleSheet}
            part=${open && sub?.type === "hole" ? part : null}
            holeId=${sub?.type === "hole" ? sub.id : null}
            T=${project.material.T}
            edges=${project.edgeMaterials}
            theme=${theme}
            onPatch=${patch}
            onClose=${() => setSub(null)}
          />
          <${OperationSheet}
            part=${open && sub?.type === "op" ? part : null}
            opId=${sub?.type === "op" ? sub.id : null}
            T=${project.material.T}
            edges=${project.edgeMaterials}
            theme=${theme}
            onPatch=${patch}
            onClose=${() => setSub(null)}
          />
        <//>`;
      }

      function PartsView({
        project,
        positions,
        unplaced,
        dispatch,
        onEdit,
        onAdd,
        onPaste,
        onBulk
      }) {
        const ui = useUi();
        const [selecting, setSelecting] = useState(false);
        const [selected, setSelected] = useState(() => new Set());
        const [query, setQuery] = useState("");
        const pieces = project.parts.reduce((t, p) => t + p.qty, 0);
        const area = project.parts.reduce((t, p) => t + p.L * p.W * p.qty, 0) / 1_000_000;
        const visible = useMemo(() => {
          const q = query.trim().toLowerCase();
          const list = q ? project.parts.filter((p) => `${p.name} ${p.L}x${p.W} ${p.group} ${roleLabel(p.role)}`.toLowerCase().includes(q)) : project.parts;
          return [...list].sort((a, b) => (positions.get(a.id) ?? 0) - (positions.get(b.id) ?? 0));
        }, [project.parts, positions, query]);
        useEffect(() => {
          setSelected((s) => {
            const alive = new Set([...s].filter((id) => project.parts.some((p) => p.id === id)));
            return alive.size === s.size ? s : alive;
          });
        }, [project.parts]);
        const ids = visible.filter((p) => selected.has(p.id)).map((p) => p.id);
        const allSelected = visible.length > 0 && ids.length === visible.length;
        const exit = () => {
          setSelecting(false);
          setSelected(new Set());
        };
        const toggle = (id) => setSelected((s) => {
          const next = new Set(s);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
        const removeSelected = async () => {
          const ok = await ui.confirm({ title: `Удалить ${countLabel(ids.length, "деталь", "детали", "деталей")}?`, confirmLabel: "Удалить", danger: true });
          if (!ok) return;
          dispatch({ type: "parts/remove-many", ids });
          ui.notify(`Удалено: ${ids.length}`, "success");
          exit();
        };
        const duplicateSelected = () => {
          if (project.parts.length + ids.length > CONFIG.limits.partTypes) {
            ui.notify(`Не больше ${CONFIG.limits.partTypes} позиций в проекте`, "error", "Лимит позиций");
            return;
          }
          dispatch({ type: "parts/duplicate-many", ids });
          ui.notify(`Создано копий: ${ids.length}`, "success", "Дублирование");
          exit();
        };
        return html`<div className="view">
          <div className="view__scroll">
            <div className="view__content">
              <${Stats}
                items=${[
                  { label: "Позиций", value: fmt(project.parts.length) },
                  { label: "Деталей", value: fmt(pieces) },
                  { label: "Площадь", value: `${fmt(area, 2)} м²` }
                ]}
              />
              ${project.parts.length > 0 && html`<div className="list-toolbar">
                ${selecting ? html`<${Fragment}>
                  <${Button} variant="ghost" size="sm" icon=${allSelected ? "square-check" : "square"} onClick=${() => setSelected(allSelected ? new Set() : new Set(visible.map((p) => p.id)))}>
                    ${allSelected ? "Снять" : "Все"}
                  <//>
                  <span className="list-toolbar__count">Выбрано ${ids.length}</span>
                  <${Button} variant="ghost" size="sm" onClick=${exit}>
                    Отмена
                  <//>
                <//>` : html`<${Fragment}>
                    <label className="search">
                      <${Icon} name="search" size=${16} />
                      <input type="search" placeholder="Поиск по деталям" value=${query} onChange=${(e) => setQuery(e.target.value)} />
                      ${query && html`<${IconButton} icon="x" label="Очистить поиск" size=${16} onClick=${() => setQuery("")} />`}
                    </label>
                    <${Button} variant="ghost" size="sm" icon="square-check" onClick=${() => setSelecting(true)}>
                      Выбрать
                    <//>
                  <//>`}
              </div>`}
              ${project.parts.length === 0 ? html`<${EmptyState}
                icon="list"
                title="Список деталей пуст"
                action=${html`<${Button} variant="primary" icon="plus" onClick=${onAdd}>
                  Добавить деталь
                <//>`}
              >
                Добавьте детали вручную или вставьте список из Excel, Google Таблиц или Базиса.
              <//>` : visible.length === 0 ? html`<${EmptyState} icon="search" title="Ничего не найдено" compact>
                  Измените запрос поиска.
                <//>` : html`<ul className="part-list">
                  ${visible.map((part) => {
        const no = positions.get(part.id) ?? 0;
        const invalid = !(part.L > 0 && part.W > 0);
        const missing = unplaced.get(part.id);
        const checked = selected.has(part.id);
        const features = part.holes.length + part.operations.length;
        return html`<li key=${part.id}>
          <button
            type="button"
            className=${classNames("part-row", (invalid || Boolean(missing)) && "has-issue", checked && "is-selected")}
            style=${cssVars({ "--hue": hueOf(no - 1) })}
            aria-pressed=${selecting ? checked : undefined}
            onClick=${() => selecting ? toggle(part.id) : onEdit(part.id)}
          >
            ${selecting ? html`<span className=${classNames("checkbox", checked && "is-checked")} aria-hidden="true">
              ${checked && html`<${Icon} name="check" size=${14} />`}
            </span>` : html`<span className="part-row__no">${no}</span>`}
            <span className="part-row__main">
              <span className="part-row__name">${part.name || "Без названия"}</span>
              <span className="part-row__meta">
                ${invalid ? html`<span className="text-danger">Укажите размеры</span>` : html`<span>${fmt(part.L, 1)} × ${fmt(part.W, 1)}</span>`}
                ${part.role !== "other" && html`<span className="tag">${roleLabel(part.role)}</span>`}
                ${features > 0 && html`<span className="tag">
                  <${Icon} name="circle-dot" size=${11} /> ${features}
                </span>`}
                ${missing ? html`<span className="text-danger">не размещено ${missing}</span>` : null}
              </span>
            </span>
            <span className="part-row__aside">
              ${project.material.grain && part.grain && html`<${Icon} name="lock" size=${13} className="part-row__lock" />`}
              <${EdgeGlyph} edges=${part.edges} materials=${project.edgeMaterials} />
              <span className="part-row__qty">${fmt(part.qty)} шт</span>
            </span>
            ${!selecting && html`<${Icon} name="chevron-right" size=${16} className="chevron" />`}
          </button>
        </li>`;
      })}
                </ul>`}
            </div>
          </div>
          ${selecting ? html`<div className="dock">
            <${IconButton} icon="trash-2" label="Удалить выбранные" variant="danger" disabled=${!ids.length} onClick=${() => void removeSelected()} />
            <${Button} variant="secondary" icon="copy" disabled=${!ids.length} onClick=${duplicateSelected}>
              Дублировать
            <//>
            <${Button} variant="primary" icon="pencil" disabled=${!ids.length} onClick=${() => onBulk(ids, exit)}>
              Переименовать
            <//>
          </div>` : html`<div className="dock">
              <${Button} variant="secondary" icon="clipboard-paste" onClick=${onPaste}>

      const KEY = `${CONFIG.storagePrefix}:settings`;
      function read() {
        try {
          const raw = localStorage.getItem(KEY);
          return SettingsSchema.parse(raw ? JSON.parse(raw) : {});
        } catch {
          return SettingsSchema.parse({});
        }
      }
      const settingsStore = createStore(read());
      settingsStore.subscribe(() => {
        try {
          localStorage.setItem(KEY, JSON.stringify(settingsStore.get()));
        } catch {
        }
      });
      function updateSettings(patch) {
        settingsStore.set((prev) => ({ ...prev, ...patch }));
      }

      const freeSlots = (state) => CONFIG.limits.partTypes - state.parts.length;
      function reduce(state, action) {
        switch (action.type) {
          case "project/load":
            return action.project;
          case "project/rename":
            return { ...state, name: action.name.slice(0, 60) };
          case "section/patch":
            return { ...state, [action.section]: { ...state[action.section], ...action.patch } };
          case "edge/add":
            if (state.edgeMaterials.length >= CONFIG.limits.edgeMaterials) return state;
            return { ...state, edgeMaterials: [...state.edgeMaterials, createEdgeMaterial(state.edgeMaterials.length)] };
          case "edge/update":
            return {
              ...state,
              edgeMaterials: state.edgeMaterials.map((e) => e.id === action.id ? { ...e, ...action.patch } : e)
            };
          case "edge/remove":
            return {
              ...state,
              edgeMaterials: state.edgeMaterials.filter((e) => e.id !== action.id),
              parts: state.parts.map(
                (p) => p.edges.includes(action.id) ? { ...p, edges: p.edges.map((e) => e === action.id ? "" : e) } : p
              )
            };
          case "part/add":
            return freeSlots(state) > 0 ? { ...state, parts: [...state.parts, action.part] } : state;
          case "part/update":
            return { ...state, parts: state.parts.map((p) => p.id === action.id ? { ...p, ...action.patch } : p) };
          case "part/remove":
            return { ...state, parts: state.parts.filter((p) => p.id !== action.id) };
          case "part/duplicate": {
            const index = state.parts.findIndex((p) => p.id === action.id);
            const source = state.parts[index];
            if (!source || freeSlots(state) <= 0) return state;
            const parts = [...state.parts];
            parts.splice(index + 1, 0, clonePart(source));
            return { ...state, parts };
          }
          case "parts/append":
            return { ...state, parts: [...state.parts, ...action.parts.slice(0, freeSlots(state))] };
          case "parts/replace":
            return { ...state, parts: action.parts.slice(0, CONFIG.limits.partTypes) };
          case "parts/remove-many": {
            const ids = new Set(action.ids);
            return { ...state, parts: state.parts.filter((p) => !ids.has(p.id)) };
          }
          case "parts/duplicate-many": {
            const ids = new Set(action.ids);
            let free = freeSlots(state);
            const parts = [];
            for (const part of state.parts) {
              parts.push(part);
              if (ids.has(part.id) && free > 0) {
                parts.push(clonePart(part));
                free -= 1;
              }
            }
            return { ...state, parts };
          }
          case "parts/patch-many":
            return {
              ...state,
              parts: state.parts.map((p) => {
                const patch = action.patches[p.id];
                return patch ? { ...p, ...patch } : p;
              })
            };
          case "list/toggle":
            return { ...state, [action.key]: { ...state[action.key], enabled: action.enabled } };
          case "list/add": {
            const list = state[action.key];
            if (list.items.length >= CONFIG.limits.list) return state;
            return { ...state, [action.key]: { ...list, items: [...list.items, action.item] } };
          }
          case "list/update": {
            const list = state[action.key];
            return {
              ...state,
              [action.key]: {
                ...list,
                items: list.items.map((item) => item.id === action.id ? { ...item, ...action.patch } : item)
              }
            };
          }
          case "list/remove": {
            const list = state[action.key];
            return { ...state, [action.key]: { ...list, items: list.items.filter((item) => item.id !== action.id) } };
          }
        }
      }
      function projectReducer(state, action) {
        const next = reduce(state, action);
        if (next === state || action.type === "project/load") return next;
        return { ...next, updatedAt: Math.max(Date.now(), state.updatedAt + 1) };
      }

      const CLIENT_ID = crypto.getRandomValues(new Uint32Array(2)).join("-");

      const syncStatus = createStore({ state: "connecting" });
      function reducer(state, action) {
        if (action.type === "project/load") return action.project;
        return state ? projectReducer(state, action) : state;
      }
      function useWorkspace(repo, notify) {
        const [project, dispatch] = useReducer(reducer, null);
        const [boot, setBoot] = useState(loading("Загрузка проектов…"));
        const [bootAttempt, setBootAttempt] = useState(0);
        const [projects, setProjects] = useState(loading());
        const [listVersion, setListVersion] = useState(0);
        const latest = useRef(null);
        const saved = useRef(null);
        const revision = useRef(0);
        const saving = useRef(null);
        const retryTimer = useRef(null);
        const notifyRef = useRef(notify);
        notifyRef.current = notify;
        latest.current = project;
        const status = (next) => syncStatus.set(next);
        const apply = useCallback((next, rev) => {
          saved.current = next;
          revision.current = rev;
          dispatch({ type: "project/load", project: next });
        }, []);
        const flush = useCallback(async () => {
          if (saving.current) {
            await saving.current;
            if (latest.current !== saved.current) return flush();
            return undefined;
          }
          const snapshot = latest.current;
          if (!snapshot || snapshot === saved.current) return undefined;
          const run = (async () => {
            status({ state: "saving" });
            try {
              let result = await repo.save(snapshot, revision.current);
              if (!result.ok) {
                const remote = result.conflict;
                if (remote.project.updatedAt > snapshot.updatedAt) {
                  if (latest.current === snapshot) apply(remote.project, remote.revision);
                  else revision.current = remote.revision;
                  notifyRef.current({ tone: "info", title: "Синхронизация", message: "Загружена более новая версия с другого устройства" });
                  status({ state: "synced", at: Date.now() });
                  return;
                }
                revision.current = remote.revision;
                result = await repo.save(snapshot, revision.current);
                if (!result.ok) throw new AppError("Конфликт версий. Повторите изменение.", "conflict");
              }
              revision.current = result.revision;
              saved.current = snapshot;
              status({ state: "synced", at: Date.now() });
              setListVersion((v) => v + 1);
            } catch (error) {
              const appError = toAppError(error);
              status({ state: appError.code === "network" ? "offline" : "error", error: appError });
              if (retryTimer.current) clearTimeout(retryTimer.current);
              retryTimer.current = setTimeout(() => void flush(), 5000);
            }
          })();
          saving.current = run;
          try {
            await run;
          } finally {
            saving.current = null;
          }
          return undefined;
        }, [repo, apply]);
        useEffect(() => {
          if (!project || project === saved.current) return undefined;
          const timer = setTimeout(() => void flush(), CONFIG.saveDelay);
          return () => clearTimeout(timer);
        }, [project, flush]);
        const pull = useCallback(async () => {
          const current = latest.current;
          if (!current || current !== saved.current) return;
          const stored = await repo.load(current.id).catch(() => null);
          if (!stored || stored.revision <= revision.current) return;
          if (latest.current !== saved.current || latest.current?.id !== stored.project.id) return;
          apply(stored.project, stored.revision);
          notifyRef.current({ tone: "info", title: "Синхронизация", message: "Получены изменения с другого устройства" });
        }, [repo, apply]);
        useEffect(() => {
          const onVisibility = () => {
            if (document.visibilityState === "hidden") void flush();
            else void pull();
          };
          document.addEventListener("visibilitychange", onVisibility);
          const offs = [onTelegramEvent("deactivated", () => void flush()), onTelegramEvent("activated", () => void pull())];
          return () => {
            document.removeEventListener("visibilitychange", onVisibility);
            offs.forEach((off) => off());
          };
        }, [flush, pull]);
        useEffect(() => {
          const controller = new AbortController();
          setBoot(loading("Загрузка проектов…"));
          status({ state: "connecting" });
          (async () => {
            const list = await repo.list(controller.signal);
            const preferred = settingsStore.get().lastProjectId;
            const target = list.find((m) => m.id === preferred) ?? [...list].sort((a, b) => b.updatedAt - a.updatedAt)[0];
            if (target) {
              const stored = await repo.load(target.id, controller.signal);
              if (stored) {
                apply(stored.project, stored.revision);
                updateSettings({ lastProjectId: stored.project.id });
                return;
              }
            }
            const fresh = createProject("Шкаф-купе", list.length === 0);
            saved.current = null;
            revision.current = 0;
            dispatch({ type: "project/load", project: fresh });
            updateSettings({ lastProjectId: fresh.id });
          })().then(
            () => {
              if (controller.signal.aborted) return;
              setBoot(loaded(true));
              status({ state: "synced", at: Date.now() });
            },
            (error) => {
              if (!controller.signal.aborted) {
                setBoot(failed(error));
                status({ state: "error", error: toAppError(error) });
              }
            }
          );
          return () => controller.abort();
        }, [repo, bootAttempt]);
        useEffect(() => {
          if (boot.status !== "loaded") return undefined;
          return repo.watch((event) => {
            if (event.type === "connection") {
              const current = syncStatus.get();
              if (!event.online && current.state !== "error") {
                status({ state: "offline", error: new AppError("Нет связи — изменения сохранятся позже", "network") });
              } else if (event.online) {
                if (current.state === "offline") status({ state: "synced", at: Date.now() });
                void flush().then(pull);
              }
              return;
            }
            setListVersion((v) => v + 1);
            const currentId = latest.current?.id;
            if (event.origin === CLIENT_ID || event.id !== currentId) return;
            if (event.type === "deleted") {
              notifyRef.current({ tone: "warning", title: "Проект удалён", message: "Проект удалён на другом устройстве" });
              return;
            }
            if (event.revision <= revision.current) return;
            if (latest.current !== saved.current) return;
            void pull();
          });
        }, [repo, boot.status]);
        useEffect(() => {
          if (boot.status !== "loaded") return undefined;
          const controller = new AbortController();
          repo.list(controller.signal).then(
            (list) => !controller.signal.aborted && setProjects(loaded(list.sort((a, b) => b.updatedAt - a.updatedAt))),
            (error) => !controller.signal.aborted && setProjects(failed(error))
          );
          return () => controller.abort();
        }, [repo, boot.status, listVersion]);
        const open = useCallback(
          async (id) => {
            await flush();
            const stored = await repo.load(id);
            if (!stored) throw new AppError("Проект не найден — возможно, он удалён на другом устройстве", "not-found", false);
            apply(stored.project, stored.revision);
            updateSettings({ lastProjectId: id });
          },
          [repo, flush, apply]
        );
        const create = useCallback(
          async (name, withSample = false) => {
            await flush();
            const fresh = createProject(name, withSample);
            saved.current = null;
            revision.current = 0;
            dispatch({ type: "project/load", project: fresh });
            updateSettings({ lastProjectId: fresh.id });
          },
          [flush]
        );
        const remove = useCallback(
          async (id) => {
            if (latest.current?.id === id) saved.current = latest.current;
            await repo.remove(id);
            setListVersion((v) => v + 1);
            if (latest.current?.id !== id) return;
            const list = (await repo.list()).filter((m) => m.id !== id);
            const next = list[0];
            if (next) await open(next.id);
            else await create("Новый проект");
          },
          [repo, open, create]
        );
        return {
          boot,
          project,
          dispatch,
          projects,
          refreshProjects: () => setListVersion((v) => v + 1),
          open,
          create,
          remove,
          retryBoot: () => setBootAttempt((n) => n + 1),
          flush
        };
      }

      const DISPLAY_OPTIONS = [
        { key: "numbers", label: "Номера позиций" },
        { key: "names", label: "Названия деталей" },
        { key: "sizes", label: "Размеры деталей" },
        { key: "edges", label: "Кромка" },
        { key: "waste", label: "Размеры отходов" },
        { key: "hatch", label: "Штриховка отходов" },
        { key: "dims", label: "Размерные линии листа" }
      ];
      function DisplaySheet({ open, onClose }) {
        const settings = useStore(settingsStore);
        const setDisplay = (patch) => updateSettings({ display: { ...settings.display, ...patch } });
        return html`<${Sheet} open=${open} title="Отображение карты" onClose=${onClose}>
          <div className="form">
            ${DISPLAY_OPTIONS.map((o) => html`<${Toggle} key=${o.key} label=${o.label} checked=${settings.display[o.key]} onChange=${(v) => setDisplay({ [o.key]: v })} />`)}
            <${Field} label="Размер подписей">
              <${Segmented}
                label="Размер подписей"
                value=${settings.display.text}
                options=${[
                  { value: "s", label: "Мелкий" },
                  { value: "m", label: "Средний" },
                  { value: "l", label: "Крупный" }
                ]}
                onChange=${(text) => setDisplay({ text })}
              />
            <//>
          </div>
        <//>`;
      }
      function SettingsSheet({ open, onClose }) {
        const settings = useStore(settingsStore);
        const status = useStore(syncStatus);
        const user = telegramUser();
        return html`<${Sheet} open=${open} title="Настройки" onClose=${onClose}>
          <div className="form">
            <${Field} label="Тема">
              <${Segmented}
                label="Тема"
                value=${settings.theme}
                options=${[
                  { value: "system", label: "Как в Telegram" },
                  { value: "dark", label: "Тёмная" },
                  { value: "light", label: "Светлая" }
                ]}
                onChange=${(theme) => updateSettings({ theme })}
              />
            <//>
            <${Toggle}
              label="Тактильный отклик"
              hint="Вибрация при нажатиях"
              checked=${settings.haptics}
              onChange=${(haptics) => {
                setHapticsEnabled(haptics);
                updateSettings({ haptics });
              }}
            />
            <div className="form__section-title">Синхронизация</div>
            <div className="card sync-card">
              <${Icon} name=${status.state === "offline" || status.state === "error" ? "cloud-off" : "cloud"} size=${22} />
              <span>
                <b>Облако Telegram · обновление каждые 3 секунды</b>
                <small>
                  ${status.state === "synced" ? `Сохранено ${formatWhen(status.at)}` : status.state === "saving" ? "Сохранение…" : status.state === "connecting" ? "Подключение…" : status.error.message}
                </small>
              </span>
            </div>
            <p className="field__hint">
              ${user ? `Аккаунт Telegram: ${user.first_name}${user.username ? ` (@${user.username})` : ""}. ` : ""}

            </p>
            <p className="field__hint">fBuild 3.0 · раскрой, присадка, спецификация и 3D-сборка корпусной мебели. Иконки Lucide (ISC).</p>
          </div>
        <//>`;
      }

      const TABS = [
        { id: "parts", label: "Детали", icon: "list" },
        { id: "params", label: "Параметры", icon: "sliders-horizontal" },
        { id: "layout", label: "Раскрой", icon: "layout-grid" },
        { id: "assembly", label: "Сборка", icon: "box" },
        { id: "report", label: "Итоги", icon: "chart-column" }
      ];
      function SyncBadge() {
        const status = useStore(syncStatus);
        const view = status.state === "synced" ? { icon: "cloud", label: `Сохранено ${formatWhen(status.at)}`, tone: "ok" } : status.state === "saving" ? { icon: "cloud-upload", label: "Сохранение…", tone: "busy" } : status.state === "connecting" ? { icon: "loader-circle", label: "Подключение…", tone: "busy" } : status.state === "offline" ? { icon: "cloud-off", label: status.error.message, tone: "warn" } : { icon: "cloud-alert", label: status.error.message, tone: "error" };
        return html`<span className=${classNames("sync-badge", `sync-badge--${view.tone}`)} title=${view.label} role="status" aria-label=${view.label}>

      function AppBar({ title, subtitle, onProjects, onDocuments, onSettings }) {
        return html`<header className="appbar">

            f<b>B</b>
          </div>

          </div>
        </header>`;
      }
      function TabBar({ tab, onChange, badges }) {
        return html`<nav className="tabbar" aria-label="Разделы">
          ${TABS.map((t) => html`<button
            key=${t.id}
            type="button"
