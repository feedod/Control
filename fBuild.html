    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?external=react",

          "zod": "https://esm.sh/zod@4.6.7",
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <style>
      @layer base, components;

      @layer base {
        :root {
          color-scheme: dark;
          --bg: light-dark(#eef0f2, #17191b);
          --surface-1: light-dark(#ffffff, #1f2124);
          --surface-2: light-dark(#f6f7f8, #26292d);
          --surface-3: light-dark(#e9ecef, #30343a);
          --input: light-dark(#ffffff, #1b1d20);
          --border: light-dark(#dde1e5, #33373d);
          --border-strong: light-dark(#c2c9d0, #474d55);
          --text: light-dark(#1f2328, #f2f4f5);
          --text-2: light-dark(#56606a, #b4bcc4);
          --text-3: light-dark(#87909a, #858e97);
          --accent: #0696d7;
          --accent-hover: #38abdf;
          --accent-text: light-dark(#0679ad, #4cb5ea);
          --accent-soft: light-dark(rgb(6 150 215 / 0.1), rgb(6 150 215 / 0.16));
          --danger: light-dark(#d4372e, #ec4a41);
          --danger-soft: color-mix(in srgb, var(--danger) 14%, transparent);
          --warning: light-dark(#b86e00, #faa21b);
          --success: light-dark(#4f8a10, #87b340);
          --overlay: light-dark(rgb(255 255 255 / 0.94), rgb(31 33 36 / 0.92));
          --shadow: 0 8px 28px light-dark(rgb(20 30 40 / 0.18), rgb(0 0 0 / 0.45));
          --viewport-top: light-dark(#fafbfc, #3d434a);
          --viewport-bottom: light-dark(#d9dee3, #222629);
          --radius: 4px;
          --radius-lg: 8px;
          --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
          --appbar: 52px;
          --tabbar: 58px;
          --safe-top: 0px;
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-left: 0px;
          --safe-right: 0px;
          --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        :root[data-theme="light"] {
          color-scheme: light;
        }

        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        html,
        body,
        #root {
          height: 100%;
          margin: 0;
        }

        body {
          background: var(--bg);
          color: var(--text);
          font: 14px/1.4 var(--font);
          -webkit-tap-highlight-color: transparent;
          overscroll-behavior: none;
          overflow: hidden;
          text-size-adjust: 100%;
        }

        button,
        input,
        textarea {
          font: inherit;
          color: inherit;
        }

        button {
          border: 0;
          background: none;
          padding: 0;
          cursor: pointer;
          touch-action: manipulation;
        }

        button:disabled {
          cursor: default;
        }

        :focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        h1,
        h2,
        p {
          margin: 0;
        }

        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .icon {
          flex: none;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .spin {
          animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }

        .text-danger {
          color: var(--danger);
        }

        .text-success {
          color: var(--success);
        }

        .chevron {
          color: var(--text-3);
        }

        .dot {
          display: inline-block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          vertical-align: -1px;
        }
      }

      @layer components {
        .app {
          display: flex;
          flex-direction: column;
          height: var(--tg-viewport, 100dvh);
          padding: var(--safe-top) var(--safe-right) 0 var(--safe-left);
        }

        .app__main {
          position: relative;
          flex: 1;
          min-height: 0;
        }

        .appbar {
          display: flex;
          align-items: center;
          gap: 10px;
          height: var(--appbar);
          padding: 0 6px 0 12px;
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
        }

        .appbar__logo,
        .splash__logo,
        .gate__logo {
          display: flex;
          flex: none;
          align-items: center;
          justify-content: center;
          white-space: nowrap;
          width: 32px;
          height: 32px;
          border-radius: var(--radius);
          background: var(--accent);
          color: #fff;
          font-weight: 700;
          font-size: 15px;
          letter-spacing: -0.02em;
        }

        .appbar__logo b,
        .splash__logo b,
        .gate__logo b {
          font-weight: 800;
        }

        .appbar__project {
          display: grid;
          flex: 1;
          min-width: 0;
          text-align: start;
          line-height: 1.15;
        }

        .appbar__product {
          color: var(--accent-text);
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .appbar__title {
          display: flex;
          align-items: center;
          gap: 4px;
          min-width: 0;
          font-size: 15px;
          font-weight: 600;
        }

        .appbar__title span,
        .appbar__subtitle {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .appbar__subtitle {
          color: var(--text-3);
          font-size: 11px;
        }

        .appbar__actions {
          display: flex;
          flex: none;
          align-items: center;
          gap: 2px;
        }

        .sync-badge {
          display: grid;
          place-items: center;
          width: 36px;
          height: 36px;
          color: var(--text-3);
        }

        .sync-badge--ok {
          color: var(--success);
        }

        .sync-badge--busy {
          color: var(--accent-text);
        }

        .sync-badge--warn {
          color: var(--warning);
        }

        .sync-badge--error {
          color: var(--danger);
        }

        .tabbar {
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
          height: calc(var(--tabbar) + var(--safe-bottom));

          padding: 0 max(0px, calc((100% - 760px) / 2)) var(--safe-bottom);
          background: var(--surface-1);
          border-top: 1px solid var(--border);
        }

        .tabbar__item {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 3px;
          min-width: 0;
          padding: 6px 2px 4px;
          color: var(--text-3);
          transition: color 0.15s;

          &::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 22%;
            right: 22%;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: transparent;
            transition: background 0.15s;
          }

          &.is-active {
            color: var(--accent-text);
          }

          &.is-active::before {
            background: var(--accent);
          }
        }

        .tabbar__icon {
          position: relative;
          display: grid;
          place-items: center;
        }

        .tabbar__badge {
          position: absolute;
          top: -4px;
          right: -9px;
          min-width: 16px;
          height: 16px;
          padding: 0 4px;
          border-radius: 8px;
          background: var(--danger);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
          line-height: 16px;
        }

        .tabbar__label {
          max-width: 100%;
          overflow: hidden;
          font-size: 11px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .view {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
        }

        .view--center {
          display: grid;
          place-items: center;
          padding: 24px;
        }

        .view__scroll {
          flex: 1;
          min-height: 0;
          overflow-x: hidden;
          overflow-y: auto;
          overscroll-behavior: contain;
        }

        .view__content {
          display: grid;
          gap: 12px;
          width: 100%;
          max-width: 760px;
          margin: 0 auto;
          padding: 12px 12px 24px;

          & > * {
            min-width: 0;
          }
        }

        .dock {
          display: flex;
          gap: 8px;
          padding: 10px 12px;
          background: var(--surface-1);
          border-top: 1px solid var(--border);

          & > .btn {
            flex: 1;
            min-width: 0;
          }
        }

        @media (width >= 800px) {
          .dock {
            justify-content: center;
          }

          .dock > .btn {
            flex: 0 1 260px;
          }
        }

        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          min-width: 0;
          min-height: 42px;
          padding: 0 16px;
          border: 1px solid transparent;
          border-radius: var(--radius);
          font-size: 14px;
          font-weight: 600;
          line-height: 1.15;
          transition:
            background 0.15s,
            border-color 0.15s,
            opacity 0.15s;
        }

        .btn__label {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .btn--primary {
          background: var(--accent);
          color: #fff;

          &:active:not(:disabled) {
            background: #0580b8;
          }
        }

        .btn--secondary {
          border-color: var(--border-strong);
          background: var(--surface-2);
        }

        .btn--ghost {
          color: var(--accent-text);
        }

        .btn--danger {
          background: var(--danger);
          color: #fff;
        }

        .btn--sm {
          min-height: 34px;
          padding: 0 10px;
          font-size: 13px;
        }

        .btn--lg {
          min-height: 48px;
          font-size: 15px;
        }

        .btn--block {
          width: 100%;
        }

        .btn:disabled {
          opacity: 0.45;
        }

        @media (hover: hover) {
          .btn--primary:hover:not(:disabled) {
            background: var(--accent-hover);
          }

          .btn--secondary:hover:not(:disabled) {
            border-color: var(--accent);
          }

          .icon-btn:hover:not(:disabled) {
            background: var(--surface-3);
          }
        }

        .icon-btn {
          position: relative;
          display: grid;
          flex: none;
          place-items: center;
          width: 40px;
          height: 40px;
          border-radius: var(--radius);
          color: var(--text-2);
          transition: background 0.15s, color 0.15s;

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
          }
        }

        .icon-btn--danger {
          color: var(--danger);
        }

        .icon-btn--overlay {
          color: var(--text);
        }

        .icon-btn:disabled {
          opacity: 0.35;
        }

        .icon-btn__badge {
          position: absolute;
          top: 4px;
          right: 4px;
          min-width: 14px;
          height: 14px;
          border-radius: 7px;
          background: var(--danger);
          color: #fff;
          font-size: 9px;
          font-weight: 700;
          line-height: 14px;
        }

        .button-row {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;

          & .btn {
            flex-direction: column;
            gap: 4px;
            min-height: 60px;
            padding: 8px 4px;
            font-size: 12.5px;
          }

          & .btn__label {
            max-width: 100%;
            white-space: normal;
            text-align: center;
            overflow-wrap: anywhere;
          }
        }

        .form {
          display: grid;
          gap: 14px;

          & > * {
            min-width: 0;
          }
        }

        .form__section-title {
          margin-top: 4px;
          color: var(--text-2);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .grid-2,
        .grid-3 {
          display: grid;
          gap: 10px;
          align-items: start;
        }

        .grid-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        @media (width <= 359px) {
          .grid-3 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
        }

        .field {
          display: grid;
          gap: 6px;
          min-width: 0;
        }

        .field__label {
          overflow: hidden;
          color: var(--text-2);
          font-size: 12px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .field__hint,
        .field__error {
          color: var(--text-3);
          font-size: 12px;
          line-height: 1.35;
          overflow-wrap: anywhere;
        }

        .field__error {
          color: var(--danger);
        }

        .input {
          display: flex;
          align-items: center;
          min-width: 0;
          min-height: 42px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
          transition: border-color 0.15s, box-shadow 0.15s;

          &:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
          }
        }

        .has-error .input {
          border-color: var(--danger);
        }

        .input.is-disabled {
          opacity: 0.5;
        }

        .input input,
        .input textarea {
          flex: 1;
          width: 100%;
          min-width: 0;
          padding: 9px 10px;
          border: 0;
          outline: 0;
          background: transparent;
          font-size: 15px;
        }

        .input textarea {
          min-height: 72px;
          resize: vertical;
        }

        .input__unit {
          flex: none;
          padding-right: 10px;
          color: var(--text-3);
          font-size: 12px;
        }

        .toggle {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          min-height: 42px;
          cursor: pointer;

          &.is-disabled {
            opacity: 0.5;
            cursor: default;
          }
        }

        .toggle__text {
          display: grid;
          gap: 2px;
          min-width: 0;
        }

        .toggle__label {
          font-size: 14px;
          font-weight: 500;
        }

        .toggle__hint {
          color: var(--text-3);
          font-size: 12px;
          overflow-wrap: anywhere;
        }

        .switch {
          position: relative;
          flex: none;
          width: 42px;
          height: 24px;
          margin: 0;
          border-radius: 12px;
          background: var(--border-strong);
          appearance: none;
          cursor: pointer;
          transition: background 0.15s;

          &::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
            transition: transform 0.15s;
          }

          &:checked {
            background: var(--accent);
          }

          &:checked::before {
            transform: translateX(18px);
          }

          &:disabled {
            opacity: 0.5;
          }
        }

        .segmented {
          display: flex;
          width: 100%;
          min-width: 0;
          padding: 3px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
        }

        .segmented__item {
          flex: 1 1 0;
          min-width: 0;
          min-height: 36px;
          padding: 6px 6px;
          border-radius: 3px;
          color: var(--text-2);
          font-size: 13px;
          font-weight: 600;
          line-height: 1.15;
          overflow-wrap: anywhere;

          &.is-active {
            background: var(--accent-soft);
            color: var(--accent-text);
            box-shadow: inset 0 -2px 0 var(--accent);
          }
        }

        .segmented--sm .segmented__item {
          min-height: 32px;
          font-size: 12px;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          min-width: 0;
        }

        .chip {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          max-width: 100%;
          min-height: 32px;
          padding: 4px 12px;
          border: 1px solid var(--border-strong);
          border-radius: 16px;
          background: var(--surface-2);
          color: var(--text-2);
          font-size: 13px;
          font-weight: 500;
          line-height: 1.2;
          text-align: start;

          & span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          &.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-text);
          }

          &:disabled {
            opacity: 0.4;
          }
        }

        .chip__dot {
          flex: none;
          width: 9px;
          height: 9px;
          border-radius: 50%;
        }

        .swatches {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .swatch {
          width: 28px;
          height: 28px;
          border: 2px solid transparent;
          border-radius: 50%;
          box-shadow: inset 0 0 0 2px var(--surface-1);

          &.is-active {
            border-color: var(--text);
          }
        }

        .slider {
          width: 100%;
          accent-color: var(--accent);
        }

        .anchor-field {
          display: flex;
          align-items: center;
          gap: 14px;
          min-width: 0;
        }

        .anchor-field__text {
          display: grid;
          gap: 4px;
          min-width: 0;

          & small {
            color: var(--text-3);
            font-size: 12px;
          }
        }

        .anchor-grid {
          display: grid;
          flex: none;
          grid-template-columns: repeat(3, 40px);
          grid-auto-rows: 40px;
          gap: 4px;
          padding: 4px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
        }

        .anchor-grid__cell {
          border-radius: 3px;
          background: var(--surface-3);
          color: var(--text-2);
          font-size: 16px;

          &:disabled {
            opacity: 0.22;
          }

          &.is-active {
            background: var(--accent);
            color: #fff;
          }
        }

        .search {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 6px;
          min-width: 0;
          height: 36px;
          padding: 0 4px 0 10px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
          color: var(--text-3);

          & input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
          }

          & .icon-btn {
            width: 30px;
            height: 30px;
          }
        }

        .inline-alert {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 10px 12px;
          border-radius: var(--radius);
          background: var(--danger-soft);
          color: var(--danger);
          font-size: 13px;
          overflow-wrap: anywhere;
        }

        .panel {
          min-width: 0;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-1);
        }

        .panel__header {
          display: flex;
          align-items: center;
          gap: 4px;
          min-height: 46px;
          padding-right: 6px;
        }

        .panel__toggle {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 8px;
          min-width: 0;
          min-height: 46px;
          padding: 0 12px;
          text-align: start;
        }

        .panel__chevron {
          color: var(--text-3);
          transition: transform 0.2s;
        }

        .panel.is-collapsed .panel__chevron {
          transform: rotate(-90deg);
        }

        .panel__icon {
          color: var(--accent-text);
        }

        .panel__title {
          overflow: hidden;
          color: var(--text);
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-overflow: ellipsis;
          text-transform: uppercase;
          white-space: nowrap;
        }

        .panel__aside {
          display: flex;
          flex: none;
          align-items: center;
          gap: 2px;
        }

        .panel__body {
          padding: 4px 14px 16px;
        }

        .panel__body--flush {
          padding: 0 0 4px;
        }

        .panel__lead {
          padding: 0 0 12px;
        }

        .panel__body--flush .panel__lead {
          padding: 10px 14px;
        }

        .card {
          display: grid;
          gap: 12px;
          min-width: 0;
          padding: 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-2);
        }

        .card__row {
          display: flex;
          align-items: flex-end;
          gap: 10px;
          min-width: 0;

          & .field {
            flex: 1;
          }
        }

        .card__swatch {
          flex: none;
          width: 10px;
          height: 42px;
          border-radius: 3px;
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(var(--stats-cols, 3), minmax(0, 1fr));
          gap: 1px;
          margin: 0;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--border);
        }

        .stats__item {
          min-width: 0;
          padding: 10px clamp(8px, 2.5vw, 12px);
          background: var(--surface-1);
        }

        .stats dt {
          overflow: hidden;
          color: var(--text-3);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-overflow: ellipsis;
          text-transform: uppercase;
          white-space: nowrap;
        }

        .stats dd {
          margin: 2px 0 0;
          overflow: hidden;
          font-size: 17px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .panel .stats {
          border-width: 0 0 1px;
          border-radius: 0;
        }

        .tag,
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          min-width: 0;
          padding: 0 7px;
          border-radius: 3px;
          background: var(--surface-3);
          color: var(--text-2);
          font-size: 11px;
          font-weight: 600;
          line-height: 20px;
          white-space: nowrap;
        }

        .badge {
          background: var(--overlay);
          box-shadow: 0 0 0 1px var(--border);
        }

        .badge--accent {
          background: var(--accent);
          color: #fff;
          box-shadow: none;
        }

        .badge--danger {
          background: var(--danger);
          color: #fff;
          box-shadow: none;
        }

        .state {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          width: 100%;
          min-height: 100%;
          margin: auto;
          padding: 32px 24px;
          text-align: center;
        }

        .state--compact {
          min-height: 0;
          padding: 16px;
        }

        .state__icon {
          color: var(--text-3);
        }

        .state__icon--accent {
          color: var(--accent-text);
        }

        .state--error .state__icon,
        .state--error .state__title {
          color: var(--danger);
        }

        .state__title {
          max-width: 420px;
          font-size: 15px;
          font-weight: 600;
          overflow-wrap: anywhere;
        }

        .state__text {
          max-width: 420px;
          color: var(--text-2);
          font-size: 13px;
          overflow-wrap: anywhere;
        }

        .state__action {
          margin-top: 4px;
        }

        .sheet,
        .dialog {
          padding: 0;
          border: 0;
          color: inherit;
          background: var(--surface-1);
          box-shadow: var(--shadow);
          outline: 0;
          overscroll-behavior: contain;
          transition:
            translate 0.24s var(--ease-out),
            opacity 0.2s,
            scale 0.2s var(--ease-out),
            overlay 0.24s allow-discrete,
            display 0.24s allow-discrete;

          &::backdrop {
            background: rgb(0 0 0 / 0);
            transition:
              background 0.24s,
              overlay 0.24s allow-discrete,
              display 0.24s allow-discrete;
          }

          &[open]::backdrop {
            background: rgb(0 0 0 / 0.5);
          }

          @starting-style {
            &[open]::backdrop {
              background: rgb(0 0 0 / 0);
            }
          }
        }

        .sheet {
          width: 100%;
          max-width: 100%;
          max-height: calc(var(--tg-viewport, 100dvh) - var(--safe-top) - 16px);
          margin: auto 0 0;
          border-radius: 12px 12px 0 0;
          translate: 0 100%;

          &[open] {
            display: flex;
            flex-direction: column;
            translate: 0 0;
          }

          @starting-style {
            &[open] {
              translate: 0 100%;
            }
          }
        }

        .sheet__grip {
          width: 36px;
          height: 4px;
          margin: 8px auto 0;
          border-radius: 2px;
          background: var(--border-strong);
        }

        .sheet__header {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 8px 8px 8px 16px;
          border-bottom: 1px solid var(--border);
        }

        .sheet__titles {
          flex: 1;
          min-width: 0;
          padding-top: 6px;
        }

        .sheet__title {
          overflow: hidden;
          font-size: 16px;
          font-weight: 700;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .sheet__subtitle {
          margin-top: 2px;
          color: var(--text-3);
          font-size: 12px;
          overflow-wrap: anywhere;
        }

        .sheet__body {
          flex: 1;
          min-height: 0;
          overflow: hidden auto;
          overscroll-behavior: contain;
          padding: 14px 16px 20px;
        }

        .sheet__footer {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 12px calc(10px + var(--safe-bottom));
          border-top: 1px solid var(--border);

          & .btn {
            flex: 1;
          }
        }

        .sheet-tabs {
          position: sticky;
          top: -14px;
          z-index: 2;
          margin: -14px -16px 14px;
          padding: 10px 16px;
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
        }

        @media (width >= 720px) {
          .sheet {
            max-width: 560px;
            max-height: min(88dvh, 900px);
            margin: auto;
            border-radius: var(--radius-lg);
            translate: none;
            opacity: 0;
            scale: 0.97;

            &[open] {
              opacity: 1;
              scale: 1;
            }

            @starting-style {
              &[open] {
                opacity: 0;
                scale: 0.97;
              }
            }
          }

          .sheet--lg {
            max-width: 720px;
          }

          .sheet__grip {
            display: none;
          }

          .sheet__footer {
            padding-bottom: 10px;
          }
        }

        .dialog {
          width: calc(100% - 48px);
          max-width: 400px;
          margin: auto;
          border-radius: var(--radius-lg);
          opacity: 0;
          scale: 0.97;

          &[open] {
            display: grid;
            gap: 10px;
            padding: 20px;
            opacity: 1;
            scale: 1;
          }

          @starting-style {
            &[open] {
              opacity: 0;
              scale: 0.97;
            }
          }
        }

        .dialog__title {
          font-size: 17px;
          font-weight: 700;
          overflow-wrap: anywhere;
          text-wrap: balance;
        }

        .dialog__text {
          color: var(--text-2);
          overflow-wrap: anywhere;
          text-wrap: pretty;
        }

        .dialog__actions {
          display: flex;
          justify-content: flex-end;
          gap: 8px;
          margin-top: 8px;
        }

        .toasts {
          position: fixed;
          inset: calc(var(--safe-top) + var(--appbar) + 8px) auto auto 50%;
          width: min(480px, calc(100% - 24px));
          margin: 0;
          padding: 0;
          overflow: visible;
          border: 0;
          background: none;
          translate: -50% 0;
          pointer-events: none;
        }

        .toast {
          position: relative;
          display: flex;
          align-items: flex-start;
          gap: 10px;
          width: 100%;
          overflow: hidden;
          padding: 11px 12px 11px 16px;
          border-radius: 6px;
          background: #2b2f33;
          color: #fff;
          box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
          text-align: start;
          pointer-events: auto;
          --tone: var(--success);
          transition:
            opacity 0.18s,
            translate 0.18s var(--ease-out);

          @starting-style {
            opacity: 0;
            translate: 0 -8px;
          }

          & + & {
            margin-top: 8px;
          }

          &::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            background: var(--tone);
          }

          & > .icon {
            margin-top: 1px;
            color: var(--tone);
          }
        }

        .toast--error {
          --tone: var(--danger);
        }

        .toast--warning {
          --tone: var(--warning);
        }

        .toast--info {
          --tone: var(--accent-hover);
        }

        .toast__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          font-size: 13px;
          overflow-wrap: anywhere;

          & b {
            font-size: 13.5px;
          }

          & span {
            color: #d4d8dc;
          }
        }

        .toast__close {
          margin-top: 2px;
          color: #8f979f;
        }

        .list-toolbar {
          display: flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
        }

        .list-toolbar__count {
          flex: 1;
          font-weight: 600;
          text-align: center;
        }

        .part-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-1);

          & li + li {
            border-top: 1px solid var(--border);
          }
        }

        .part-row {
          display: grid;
          grid-template-columns: 30px minmax(0, 1fr) auto 16px;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 60px;
          padding: 8px 10px 8px 12px;
          box-shadow: inset 3px 0 0 hsl(var(--hue, 200) 55% 55%);
          text-align: start;

          &:active {
            background: var(--surface-2);
          }

          &.is-selected {
            background: var(--accent-soft);
          }

          &.has-issue {
            box-shadow: inset 3px 0 0 var(--danger);
          }
        }

        .part-row__no {
          display: grid;
          place-items: center;
          width: 30px;
          height: 30px;
          border-radius: var(--radius);
          background: light-dark(hsl(var(--hue, 200) 60% 90%), hsl(var(--hue, 200) 30% 30% / 0.55));
          color: var(--text);
          font-size: 13px;
          font-weight: 700;
        }

        .part-row__main {
          display: grid;
          gap: 3px;
          min-width: 0;
        }

        .part-row__name {
          overflow: hidden;
          font-size: 14.5px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .part-row__meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 4px 8px;
          min-width: 0;
          color: var(--text-2);
          font-size: 12px;
        }

        .part-row__aside {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .part-row__lock {
          color: var(--text-3);
        }

        .part-row__qty {
          min-width: 44px;
          padding: 2px 8px;
          border-radius: 12px;
          background: var(--surface-3);
          font-size: 12px;
          font-weight: 700;
          text-align: center;
          white-space: nowrap;
        }

        @media (width <= 359px) {
          .part-row__lock,
          .part-row__aside .edge-glyph {
            display: none;
          }
        }

        .checkbox {
          display: grid;
          place-items: center;
          width: 24px;
          height: 24px;
          margin: 3px;
          border: 2px solid var(--border-strong);
          border-radius: 4px;
          color: #fff;

          &.is-checked {
            border-color: var(--accent);
            background: var(--accent);
          }
        }

        .edge-glyph {
          display: inline-block;
          flex: none;
          border: 3px solid transparent;
          border-radius: 2px;
          background: var(--surface-3);
        }

        .edge-editor {
          display: grid;
          gap: 12px;
        }

        .edge-editor__head {
          display: flex;
          align-items: flex-start;
          gap: 14px;
        }

        .edge-editor__quick {
          display: grid;
          flex: 1;
          gap: 6px;
          min-width: 0;
        }

        .edge-editor__row {
          display: grid;
          grid-template-columns: 52px minmax(0, 1fr);
          align-items: start;
          gap: 8px;
        }

        .edge-editor__side {
          display: grid;
          padding-top: 4px;
          line-height: 1.2;

          & small {
            color: var(--text-3);
            font-size: 11px;
          }
        }

        .schematic {
          position: relative;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius);

          & canvas {
            display: block;
            touch-action: manipulation;
          }
        }

        .schematic__empty {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          color: var(--text-3);
          font-size: 13px;
        }

        .feature-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          background: var(--surface-2);
        }

        .feature-row {
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
          min-height: 52px;
          padding: 8px 10px 8px 14px;
          border-bottom: 1px solid var(--border);
          text-align: start;

          &:last-child {
            border-bottom: 0;
          }

          &:active {
            background: var(--surface-3);
          }
        }

        .feature-row__dot {
          flex: none;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--dot, var(--text-3));

          &.is-ring {
            border: 2px dashed var(--dot);
            background: transparent;
          }

          &.is-square {
            border: 2px solid var(--text-3);
            border-radius: 2px;
            background: transparent;
          }
        }

        .feature-row__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;

          & b {
            font-size: 14px;
            font-weight: 600;
          }

          & small {
            overflow: hidden;
            color: var(--text-2);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        }

        .preset-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 8px;
        }

        .preset-card {
          display: grid;
          align-content: start;
          gap: 4px;
          min-width: 0;
          min-height: 66px;
          padding: 10px 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-2);
          text-align: start;

          & b {
            font-size: 14px;
            font-weight: 600;
          }

          & small {
            color: var(--text-2);
            font-size: 11.5px;
            line-height: 1.3;
          }

          &.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: inset 3px 0 0 var(--accent);
          }
        }

        .group-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 6px 4px 6px 12px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);
        }

        .group-row__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;

          & b {
            overflow-wrap: anywhere;
          }

          & small {
            color: var(--text-2);
            font-size: 12px;
          }
        }

        .bulk-preview {
          display: grid;
          gap: 6px;
          padding: 10px 12px;
          border: 1px dashed var(--border-strong);
          border-radius: var(--radius);
          font-size: 12.5px;

          & div {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
          }

          & span,
          & b {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & span,
          & small {
            color: var(--text-3);
          }
        }

        .section-nav {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding: 8px max(12px, calc((100% - 760px) / 2 + 12px));
          background: var(--surface-1);
          border-bottom: 1px solid var(--border);
          scrollbar-width: none;
        }

        .section-nav__item {
          flex: none;
          min-height: 30px;
          padding: 0 12px;
          border: 1px solid var(--border-strong);
          border-radius: 15px;
          color: var(--text-2);
          font-size: 12.5px;
          font-weight: 600;

          &:active {
            background: var(--accent-soft);
            color: var(--accent-text);
          }
        }

        .view__content .panel {
          scroll-margin-top: 8px;
        }

        .mode-list,
        .doc-list {
          display: grid;
          gap: 8px;
        }

        .mode,
        .doc {
          display: flex;
          align-items: center;
          gap: 12px;
          min-width: 0;
          padding: 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--surface-2);
          text-align: start;
        }

        .mode.is-active,
        .doc.is-active {
          border-color: var(--accent);
          background: var(--accent-soft);
        }

        .doc.is-muted .doc__text small {
          color: var(--warning);
        }

        .mode__radio,
        .radio {
          flex: none;
          width: 20px;
          height: 20px;
          border: 2px solid var(--border-strong);
          border-radius: 50%;
        }

        .mode.is-active .mode__radio,
        .doc.is-active .radio {
          border: 6px solid var(--accent);
        }

        .mode__text,
        .doc__text {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
        }

        .mode__text b,
        .doc__text b {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 0 8px;
          font-size: 14.5px;
          font-weight: 600;
        }

        .doc__text em {
          color: var(--text-3);
          font-size: 11px;
          font-style: normal;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .mode__text small,
        .doc__text small {
          color: var(--text-2);
          font-size: 12px;
          overflow-wrap: anywhere;
        }

        .doc__icon {
          display: grid;
          flex: none;
          place-items: center;
          width: 40px;
          height: 40px;
          border-radius: var(--radius);
          background: var(--surface-3);
          color: var(--accent-text);
        }

        .list-editor {
          display: grid;
          gap: 10px;

          &.is-disabled {
            opacity: 0.55;
          }
        }

        .list-editor__row {
          display: grid;
          grid-template-columns: 22px minmax(0, 1fr) 40px;
          align-items: end;
          gap: 8px;
        }

        .list-editor__index {
          padding-bottom: 12px;
          color: var(--text-3);
          font-weight: 700;
        }

        .list-editor__fields {
          display: grid;
          gap: 8px;
        }

        @media (width <= 420px) {
          .list-editor__fields {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          }
        }

        .table-wrap {
          overflow-x: auto;
        }

        .table {
          width: 100%;
          border-collapse: collapse;
          font-size: 13.5px;

          & th {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-3);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: start;
            text-transform: uppercase;
          }

          & td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
          }

          & .num {
            text-align: right;
            white-space: nowrap;
          }
        }

        .table__group td {
          padding-top: 12px;
          background: var(--surface-2);
          color: var(--accent-text);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .table__group small {
          color: var(--text-3);
          font-weight: 500;
          letter-spacing: 0;
          text-transform: none;
        }

        .table__name {
          display: block;
          overflow-wrap: anywhere;
        }

        .table__sub {
          display: block;
          margin-top: 2px;
          color: var(--text-3);
          font-size: 12px;
        }

        .table tr.is-clickable {
          cursor: pointer;
        }

        .table tr.is-clickable:active {
          background: var(--surface-2);
        }

        .table tfoot td {
          color: var(--text-2);
        }

        .table__total td {
          color: var(--text);
          font-size: 15px;
          font-weight: 700;
        }

        .view--layout {
          gap: 0;

          & > .stats {
            border-width: 1px 0 0;
            border-radius: 0;
          }
        }

        .viewport {
          position: relative;
          flex: 1;
          min-height: 240px;
          overflow: hidden;
          background: linear-gradient(180deg, var(--viewport-top), var(--viewport-bottom));
        }

        .viewport__canvas {
          position: absolute;
          inset: 0;
          touch-action: none;

          & canvas {
            display: block;
          }
        }

        .viewport__top {
          position: absolute;
          top: 10px;
          left: 10px;
          right: 10px;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
          pointer-events: none;

          & > * {
            pointer-events: auto;
          }
        }

        .pager {
          display: flex;
          align-items: center;
          min-width: 0;
          max-width: 100%;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);

          & .icon-btn {
            width: 36px;
            height: 36px;
          }
        }

        .pager__label {
          display: grid;
          min-width: 0;
          padding: 2px 4px;
          line-height: 1.2;
          text-align: center;

          & b {
            overflow: hidden;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-3);
            font-size: 11px;
          }
        }

        .viewer-toolbar {
          position: absolute;
          bottom: 12px;
          left: 50%;
          z-index: 3;
          display: flex;
          align-items: center;
          gap: 2px;
          max-width: calc(100% - 16px);
          padding: 4px;
          overflow-x: auto;
          border-radius: 6px;
          background: rgb(32 35 38 / 0.94);
          box-shadow: 0 4px 16px rgb(0 0 0 / 0.35);
          transform: translateX(-50%);
          scrollbar-width: none;

          & .icon-btn {
            width: 40px;
            height: 40px;
            color: #e8ecef;
          }

          & .icon-btn.is-active {
            background: rgb(6 150 215 / 0.3);
            color: #7fd0f5;
          }
        }

        .viewer-toolbar__sep {
          flex: none;
          width: 1px;
          height: 24px;
          margin: 0 3px;
          background: rgb(255 255 255 / 0.16);
        }

        .inspector {
          position: absolute;
          left: 10px;
          right: 10px;
          bottom: 64px;
          z-index: 4;
          display: flex;
          align-items: center;
          gap: 10px;
          max-width: 560px;
          margin: 0 auto;
          padding: 10px 6px 10px 12px;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
        }

        .inspector__swatch {
          flex: none;
          width: 6px;
          align-self: stretch;
          border-radius: 3px;
          background: hsl(var(--hue) 55% 55%);
        }

        .inspector__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          font-size: 12.5px;

          & b {
            overflow: hidden;
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & > span {
            color: var(--text-2);
            overflow-wrap: anywhere;
          }
        }

        .inspector__edges {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;

          & i {
            padding: 0 6px;
            border-left: 3px solid var(--edge);
            background: var(--surface-3);
            font-size: 11px;
            font-style: normal;
          }
        }

        .thumbs {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding: 8px 12px;
          background: var(--surface-1);
          border-top: 1px solid var(--border);
          scrollbar-width: thin;
        }

        .thumb {
          position: relative;
          display: grid;
          flex: none;
          gap: 4px;
          padding: 6px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);

          &.is-active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
          }
        }

        .thumb__count {
          position: absolute;
          top: 3px;
          right: 3px;
          padding: 0 4px;
          border-radius: 3px;
          background: var(--accent);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
        }

        .thumb__meta {
          display: flex;
          justify-content: space-between;
          gap: 6px;
          font-size: 11px;

          & span {
            color: var(--text-3);
          }
        }

        .viewport3d {
          position: relative;
          height: min(58vh, 540px);
          min-height: 300px;
          overflow: hidden;
          background: linear-gradient(180deg, var(--viewport-top) 0%, var(--viewport-bottom) 100%);
          border-bottom: 1px solid var(--border);

          & > .state {
            height: 100%;
          }
        }

        .viewer {
          position: absolute;
          inset: 0;
          touch-action: none;
        }

        .viewer__canvas {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
        }

        .viewer.is-fullscreen {
          position: fixed;
          z-index: 40;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
          background: linear-gradient(180deg, var(--viewport-top) 0%, var(--viewport-bottom) 100%);
        }

        .viewer--fallback {
          display: flex;
          flex-direction: column;
        }

        .viewer__stage {
          position: relative;
          flex: 1;
          min-height: 0;

          & canvas {
            position: absolute;
            inset: 0;
          }
        }

        .viewer-banner {
          display: flex;
          flex: none;
          align-items: center;
          gap: 10px;
          width: calc(100% - 20px);
          max-width: 560px;
          margin: 0 auto 10px;
          padding: 10px 10px 10px 12px;
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
          color: var(--warning);

          & span {
            display: grid;
            flex: 1;
            gap: 2px;
            min-width: 0;
            color: var(--text);
            font-size: 13px;
            overflow-wrap: anywhere;
          }

          & small {
            color: var(--text-2);
            font-size: 12px;
          }
        }

        .viewcube {
          position: absolute;
          top: 10px;
          right: 10px;
          z-index: 3;
          width: 84px;
          height: 84px;
        }

        .viewcube__cube {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }

        .viewcube__face {
          position: absolute;
          inset: 14px;
          display: grid;
          place-items: center;
          border: 1px solid light-dark(#b7c0c8, #5b636c);
          background: light-dark(rgb(246 248 250 / 0.94), rgb(52 57 63 / 0.94));
          color: var(--text-2);
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          backface-visibility: hidden;
          transition: background 0.15s, color 0.15s;

          &:hover,
          &:focus-visible {
            background: var(--accent);
            color: #fff;
          }
        }

        .viewcube__face--front {
          transform: translateZ(28px);
        }

        .viewcube__face--back {
          transform: rotateY(180deg) translateZ(28px);
        }

        .viewcube__face--right {
          transform: rotateY(90deg) translateZ(28px);
        }

        .viewcube__face--left {
          transform: rotateY(-90deg) translateZ(28px);
        }

        .viewcube__face--top {
          transform: rotateX(90deg) translateZ(28px);
        }

        .viewcube__face--bottom {
          transform: rotateX(-90deg) translateZ(28px);
        }

        .viewcube__home {
          position: absolute;
          top: -2px;
          left: -34px;
          width: 32px;
          height: 32px;
          background: var(--overlay);
          box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);
        }

        .viewer-panel {
          position: absolute;
          top: 10px;
          left: 10px;
          bottom: 66px;
          z-index: 4;
          display: flex;
          flex-direction: column;
          width: min(320px, calc(100% - 20px));
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: 6px;
          background: var(--overlay);
          box-shadow: var(--shadow);
          backdrop-filter: blur(10px);
        }

        @media (width <= 560px) {
          .viewer-panel {
            top: auto;
            right: 10px;
            width: auto;
            max-height: 58%;
          }
        }

        .viewer-panel__header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-height: 40px;
          padding: 0 4px 0 12px;
          border-bottom: 1px solid var(--border);
          font-size: 12px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .viewer-panel__body {
          flex: 1;
          min-height: 0;
          overflow-y: auto;
          padding: 10px 12px 14px;
        }

        .viewer-panel__hint {
          color: var(--text-2);
          font-size: 13px;
        }

        .view-buttons {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }

        .tree {
          display: grid;
          gap: 10px;
        }

        .tree__reset {
          justify-self: start;
          color: var(--accent-text);
          font-size: 12.5px;
          font-weight: 600;
        }

        .tree__group-title {
          margin-bottom: 4px;
          color: var(--text-3);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .tree__item {
          display: flex;
          align-items: center;
          border-radius: var(--radius);

          &.is-selected {
            background: var(--accent-soft);
          }

          &.is-hidden {
            opacity: 0.45;
          }

          & .icon-btn {
            width: 32px;
            height: 32px;
          }
        }

        .tree__name {
          display: flex;
          flex: 1;
          align-items: baseline;
          gap: 8px;
          min-width: 0;
          min-height: 34px;
          padding: 6px 6px;
          text-align: start;

          & b {
            flex: none;
            min-width: 18px;
            color: var(--accent-text);
          }

          & span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-3);
          }
        }

        .props {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          gap: 6px 12px;
          margin: 0;
          font-size: 13px;

          & dt {
            color: var(--text-3);
          }

          & dd {
            margin: 0;
            overflow-wrap: anywhere;
          }
        }

        .props__row {
          display: contents;
        }

        .delivery {
          display: grid;
          gap: 12px;
          padding: 12px;
          border: 1px solid var(--accent);
          border-radius: var(--radius-lg);
          background: var(--accent-soft);
        }

        .delivery__file {
          display: flex;
          align-items: center;
          gap: 10px;
          min-width: 0;
          color: var(--accent-text);

          & span {
            display: grid;
            min-width: 0;
          }

          & b {
            overflow: hidden;
            color: var(--text);
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-2);
          }
        }

        .delivery__actions {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;

          & .btn {
            padding: 0 8px;
          }
        }

        .project-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
        }

        .project-row {
          display: flex;
          align-items: center;
          gap: 4px;
          padding-right: 4px;
          border-bottom: 1px solid var(--border);

          &:last-child {
            border-bottom: 0;
          }

          &.is-current {
            box-shadow: inset 3px 0 0 var(--accent);
            background: var(--accent-soft);
          }
        }

        .project-row__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          min-height: 56px;
          padding: 8px 12px;
          text-align: start;

          & b {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-3);
            font-size: 12px;
          }
        }

        .sync-card {
          display: flex;
          align-items: center;
          gap: 12px;
          color: var(--accent-text);

          & span {
            display: grid;
            gap: 2px;
            min-width: 0;
            color: var(--text);
          }

          & small {
            color: var(--text-2);
            overflow-wrap: anywhere;
          }
        }

        .splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          height: var(--tg-viewport, 100dvh);
          padding: 24px;
        }

        .splash__logo,
        .gate__logo {
          width: 56px;
          height: 56px;
          border-radius: 10px;
          font-size: 24px;
        }

        .splash__name {
          font-size: 20px;
          font-weight: 700;
        }

        .splash .state {
          min-height: 0;
        }

        .gate {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          min-height: 100%;
          padding: 32px 20px;
          background: linear-gradient(180deg, var(--viewport-top), var(--bg));
        }

        .gate__card {
          display: grid;
          justify-items: center;
          gap: 14px;
          width: 100%;
          max-width: 420px;
          padding: 32px 24px;
          border: 1px solid var(--border);
          border-radius: 12px;
          background: var(--surface-1);
          box-shadow: var(--shadow);
          text-align: center;
        }

        .gate__title {
          font-size: 21px;
          line-height: 1.25;
        }

        .gate__text,
        .gate__hint {
          color: var(--text-2);
        }

        .gate__action {
          width: 100%;
          text-decoration: none;
        }

        .gate__footer {
          color: var(--text-3);
          font-size: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
          }
        }
      }
    </style>

      const CUBE_FACES = [

      function cubeTransform(camera) {
        const e = camera.matrixWorldInverse.elements;
        const s = [1, -1, 1];
        const m = (i, j) => (s[i] ?? 1) * (e[j * 4 + i] ?? 0) * (s[j] ?? 1);
        return `matrix3d(${m(0, 0)},${m(1, 0)},${m(2, 0)},0,${m(0, 1)},${m(1, 1)},${m(2, 1)},0,${m(0, 2)},${m(1, 2)},${m(2, 2)},0,0,0,0,1)`;
      }

      async function loadViewer() {

      function FallbackView({ layout, theme, error, onRetry }) {
        const host = useRef(null);
        const canvas = useRef(null);
        useEffect(() => {
          const el = host.current;
          const c = canvas.current;
          if (!el || !c) return undefined;
          const draw = () => {
            const width = el.clientWidth;
            const height = el.clientHeight;
            const ctx = c.getContext("2d");
            if (!ctx || !width || !height) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            c.width = Math.round(width * dpr);
            c.height = Math.round(height * dpr);
            c.style.width = `${width}px`;
            c.style.height = `${height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawAxonometric(ctx, layout, width, height, { background: null, ink: theme === "dark" ? "#e8ecef" : "#1d242b" });
          };
          draw();
          const observer = new ResizeObserver(draw);
          observer.observe(el);
          return () => observer.disconnect();
        }, [layout, theme]);
        return html`<div className="viewer viewer--fallback">
          <div ref=${host} className="viewer__stage">
            <canvas ref=${canvas} role="img" aria-label="Аксонометрия сборки" />
          </div>
          <div className="viewer-banner" role="alert">
            <${Icon} name="triangle-alert" size=${18} />
            <span>
              <b>${error.message}</b>

            ${error.retryable && html`<${Button} size="sm" variant="secondary" icon="rotate-ccw" onClick=${onRetry}>Повторить<//>`}

      function shareMode(file) {
        try {
          return navigator.canShare?.({ files: [file] }) ? "share" : "save";
        } catch {
          return "save";
        }
      }
      function save(file) {
        const url = URL.createObjectURL(file);
        const link = Object.assign(document.createElement("a"), { href: url, download: file.name });
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
        return "Файл сохранён в папку «Загрузки»";
      }
      async function shareFile(file) {
        if (shareMode(file) === "save") return save(file);
        try {
          await navigator.share({ files: [file], title: file.name });
          return "Файл передан";
        } catch (error) {
          if (error instanceof DOMException && error.name === "AbortError") return "Отменено";
          if (error instanceof DOMException && error.name === "NotAllowedError") return save(file);
          throw new AppError("Не удалось открыть меню «Поделиться»", "share");
        }
      }

      const TEXT_SCALE = { s: 0.85, m: 1, l: 1.2 };
      function edgeLookup(materials) {
        const map = new Map(materials.map((m) => [m.id, m]));
        return (ref) => ref ? map.get(ref) ?? null : null;
      }
      function drawEdgeLabel(ctx, edge, x, y, length, vertical, k) {
        if (length < 26 * k) return;
        ctx.save();
        setFont(ctx, 7.4 * k, 700);
        ctx.fillStyle = textOn(edge.color);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.translate(x, y);
        if (vertical) ctx.rotate(-Math.PI / 2);
        const label = edgeShort(edge.thickness);
        const gap = Math.max(60 * k, length / 3);
        const count = clamp(Math.floor(length / gap), 1, 4);
        for (let i = 0; i < count; i += 1) ctx.fillText(label, (i - (count - 1) / 2) * gap, 0.4 * k);
        ctx.restore();
      }
      function drawSheet(ctx, options) {
        const { sheet, job, palette, display, view, selected = -1, compact = false, k = 1, maxLabel = 15, textScale = 1 } = options;
        const edgeOf = edgeLookup(job.edgeMaterials);
        const s = view.scale;
        const toX = (v) => view.x + v * s;
        const toY = (v) => view.y + v * s;
        const W = sheet.w * s;
        const H = sheet.h * s;
        ctx.save();
        ctx.lineJoin = "miter";
        ctx.fillStyle = palette.sheet;
        ctx.fillRect(toX(0), toY(0), W, H);
        const inner = { x: toX(sheet.trim), y: toY(sheet.trim), w: (sheet.w - 2 * sheet.trim) * s, h: (sheet.h - 2 * sheet.trim) * s };
        if (!compact && display.hatch) {
          ctx.fillStyle = hatchPattern(ctx, palette.hatch, Math.round(9 * k));
          ctx.fillRect(inner.x, inner.y, inner.w, inner.h);
        }
        if (!compact && sheet.trim > 0) {
          ctx.save();
          ctx.setLineDash([6 * k, 4 * k]);
          ctx.strokeStyle = palette.trim;
          ctx.lineWidth = Math.max(1, k);
          ctx.strokeRect(inner.x, inner.y, inner.w, inner.h);
          ctx.restore();
        }
        for (const d of sheet.defects) {
          const x = toX(d.x);
          const y = toY(d.y);
          const w = d.w * s;
          const h = d.h * s;
          ctx.save();
          ctx.fillStyle = palette.defect;
          ctx.globalAlpha = 0.16;
          ctx.fillRect(x, y, w, h);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = palette.defect;
          ctx.lineWidth = Math.max(1, 1.4 * k);
          ctx.strokeRect(x, y, w, h);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + w, y + h);
          ctx.moveTo(x + w, y);
          ctx.lineTo(x, y + h);
          ctx.stroke();
          ctx.restore();
        }
        if (!compact && display.waste) {
          for (const w of sheet.waste) {
            const pw = w.w * s;
            const ph = w.h * s;
            if (Math.min(pw, ph) < 30 * k) continue;
            const label = `${fmt(w.w)}×${fmt(w.h)}`;
            const size = fitFont(ctx, label, Math.min(ph * 0.3, 13 * k * textScale), pw * 0.86, 500);
            if (size < 7 * k) continue;
            setFont(ctx, size, 500, "italic");
            ctx.fillStyle = palette.waste;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, toX(w.x) + pw / 2, toY(w.y) + ph / 2);
          }
        }
        sheet.placed.forEach((p, index) => {
          const part = job.parts[p.pi];
          if (!part) return;
          const hue = hueOf(part.no - 1);
          const x = toX(p.x);
          const y = toY(p.y);
          const w = p.w * s;
          const h = p.h * s;
          ctx.fillStyle = palette.fill(hue);
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = palette.stroke(hue);
          ctx.lineWidth = compact ? 0.75 : Math.max(1, k);
          ctx.strokeRect(x, y, w, h);
          let wt = 0;
          let wl = 0;
          let wr = 0;
          if (display.edges && part.edges.some(Boolean)) {
            const [e0, e1, e2, e3] = part.edges.map(edgeOf);
            const sides = p.r ? { right: e0, left: e1, top: e2, bottom: e3 } : { top: e0, bottom: e1, left: e2, right: e3 };
            const width = (edge) => !edge ? 0 : compact ? 1.2 : display.edgeLabels ? 9 * k : clamp(edge.thickness * 2, 1.6, 4.5) * k;
            const line = (edge, x1, y1, x2, y2) => {
              if (!edge) return;
              ctx.strokeStyle = edge.color;
              ctx.lineWidth = width(edge);
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            };
            wt = width(sides.top);
            const wb = width(sides.bottom);
            wl = width(sides.left);
            wr = width(sides.right);
            line(sides.top, x, y + wt / 2, x + w, y + wt / 2);
            line(sides.bottom, x, y + h - wb / 2, x + w, y + h - wb / 2);
            line(sides.left, x + wl / 2, y, x + wl / 2, y + h);
            line(sides.right, x + w - wr / 2, y, x + w - wr / 2, y + h);
            if (display.edgeLabels && !compact) {
              if (sides.top) drawEdgeLabel(ctx, sides.top, x + w / 2, y + wt / 2, w, false, k);

      function hitTestSchematic(part, view, px, py) {
        const s = view.scale;
        const X = (x) => view.x + x * s;
        const Y = (y) => view.y + (part.W - y) * s;
        let best = null;
        for (const hole of part.holes) {
          const dist = Math.hypot(px - X(hole.x), py - Y(hole.y));
          if (dist <= Math.max(holeRadius(hole, s, 1), 22) && (!best || dist < best.dist)) best = { id: hole.id, dist };
        }
        if (best) return { kind: "hole", id: best.id };
        const pad = 10;
        for (const op of [...part.operations].reverse()) {
          let rect = null;
          if (op.type === "radius" || op.type === "chamfer") {
            const ax = op.anchor % 3 === 0 ? 0 : part.L;
            const ay = op.anchor < 3 ? part.W : 0;
            if (Math.hypot(px - X(ax), py - Y(ay)) <= Math.max(op.r * s, 26)) return { kind: "op", id: op.id };
            continue;
          }
          if (op.type === "notch") rect = notchRect(op, part);
          else if (op.type === "rect" || op.type === "circle") rect = anchorRect(op, part);
          else if (op.type === "groove" || op.type === "rebate") rect = edgeBandRect(op, part);
          else {
            const { from, to } = edgeGrooveSpan(op, part);

          if (px >= X(rect.x) - pad && px <= X(rect.x + rect.w) + pad && py >= Y(rect.y + rect.h) - pad && py <= Y(rect.y) + pad) {

      const SCHEMATIC_PRINT = { ...PRINT, sheet: PRINT.part, background: "#ffffff", feature: "#56616c" };

      function readJpeg(bytes) {
        let i = 2;
        while (i + 9 < bytes.length) {
          if (bytes[i] !== 255) {
            i += 1;
            continue;
          }
          const marker = bytes[i + 1] ?? 0;
          const length = (bytes[i + 2] ?? 0) << 8 | (bytes[i + 3] ?? 0);
          if (marker >= 192 && marker <= 207 && marker !== 196 && marker !== 200 && marker !== 204) {
            return {
              bytes,
              height: (bytes[i + 5] ?? 0) << 8 | (bytes[i + 6] ?? 0),
              width: (bytes[i + 7] ?? 0) << 8 | (bytes[i + 8] ?? 0),
              components: bytes[i + 9] ?? 3
            };
          }
          i += 2 + length;
        }

      }

      async function pagesToPdf(pages, title) {
        const images = await Promise.all(pages.map(async (blob) => readJpeg(new Uint8Array(await blob.arrayBuffer()))));
        const encoder = new TextEncoder();
        const chunks = [];
        const offsets = [];
        let size = 0;
        const push = (part) => {
          const bytes = typeof part === "string" ? encoder.encode(part) : part;
          chunks.push(bytes);
          size += bytes.length;
        };
        const object = (id, body, stream) => {
          offsets[id] = size;
          push(`${id} 0 obj
      ${body}
      `);
          if (stream) {
            push("stream\n");
            push(stream);
            push("\nendstream\n");
          }
          push("endobj\n");
        };
        const [W, H] = A4.points;
        const pageIds = images.map((_, i) => 4 + i * 3);
        push("%PDF-1.7\n%âãÏÓ\n");
        object(1, "<< /Type /Catalog /Pages 2 0 R >>");
        object(2, `<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${images.length} >>`);
        const now = pdfDate(new Date());
        object(3, `<< /Title ${pdfText(title)} /Author ${pdfText("fBuild")} /Creator ${pdfText("fBuild")} /Producer ${pdfText("fBuild")} /CreationDate ${now} /ModDate ${now} >>`);
        images.forEach((image, i) => {
          const page = 4 + i * 3;
          const color = image.components === 1 ? "/DeviceGray" : image.components === 4 ? "/DeviceCMYK" : "/DeviceRGB";
          const content = encoder.encode(`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`);
          object(page, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${page + 1} 0 R >> >> /Contents ${page + 2} 0 R >>`);
          object(page + 1, `<< /Type /XObject /Subtype /Image /Width ${image.width} /Height ${image.height} /ColorSpace ${color} /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.bytes.length} >>`, image.bytes);
          object(page + 2, `<< /Length ${content.length} >>`, content);
        });
        const count = 4 + images.length * 3;
        const xref = size;
        push(`xref
      0 ${count}
      0000000000 65535 f 
      ${offsets.slice(1, count).map((o) => `${String(o).padStart(10, "0")} 00000 n 
      `).join("")}`);
        push(`trailer
      << /Size ${count} /Root 1 0 R /Info 3 0 R >>
      startxref
      ${xref}
      %%EOF
      `);
        return new Blob(chunks, { type: "application/pdf" });
      }
