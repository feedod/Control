          await call("setItem", key, `chunks:${parts}`);
          if (previous > parts) {
            const stale = Array.from({ length: previous - parts }, (_, i) => `${key}_${parts + i}`);
            await call("removeItems", stale).catch(() => void 0);
          }
        }
        async function remove(key) {
          if (!cloud) {
            try {
              localStorage.removeItem(localKey(key));
            } catch {
              return;
            }
            return;
          }
          const count = chunkCount(await call("getItem", key).catch(() => ""));
          const keys = [key, ...Array.from({ length: count }, (_, i) => `${key}_${i}`)];
          await call("removeItems", keys);
        }
        const enqueue = (task) => {
          const run = queue.then(task);
          queue = run.catch(() => void 0);
          return run;
        };
        return {
          cloud: Boolean(cloud),
          read: (key) => enqueue(() => read(key)),
          write: (key, value) => enqueue(() => write(key, value)),
          remove: (key) => enqueue(() => remove(key)),
        };
      }

      const storage = createStorage();
      const INDEX_KEY = "index";
      const SETTINGS_KEY = "settings";
      const projectKey = (id) => `project_${id}`;
      async function readJson(key, schema) {
        try {
          const raw = await storage.read(key);
          if (!raw) return null;
          return schema.parse(JSON.parse(raw));
        } catch {
          return null;
        }
      }

      async function readProject(id) {
        try {
          const raw = await storage.read(projectKey(id));
          return raw ? normalizeProject(JSON.parse(raw)) : null;
        } catch {
          return null;
        }
      }

      function createSolver() {
        const source = `const solve = (${packerModule.toString()})().solve;
self.onmessage = (event) => {
  try {
    self.postMessage({ id: event.data.id, ok: true, result: solve(event.data.job) });
  } catch (error) {
    self.postMessage({ id: event.data.id, ok: false, error: String((error && error.message) || error) });
  }
};`;
        let workerUrl = null;
        let worker = null;
        let active = null;
        let sequence = 0;
        let local = null;
        const abort = () => {
          const error = new Error("Расчёт отменён");
          error.name = "AbortError";
          return error;
        };
        const settle = (message) => {
          if (!active || message.id !== active.id) return;
          const { resolve, reject } = active;
          active = null;
          if (message.ok) resolve(message.result);
          else reject(new Error(message.error));
        };
        const spawn = () => {
          workerUrl ??= URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
          worker = new Worker(workerUrl);
          worker.onmessage = (event) => settle(event.data);
          worker.onerror = (event) => {
            event.preventDefault();
            if (active)
              settle({ id: active.id, ok: false, error: event.message || "Ошибка расчёта" });
            worker?.terminate();
            worker = null;
          };
        };
        return {
          solve(job) {
            if (active) {
              active.reject(abort());
              active = null;
              worker?.terminate();
              worker = null;
            }
            return new Promise((resolve, reject) => {
              const id = ++sequence;
              active = { id, resolve, reject };
              try {
                if (!worker) spawn();
                worker.postMessage({ id, job });
              } catch {
                setTimeout(() => {
                  try {
                    local ??= packerModule();
                    settle({ id, ok: true, result: local.solve(job) });
                  } catch (error) {
                    settle({ id, ok: false, error: error.message });
                  }
                }, 0);
              }
            });
          },
        };
      }

      const solver = createSolver();
      function buildJob(project) {
        const { material, cut, parts, offcuts, defects } = project;
        const items = [];
        const positions = bomPositions(parts);
        parts.forEach((part) => {
          if (!(part.L > 0 && part.W > 0 && part.qty > 0)) return;
          const cutL = cut.edgeSubtract
            ? part.L - edgeThickness(part.edges[2]) - edgeThickness(part.edges[3])
            : part.L;
          const cutW = cut.edgeSubtract
            ? part.W - edgeThickness(part.edges[0]) - edgeThickness(part.edges[1])
            : part.W;
          if (cutL <= 0 || cutW <= 0) return;
          items.push({
            id: part.id,
            no: positions.get(part.id),
            name: part.name,
            L: part.L,
            W: part.W,
            cutL: round(cutL, 2),
            cutW: round(cutW, 2),
            qty: part.qty,
            edges: [...part.edges],
            rot: !material.grain || !part.grain,
          });
        });
        const pieces = items.reduce((t, p) => t + p.qty, 0);
        const base = { parts: items, pieces, material: { ...material }, cut: { ...cut } };
        if (!items.length) return { ...base, key: "", reason: "empty" };
        if (pieces > CONFIG.limits.pieces) return { ...base, key: "", reason: "too-many" };
        if (material.L - 2 * cut.trim <= 0 || material.W - 2 * cut.trim <= 0)
          return { ...base, key: "", reason: "trim" };
        const payload = {
          sheet: { w: material.L, h: material.W },
          kerf: cut.kerf,
          trim: cut.trim,
          mode: cut.mode,
          parts: items.map((p) => ({ w: p.cutL, h: p.cutW, qty: p.qty, rot: p.rot })),
          offcuts: offcuts.enabled
            ? offcuts.items
                .filter((o) => o.L > 0 && o.W > 0 && o.qty > 0)
                .map((o) => ({ w: o.L, h: o.W, qty: o.qty }))
            : [],
          defects: defects.enabled
            ? defects.items
                .filter((d) => d.L > 0 && d.W > 0)
                .map((d) => ({ sheet: d.sheet, x: d.x, y: d.y, w: d.L, h: d.W }))
            : [],
        };
        return { ...base, payload, key: JSON.stringify(payload), reason: null };
      }

      function summarize(result, job, project) {
        let sheetCount = 0;
        let offcutCount = 0;
        let sheetArea = 0;
        let offcutArea = 0;
        let partsArea = 0;
        let cutLength = 0;
        let placed = 0;
        const edges = [0, 0, 0, 0];
        const business = [];
        const minOffcut = job.cut.minOffcut;
        for (const sheet of result.sheets) {
          const count = sheet.count;
          if (sheet.kind === "sheet") {
            sheetCount += count;
            sheetArea += sheet.w * sheet.h * count;
          } else {
            offcutCount += count;
            offcutArea += sheet.w * sheet.h * count;
          }
          partsArea += sheet.used * count;
          cutLength += sheet.cut * count;
          placed += sheet.placed.length * count;
          for (const p of sheet.placed) {
            const part = job.parts[p.pi];
            part.edges.forEach((code, side) => {
              if (code) edges[code] += (side < 2 ? part.L : part.W) * count;
            });
          }
          for (const w of sheet.waste) {
            if (w.w >= minOffcut && w.h >= minOffcut) {
              business.push({
                label: sheetLabel(sheet),
                w: Math.max(w.w, w.h),
                h: Math.min(w.w, w.h),
                count,
              });
            }
          }
        }
        business.sort((a, b) => b.w * b.h - a.w * a.h);
        const stockArea = sheetArea + offcutArea;
        const unplaced = result.unplaced.reduce((t, u) => t + u.count, 0);
        const costs = {
          material: sheetCount * project.material.price,
          cutting: (cutLength / 1e3) * project.prices.cut,
          edges: [1, 2, 3].map((code) => (edges[code] / 1e3) * project.prices.edges[code - 1]),
        };
        costs.total = costs.material + costs.cutting + costs.edges.reduce((t, v) => t + v, 0);
        return {
          sheetCount,
          offcutCount,
          sheetArea,
          partsArea,
          stockArea,
          util: stockArea ? partsArea / stockArea : 0,
          waste: stockArea - partsArea,
          cutLength,
          edges,
          edgeTotal: edges.reduce((t, v) => t + v, 0),
          placed,
          unplaced,
          business,
          costs,
        };
      }

      function sheetLabel(sheet) {
        if (sheet.kind !== "sheet") return `Остаток ${fmt(sheet.w)}×${fmt(sheet.h)}`;
        const n = sheet.numbers;
        const consecutive = n.every((value, i) => i === 0 || value === n[i - 1] + 1);
        if (n.length === 1) return `Лист ${n[0]}`;
        return consecutive ? `Листы ${n[0]}–${n[n.length - 1]}` : `Листы ${n.join(", ")}`;
      }

      function sheetParts(sheet, job) {
        const counts = new Map();
        for (const p of sheet.placed) counts.set(p.pi, (counts.get(p.pi) ?? 0) + 1);
        return [...counts]
          .map(([pi, count]) => ({ part: job.parts[pi], count }))
          .sort((a, b) => a.part.no - b.part.no);
      }

      const PALETTES = {
        dark: {
          sheet: "#2f3439",
          sheetStroke: "#8d9aa6",
          trim: "#5b6670",
          hatch: "rgba(255,255,255,0.075)",
          text: "#f3f6f8",
          muted: "#a8b3bd",
          dim: "#9aa7b3",
          waste: "#8f9ca8",
          defect: "#ff6b5f",
          accent: "#38abdf",
          fill: (hue) => `hsl(${hue} 30% 31%)`,
          stroke: (hue) => `hsl(${hue} 50% 66%)`,
        },
        light: {
          sheet: "#ffffff",
          sheetStroke: "#6f7c87",
          trim: "#aab4bd",
          hatch: "rgba(30,45,60,0.09)",
          text: "#1d242b",
          muted: "#5d6872",
          dim: "#5d6872",
          waste: "#7a8691",
          defect: "#e5483f",
          accent: "#0696d7",
          fill: (hue) => `hsl(${hue} 58% 89%)`,
          stroke: (hue) => `hsl(${hue} 36% 42%)`,
        },
      };

      const hatchCache = new Map();
      function hatchPattern(ctx, color, size) {
        const key = `${color}:${size}`;
        if (!hatchCache.has(key)) {
          const tile = document.createElement("canvas");
          tile.width = size;
          tile.height = size;
          const g = tile.getContext("2d");
          g.strokeStyle = color;
          g.lineWidth = Math.max(1, size / 8);
          g.beginPath();
          g.moveTo(0, size);
          g.lineTo(size, 0);
          g.moveTo(-size / 2, size / 2);
          g.lineTo(size / 2, -size / 2);
          g.moveTo(size / 2, size * 1.5);
          g.lineTo(size * 1.5, size / 2);
          g.stroke();
          hatchCache.set(key, tile);
        }
        return ctx.createPattern(hatchCache.get(key), "repeat");
      }

      function setFont(ctx, size, weight = 500, style = "normal") {
        ctx.font = `${style} ${weight} ${size}px ${FONT}`;
      }

      function fitFont(ctx, label, size, maxWidth, weight) {
        setFont(ctx, size, weight);
        const width = ctx.measureText(label).width;
        return width > maxWidth ? (size * maxWidth) / width : size;
      }

      function drawDimension(ctx, { x1, y1, x2, y2, label, offset, palette, k, vertical }) {
        ctx.save();
        ctx.strokeStyle = palette.dim;
        ctx.fillStyle = palette.dim;
        ctx.lineWidth = Math.max(1, k);
        const tick = 4 * k;
        ctx.beginPath();
        if (vertical) {
          const x = x1 - offset;
          ctx.moveTo(x1 - 3 * k, y1);
          ctx.lineTo(x - tick, y1);
          ctx.moveTo(x1 - 3 * k, y2);
          ctx.lineTo(x - tick, y2);
          ctx.moveTo(x, y1);
          ctx.lineTo(x, y2);
          ctx.moveTo(x - tick, y1 + tick);
          ctx.lineTo(x + tick, y1 - tick);
          ctx.moveTo(x - tick, y2 + tick);
          ctx.lineTo(x + tick, y2 - tick);
        } else {
          const y = y1 - offset;
          ctx.moveTo(x1, y1 - 3 * k);
          ctx.lineTo(x1, y - tick);
          ctx.moveTo(x2, y1 - 3 * k);
          ctx.lineTo(x2, y - tick);
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.moveTo(x1 - tick, y + tick);
          ctx.lineTo(x1 + tick, y - tick);
          ctx.moveTo(x2 - tick, y + tick);
          ctx.lineTo(x2 + tick, y - tick);
        }
        ctx.stroke();
        const size = 11.5 * k;
        setFont(ctx, size, 600);
        const width = ctx.measureText(label).width + 10 * k;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (vertical) {
          ctx.translate(x1 - offset, (y1 + y2) / 2);
          ctx.rotate(-Math.PI / 2);
        } else {
          ctx.translate((x1 + x2) / 2, y1 - offset);
        }
        if (palette.background) {
          ctx.fillStyle = palette.background;
          ctx.fillRect(-width / 2, -size * 0.75, width, size * 1.5);
        }
        ctx.fillStyle = palette.dim;
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }

      function drawSheet(ctx, options) {
        const {
          sheet,
          job,
          palette,
          display,
          view,
          selected = -1,
          compact = false,
          k = 1,
          maxLabel = 15,
          textScale = 1,
        } = options;
        const s = view.scale;
        const X = (v) => view.x + v * s;
        const Y = (v) => view.y + v * s;
        const W = sheet.w * s;
        const H = sheet.h * s;
        ctx.save();
        ctx.lineJoin = "miter";
        ctx.fillStyle = palette.sheet;
        ctx.fillRect(X(0), Y(0), W, H);
        if (!compact && display.hatch) {
          ctx.fillStyle = hatchPattern(ctx, palette.hatch, Math.round(9 * k));
          ctx.fillRect(
            X(sheet.trim),
            Y(sheet.trim),
            (sheet.w - 2 * sheet.trim) * s,
            (sheet.h - 2 * sheet.trim) * s,
          );
        }
        if (!compact && sheet.trim > 0) {
          ctx.save();
          ctx.setLineDash([6 * k, 4 * k]);
          ctx.strokeStyle = palette.trim;
          ctx.lineWidth = Math.max(1, k);
          ctx.strokeRect(
            X(sheet.trim),
            Y(sheet.trim),
            (sheet.w - 2 * sheet.trim) * s,
            (sheet.h - 2 * sheet.trim) * s,
          );
          ctx.restore();
        }
        for (const d of sheet.defects) {
          const x = X(d.x);
          const y = Y(d.y);
          const w = d.w * s;
          const h = d.h * s;
          ctx.save();
          ctx.fillStyle = palette.defect;
          ctx.globalAlpha = 0.16;
          ctx.fillRect(x, y, w, h);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = palette.defect;
          ctx.lineWidth = Math.max(1, 1.4 * k);
          ctx.strokeRect(x, y, w, h);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + w, y + h);
          ctx.moveTo(x + w, y);
          ctx.lineTo(x, y + h);
          ctx.stroke();
          ctx.restore();
        }
        if (!compact && display.waste) {
          for (const w of sheet.waste) {
            const pw = w.w * s;
            const ph = w.h * s;
            if (Math.min(pw, ph) < 30 * k) continue;
            const label = `${fmt(w.w)}×${fmt(w.h)}`;
            const size = fitFont(
              ctx,
              label,
              Math.min(ph * 0.3, 13 * k * textScale),
              pw * 0.86,
              500,
            );
            if (size < 7 * k) continue;
            setFont(ctx, size, 500, "italic");
            ctx.fillStyle = palette.waste;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, X(w.x) + pw / 2, Y(w.y) + ph / 2);
          }
        }
        sheet.placed.forEach((p, index) => {
          const part = job.parts[p.pi];
          const hue = hueOf(part.no - 1);
          const x = X(p.x);
          const y = Y(p.y);
          const w = p.w * s;
          const h = p.h * s;
          ctx.fillStyle = palette.fill(hue);
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = palette.stroke(hue);
          ctx.lineWidth = compact ? 0.75 : Math.max(1, k);
          ctx.strokeRect(x, y, w, h);
          if (display.edges && part.edges.some(Boolean)) {
            const e = part.edges;
            const sides = p.r
              ? { right: e[0], left: e[1], top: e[2], bottom: e[3] }
              : { top: e[0], bottom: e[1], left: e[2], right: e[3] };
            const width = (code) =>
              compact ? 1.2 : display.edgeLabels ? 9 * k : [0, 2, 3, 4.5][code] * k;
            const line = (code, x1, y1, x2, y2) => {
              if (!code) return;
              ctx.strokeStyle = EDGE_TYPES[code].color;
              ctx.lineWidth = width(code);
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            };
            line(sides.top, x, y + width(sides.top) / 2, x + w, y + width(sides.top) / 2);
            line(
              sides.bottom,
              x,
              y + h - width(sides.bottom) / 2,
              x + w,
              y + h - width(sides.bottom) / 2,
            );
            line(sides.left, x + width(sides.left) / 2, y, x + width(sides.left) / 2, y + h);
            line(
              sides.right,
              x + w - width(sides.right) / 2,
              y,
              x + w - width(sides.right) / 2,
              y + h,
            );
            // Для пильщика: толщина кромки цифрами прямо на цветной полосе.
            if (display.edgeLabels && !compact) {
              drawEdgeLabel(ctx, sides.top, x + w / 2, y + width(sides.top) / 2, w, false, k);
              drawEdgeLabel(ctx, sides.bottom, x + w / 2, y + h - width(sides.bottom) / 2, w, false, k);
              drawEdgeLabel(ctx, sides.left, x + width(sides.left) / 2, y + h / 2, h, true, k);
              drawEdgeLabel(ctx, sides.right, x + w - width(sides.right) / 2, y + h / 2, h, true, k);
            }
          }
          if (index === selected) {
            ctx.save();
            ctx.strokeStyle = palette.accent;
            ctx.lineWidth = 2.5 * k;
            ctx.shadowColor = palette.accent;
            ctx.shadowBlur = 10 * k;
            ctx.strokeRect(x + 1.25 * k, y + 1.25 * k, w - 2.5 * k, h - 2.5 * k);
            ctx.restore();
          }
          if (compact) return;
          const minSide = Math.min(w, h);
          if (minSide < 12 * k) return;
          const vertical = h > w * 1.35;
          const boxW = vertical ? h : w;
          const boxH = vertical ? w : h;
          const lines = [];
          if (display.names && part.name)
            lines.push({ label: part.name, weight: 500, ratio: 0.82 });
          if (display.sizes)
            lines.push({ label: `${fmt(part.L, 1)} × ${fmt(part.W, 1)}`, weight: 600, ratio: 1 });
          const base = Math.min(boxH * 0.26, maxLabel * k) * textScale;
          for (const l of lines)
            l.size = fitFont(ctx, l.label, base * l.ratio, boxW * 0.84, l.weight);
          const total = lines.reduce((t, l) => t + l.size * 1.28, 0);
          const shrink = total > boxH * 0.8 ? (boxH * 0.8) / total : 1;
          ctx.save();
          ctx.translate(x + w / 2, y + h / 2);
          if (vertical) ctx.rotate(-Math.PI / 2);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = palette.text;
          let cursor = -(total * shrink) / 2;
          for (const l of lines) {
            const size = l.size * shrink;
            if (size >= 6.5 * k) {
              setFont(ctx, size, l.weight);
              ctx.fillText(l.label, 0, cursor + (size * 1.28) / 2);
            }
            cursor += size * 1.28;
          }
          ctx.restore();
          const badge = clamp(minSide * 0.17, 8 * k, 12 * k) * textScale;
          if (minSide >= 24 * k) {
            ctx.textBaseline = "top";
            if (display.numbers) {
              setFont(ctx, badge, 700);
              ctx.fillStyle = palette.muted;
              ctx.textAlign = "left";
              ctx.fillText(String(part.no), x + 4 * k, y + 4 * k);
            }
            if (p.r) {
              setFont(ctx, badge, 700);
              ctx.fillStyle = palette.accent;
              ctx.textAlign = "right";
              ctx.fillText("R", x + w - 4 * k, y + 4 * k);
            }
          }
        });
        ctx.strokeStyle = palette.sheetStroke;
        ctx.lineWidth = compact ? 1 : Math.max(1, 1.5 * k);
        ctx.strokeRect(X(0), Y(0), W, H);
        if (!compact && display.dims) {
          drawDimension(ctx, {
            x1: X(0),
            y1: Y(0),
            x2: X(sheet.w),
            y2: Y(0),
            label: fmt(sheet.w, 1),
            offset: 16 * k,
            palette,
            k,
          });
          drawDimension(ctx, {
            x1: X(0),
            y1: Y(0),
            x2: X(0),
            y2: Y(sheet.h),
            label: fmt(sheet.h, 1),
            offset: 16 * k,
            palette,
            k,
            vertical: true,
          });
        }
        ctx.restore();
      }

      // ─────────────────────────────────────────────────────────────────────
      // Мини-схема детали: контур, кромка, вырезы, отверстия (экран и PDF)
      // ─────────────────────────────────────────────────────────────────────

      const SCHEMATIC_VOID = { dark: "#1f2226", light: "#e3e7eb" };

      /** Палитра схемы на экране: вырезы окрашены в цвет фона — «дырки» в детали. */
      function schematicPalette(theme) {
        const base = PALETTES[theme] ?? PALETTES.dark;
        return { ...base, background: SCHEMATIC_VOID[theme] ?? SCHEMATIC_VOID.dark };
      }

      /** Палитра схемы для печати: белая бумага, светлая деталь, белые вырезы. */
      const SCHEMATIC_PRINT = {
        ...PALETTES.light,
        sheet: "#eef1f4",
        background: "#ffffff",
        text: "#1d242b",
      };

      /** Масштаб и смещение, чтобы деталь целиком помещалась в область с полями под размеры. */
      function fitSchematic(part, width, height, pad) {
        const L = Math.max(part.L, 1);
        const W = Math.max(part.W, 1);
        const scale = Math.max(0.0001, Math.min((width - pad * 2) / L, (height - pad * 2) / W));
        return {
          scale,
          x: (width - L * scale) / 2 + pad * 0.25,
          y: (height - W * scale) / 2 + pad * 0.15,
        };
      }

      /** Экранный радиус отверстия: не меньше минимального, чтобы точка была видна. */
      function holeRadius(hole, scale, k) {
        return Math.max((hole.d / 2) * scale, 2.6 * k);
      }

      /** Направление «внутрь детали» для торцевого отверстия в экранных координатах (Y вниз). */
      function inwardVector(side) {
        return { e0: [0, 1], e1: [0, -1], e2: [1, 0], e3: [-1, 0] }[side] ?? [0, 0];
      }

      /** Путь контура детали с радиусами и фасками по углам. */
      function tracePartOutline(ctx, part, X, Y) {
        const corners = cornerProfile(part);
        const s = Math.abs(X(1) - X(0));
        const pts = [
          [X(0), Y(part.W)],
          [X(part.L), Y(part.W)],
          [X(part.L), Y(0)],
          [X(0), Y(0)],
        ];
        ctx.beginPath();
        ctx.moveTo((pts[0][0] + pts[1][0]) / 2, pts[0][1]);
        for (let step = 1; step <= 4; step += 1) {
          const i = step % 4;
          const [cx0, cy0] = pts[i];
          const [nx, ny] = pts[(i + 1) % 4];
          const [px, py] = pts[(i + 3) % 4];
          const corner = corners[i];
          const r = corner ? Math.min(corner.r * s, Math.min(part.L, part.W) * s * 0.5) : 0;
          if (!r) {
            ctx.lineTo(cx0, cy0);
          } else if (corner.type === "radius") {
            ctx.arcTo(cx0, cy0, nx, ny, r);
          } else {
            const inLen = Math.hypot(cx0 - px, cy0 - py) || 1;
            const outLen = Math.hypot(nx - cx0, ny - cy0) || 1;
            ctx.lineTo(cx0 - ((cx0 - px) / inLen) * r, cy0 - ((cy0 - py) / inLen) * r);
            ctx.lineTo(cx0 + ((nx - cx0) / outLen) * r, cy0 + ((ny - cy0) / outLen) * r);
          }
        }
        ctx.closePath();
      }

      /**
       * Отрисовка мини-схемы детали.
       * view: { x, y, scale } — левый верхний угол детали на холсте и масштаб.
       */
      function drawPartSchematic(ctx, options) {
        const { part, view, palette, k = 1, selectedId, numbers, dims = true, origin = true } = options;
        if (!(part.L > 0 && part.W > 0)) return;
        const s = view.scale;
        const X = (x) => view.x + x * s;
        const Y = (y) => view.y + (part.W - y) * s;
        ctx.save();

        // Тело детали.
        tracePartOutline(ctx, part, X, Y);
        ctx.fillStyle = palette.sheet;
        ctx.fill();

        // Кромка — цветные полосы по сторонам, обрезанные контуром.
        ctx.save();
        tracePartOutline(ctx, part, X, Y);
        ctx.clip();
        const band = Math.max(3 * k, Math.min(6 * k, Math.min(part.L, part.W) * s * 0.08));
        const sides = [
          [X(0), Y(part.W), part.L * s, band],
          [X(0), Y(0) - band, part.L * s, band],
          [X(0), Y(part.W), band, part.W * s],
          [X(part.L) - band, Y(part.W), band, part.W * s],
        ];
        part.edges.forEach((code, i) => {
          if (!code) return;
          ctx.fillStyle = EDGE_TYPES[code].color;
          ctx.fillRect(...sides[i]);
        });
        ctx.restore();

        tracePartOutline(ctx, part, X, Y);
        ctx.strokeStyle = palette.sheetStroke;
        ctx.lineWidth = Math.max(1, 1.2 * k);
        ctx.stroke();

        // Вырезы: заливка цветом фона — выглядят как сквозные «дырки».
        for (const mod of part.modifiers ?? []) {
          if (isCornerModifier(mod.type)) continue;
          const r = modifierRect(mod, part);
          ctx.beginPath();
          if (mod.type === "circle") {
            ctx.arc(X(r.x + r.w / 2), Y(r.y + r.h / 2), (r.w / 2) * s, 0, Math.PI * 2);
          } else {
            const radius = clamp(mod.r * s, 0, (Math.min(r.w, r.h) * s) / 2);
            ctx.roundRect(X(r.x), Y(r.y + r.h), r.w * s, r.h * s, radius);
          }
          ctx.fillStyle = palette.background;
          ctx.fill();
          ctx.setLineDash(mod.id === selectedId ? [] : [4 * k, 3 * k]);
          ctx.strokeStyle = mod.id === selectedId ? palette.accent : palette.sheetStroke;
          ctx.lineWidth = Math.max(1, (mod.id === selectedId ? 2 : 1) * k);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Отверстия. Подписи номеров не должны перекрываться — занятые места запоминаем.
        const labels = [];
        (part.holes ?? []).forEach((hole, index) => {
          const color = holeType(hole.type).color;
          const cx0 = X(hole.x);
          const cy0 = Y(hole.y);
          const r = holeRadius(hole, s, k);
          const face = hole.side === "A" || hole.side === "B";
          if (!face) {
            // Торцевое отверстие: «скрытые линии» на глубину сверления.
            const [ix, iy] = inwardVector(hole.side);
            const depth = hole.depth * s;
            const half = Math.max((hole.d / 2) * s, 1.4 * k);
            ctx.setLineDash([3 * k, 2.5 * k]);
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(1, k);
            ctx.beginPath();
            ctx.moveTo(cx0 - iy * half, cy0 - ix * half);
            ctx.lineTo(cx0 - iy * half + ix * depth, cy0 - ix * half + iy * depth);
            ctx.moveTo(cx0 + iy * half, cy0 + ix * half);
            ctx.lineTo(cx0 + iy * half + ix * depth, cy0 + ix * half + iy * depth);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx0 - iy * r - ix * r * 0.2, cy0 - ix * r - iy * r * 0.2);
            ctx.lineTo(cx0 + ix * r * 1.2, cy0 + iy * r * 1.2);
            ctx.lineTo(cx0 + iy * r - ix * r * 0.2, cy0 + ix * r - iy * r * 0.2);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(cx0, cy0, r, 0, Math.PI * 2);
            if (hole.side === "A") {
              ctx.fillStyle = color;
              ctx.fill();
              ctx.strokeStyle = palette.background;
              ctx.lineWidth = Math.max(1, 0.8 * k);
              ctx.stroke();
            } else {
              // Обратная пласть — кольцо с крестом, как невидимое отверстие на чертеже.
              ctx.setLineDash([2.5 * k, 2 * k]);
              ctx.strokeStyle = color;
              ctx.lineWidth = Math.max(1, 1.4 * k);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.beginPath();
              ctx.moveTo(cx0 - r * 0.6, cy0);
              ctx.lineTo(cx0 + r * 0.6, cy0);
              ctx.moveTo(cx0, cy0 - r * 0.6);
              ctx.lineTo(cx0, cy0 + r * 0.6);
              ctx.stroke();
            }
          }
          if (hole.id === selectedId) {
            ctx.beginPath();
            ctx.arc(cx0, cy0, r + 4 * k, 0, Math.PI * 2);
            ctx.strokeStyle = palette.accent;
            ctx.lineWidth = 2 * k;
            ctx.stroke();
          }
          if (numbers) {
            const label = String(index + 1);
            setFont(ctx, 9.5 * k, 700);
            const tw = ctx.measureText(label).width;
            const th = 10 * k;
            // Кандидаты: справа-сверху, справа-снизу, слева-сверху, слева-снизу.
            const spots = [
              [cx0 + r + 2 * k, cy0 - r - 2 * k],
              [cx0 + r + 2 * k, cy0 + r + 2 * k],
              [cx0 - r - 2 * k - tw, cy0 - r - 2 * k],
              [cx0 - r - 2 * k - tw, cy0 + r + 2 * k],
            ];
            const free = spots.find(([sx, sy]) =>
              labels.every((b) => sx + tw < b.x || sx > b.x + b.w || sy + th / 2 < b.y - b.h / 2 || sy - th / 2 > b.y + b.h / 2),
            );
            if (free) {
              const [tx, ty] = free;
              labels.push({ x: tx, y: ty, w: tw, h: th });
              ctx.textAlign = "left";
              ctx.textBaseline = "middle";
              ctx.lineWidth = 3 * k;
              ctx.strokeStyle = palette.background;
              ctx.strokeText(label, tx, ty);
              ctx.fillStyle = palette.text;
              ctx.fillText(label, tx, ty);
            }
          }
        });

        // Начало координат — левый нижний угол (как в Базис/BazisCNC).
        if (origin) {
          const ox = X(0);
          const oy = Y(0);
          const len = 18 * k;
          ctx.strokeStyle = palette.accent;
          ctx.fillStyle = palette.accent;
          ctx.lineWidth = 1.5 * k;
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox + len, oy);
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox, oy - len);
          ctx.stroke();
          setFont(ctx, 9 * k, 700);
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          ctx.fillText("X", ox + len + 2 * k, oy);
          ctx.textAlign = "center";
          ctx.fillText("Y", ox, oy - len - 6 * k);
        }

        if (dims) {
          drawDimension(ctx, {
            x1: X(0),
            y1: Y(part.W),
            x2: X(part.L),
            y2: Y(part.W),
            label: fmt(part.L, 1),
            offset: 16 * k,
            palette,
            k,
          });
          drawDimension(ctx, {
            x1: X(0),
            y1: Y(part.W),
            x2: X(0),
            y2: Y(0),
            label: fmt(part.W, 1),
            offset: 16 * k,
            palette,
            k,
            vertical: true,
          });
        }
        ctx.restore();
      }

      /** Поиск отверстия или выреза под пальцем. Радиус захвата — не меньше 22 px. */
      function hitTestSchematic(part, view, px, py) {
        const s = view.scale;
        const X = (x) => view.x + x * s;
        const Y = (y) => view.y + (part.W - y) * s;
        let best = null;
        for (const hole of part.holes ?? []) {
          const dist = Math.hypot(px - X(hole.x), py - Y(hole.y));
          const reach = Math.max(holeRadius(hole, s, 1), 22);
          if (dist <= reach && (!best || dist < best.dist)) best = { kind: "hole", id: hole.id, dist };
        }
        if (best) return best;
        for (const mod of [...(part.modifiers ?? [])].reverse()) {
          if (isCornerModifier(mod.type)) {
            const ax = mod.anchor % 3 === 0 ? 0 : part.L;
            const ay = mod.anchor < 3 ? part.W : 0;
            if (Math.hypot(px - X(ax), py - Y(ay)) <= Math.max(mod.r * s, 26)) {
              return { kind: "mod", id: mod.id };
            }
            continue;
          }
          const r = modifierRect(mod, part);
          if (px >= X(r.x) - 8 && px <= X(r.x + r.w) + 8 && py >= Y(r.y + r.h) - 8 && py <= Y(r.y) + 8) {
            return { kind: "mod", id: mod.id };
          }
        }
        return null;
      }

      /** Цифры толщины кромки на цветной полосе (карта раскроя для пильщика). */
      function drawEdgeLabel(ctx, code, x, y, length, vertical, k) {
        if (!code || length < 26 * k) return;
        ctx.save();
        setFont(ctx, 7.4 * k, 700);
        ctx.fillStyle = code === 1 ? "#ffffff" : "#1d242b";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.translate(x, y);
        if (vertical) ctx.rotate(-Math.PI / 2);
        const label = EDGE_TYPES[code].short;
        const gap = Math.max(60 * k, length / 3);
        const count = clamp(Math.floor(length / gap), 1, 4);
        for (let i = 0; i < count; i += 1) {
          ctx.fillText(label, (i - (count - 1) / 2) * gap, 0.4 * k);
        }
        ctx.restore();
      }

      /** Легенда кромки: цветные полоски с толщиной. Возвращает ширину легенды. */
      function drawEdgeLegend(ctx, x, y, k) {
        let cx0 = x;
        drawText(ctx, "КРОМКА", cx0, y + 7 * k, { size: 9.5 * k, weight: 700, color: PRINT.muted });
        cx0 += 58 * k;
        for (const type of EDGE_TYPES.slice(1)) {
          ctx.fillStyle = type.color;
          ctx.fillRect(cx0, y - 2 * k, 34 * k, 12 * k);
          setFont(ctx, 8.5 * k, 700);
          ctx.fillStyle = type.id === 1 ? "#ffffff" : "#1d242b";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(type.short, cx0 + 17 * k, y + 4.2 * k);
          drawText(ctx, `${type.label}`, cx0 + 40 * k, y + 8 * k, { size: 11 * k, weight: 600 });
          cx0 += 104 * k;
        }
        return cx0 - x;
      }

      function hitTest(sheet, x, y) {
        for (let i = sheet.placed.length - 1; i >= 0; i -= 1) {
          const p = sheet.placed[i];
          if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return i;
        }
        return -1;
      }

      const TEXT_SCALE = { s: 0.85, m: 1, l: 1.2 };
      const VIEW_INSETS = Object.freeze({ top: 70, right: 14, bottom: 64, left: 40 });
      class ExportError extends Error {}

      async function publishFile(blob, fileName) {
        if (!CONFIG.exportEndpoint)
          throw new ExportError("Сервер экспорта не подключён к приложению");
        const endpoint = new URL(CONFIG.exportEndpoint);
        if (endpoint.protocol !== "https:")
          throw new ExportError("Сервер экспорта должен работать по HTTPS");
        if (!inTelegram || !WebApp.initData)
          throw new ExportError("Экспорт доступен только внутри Telegram");
        let response;
        try {
          response = await fetch(endpoint, {
            method: "POST",
            headers: {
              Authorization: `tma ${WebApp.initData}`,
              "Content-Type": blob.type,
              "X-File-Name": encodeURIComponent(fileName),
            },
            body: blob,
            credentials: "omit",
            cache: "no-store",
            referrerPolicy: "no-referrer",
            signal: AbortSignal.timeout(45e3),
          });
        } catch {
          throw new ExportError("Нет соединения с сервером экспорта");
        }
        if (response.status === 401)
          throw new ExportError("Сессия Telegram устарела. Перезапустите приложение");
        if (response.status === 413) throw new ExportError("Файл слишком большой");
        if (response.status === 429)
          throw new ExportError("Слишком много запросов. Повторите через минуту");
        if (!response.ok) throw new ExportError("Сервер экспорта временно недоступен");
        const data = await response.json().catch(() => null);
        let url;
        try {
          url = new URL(data?.url);
        } catch {
          throw new ExportError("Некорректный ответ сервера экспорта");
        }
        if (url.protocol !== "https:" || url.origin !== endpoint.origin) {
          throw new ExportError("Некорректный ответ сервера экспорта");
        }
        return url.href;
      }

      function requestDownload(url, fileName) {
        return new Promise((resolve) => {
          if (supports("8.0")) {
            WebApp.downloadFile({ url, file_name: fileName }, (accepted) =>
              resolve(Boolean(accepted)),
            );
          } else {
            WebApp.openLink(url);
            resolve(true);
          }
        });
      }

      function safeFileName(name) {
        const base = name
          .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ")
          .replace(/\s+/g, "_")
          .replace(/^[._]+|[._]+$/g, "")
          .slice(0, 60);
        return base || "fbuild";
      }

      async function fontsReady() {
        if (!document.fonts) return;
        await Promise.race([
          Promise.all([
            document.fonts.load(`500 16px ${FONT}`),
            document.fonts.load(`600 16px ${FONT}`),
            document.fonts.load(`700 16px ${FONT}`),
          ]),
          wait(2e3),
        ]).catch(() => void 0);
      }

      function canvasToBlob(canvas, type, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) =>
              blob ? resolve(blob) : reject(new ExportError("Не удалось сформировать изображение")),
            type,
            quality,
          );
        });
      }

      function makeCanvas(width, height) {
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width);
        canvas.height = Math.round(height);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return { canvas, ctx };
      }

      const PRINT = {
        ...PALETTES.light,
        background: "#ffffff",
        ink: "#1d242b",
        line: "#d9dee3",
        zebra: "#f5f7f9",
        brand: "#0696d7",
      };

      function drawBrand(ctx, x, y, size) {
        ctx.save();
        ctx.fillStyle = PRINT.brand;
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, size * 0.22);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        setFont(ctx, size * 0.62, 700);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("f", x + size / 2, y + size / 2 + size * 0.03);
        ctx.restore();
      }

      function drawText(
        ctx,
        value,
        x,
        y,
        { size, weight = 500, color = PRINT.ink, align = "left", max } = {},
      ) {
        setFont(ctx, size, weight);
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "alphabetic";
        let label = String(value);
        if (max && ctx.measureText(label).width > max) {
          while (label.length > 1 && ctx.measureText(`${label}…`).width > max)
            label = label.slice(0, -1);
          label = `${label}…`;
        }
        ctx.fillText(label, x, y);
      }

      function drawHeader(ctx, { x, y, width, k, project, title, badge, stats }) {
        ctx.fillStyle = PRINT.brand;
        ctx.fillRect(0, 0, ctx.canvas.width, 6 * k);
        drawBrand(ctx, x, y, 40 * k);
        drawText(ctx, "fBuild", x + 52 * k, y + 17 * k, {
          size: 15 * k,
          weight: 700,
          color: PRINT.brand,
        });
        drawText(ctx, project.name || "Проект", x + 52 * k, y + 38 * k, {
          size: 19 * k,
          weight: 700,
          max: width * 0.55,
        });
        const m = project.material;
        drawText(
          ctx,
          `${m.name || "Материал"} ${fmt(m.T, 1)} мм · лист ${fmt(m.L)}×${fmt(m.W)} мм · рез ${fmt(project.cut.kerf, 1)} мм · обрезка ${fmt(project.cut.trim, 1)} мм`,
          x,
          y + 68 * k,
          { size: 12.5 * k, color: PRINT.muted, max: width * 0.62 },
        );
        drawText(ctx, title, x + width, y + 26 * k, { size: 24 * k, weight: 700, align: "right" });
        if (badge) {
          setFont(ctx, 13 * k, 700);
          const bw = ctx.measureText(badge).width + 20 * k;
          ctx.fillStyle = PRINT.brand;
          ctx.beginPath();
          ctx.roundRect(x + width - bw, y + 38 * k, bw, 24 * k, 12 * k);
          ctx.fill();
          drawText(ctx, badge, x + width - bw / 2, y + 55 * k, {
            size: 13 * k,
            weight: 700,
            color: "#ffffff",
            align: "center",
          });
        }
        if (stats?.length) {
          const top = y + 84 * k;
          const cell = width / stats.length;
          ctx.strokeStyle = PRINT.line;
          ctx.lineWidth = k;
          ctx.strokeRect(x, top, width, 50 * k);
          stats.forEach(([label, value], i) => {
            if (i) {
              ctx.beginPath();
              ctx.moveTo(x + cell * i, top);
              ctx.lineTo(x + cell * i, top + 50 * k);
              ctx.stroke();
            }
            drawText(ctx, label.toUpperCase(), x + cell * i + 12 * k, top + 19 * k, {
              size: 9.5 * k,
              weight: 600,
              color: PRINT.muted,
            });
            drawText(ctx, value, x + cell * i + 12 * k, top + 41 * k, {
              size: 16 * k,
              weight: 700,
              max: cell - 20 * k,
            });
          });
          return top + 50 * k;
        }
        return y + 80 * k;
      }

      /**
       * Таблица для печати. Колонка может задать draw(ctx, value, x, y, w, h, k) для
       * графики в ячейке; строка с __section рисуется как заголовок группы на всю ширину.
       */
      function drawTable(
        ctx,
        { x, y, width, k, columns, rows, rowHeight = 30, headerHeight = 30 },
      ) {
        const rh = rowHeight * k;
        const hh = headerHeight * k;
        const total = columns.reduce((t, c) => t + c.width, 0);
        const widths = columns.map((c) => (c.width / total) * width);
        ctx.fillStyle = PRINT.zebra;
        ctx.fillRect(x, y, width, hh);
        let cx0 = x;
        columns.forEach((c, i) => {
          const align = c.align ?? "left";
          const tx = align === "right" ? cx0 + widths[i] - 8 * k : cx0 + 8 * k;
          drawText(ctx, c.label.toUpperCase(), tx, y + hh / 2 + 4 * k, {
            size: 9.5 * k,
            weight: 700,
            color: PRINT.muted,
            align,
            max: widths[i] - 12 * k,
          });
          cx0 += widths[i];
        });
        let stripe = 0;
        rows.forEach((row, r) => {
          const top = y + hh + r * rh;
          if (row.__section) {
            stripe = 0;
            ctx.fillStyle = "#e4ecf2";
            ctx.fillRect(x, top, width, rh);
            ctx.fillStyle = PRINT.brand;
            ctx.fillRect(x, top, 4 * k, rh);
            drawText(ctx, row.__section, x + 12 * k, top + rh / 2 + 4.5 * k, {
              size: 12 * k,
              weight: 700,
              max: width - 24 * k,
            });
            return;
          }
          if (stripe % 2) {
            ctx.fillStyle = PRINT.zebra;
            ctx.fillRect(x, top, width, rh);
          }
          stripe += 1;
          let cx1 = x;
          columns.forEach((c, i) => {
            const cell = row[c.key];
            const align = c.align ?? "left";
            if (c.draw) {
              if (cell !== void 0) c.draw(ctx, cell, cx1, top, widths[i], rh, k);
            } else if (c.key === "swatch") {
              ctx.fillStyle = cell;
              ctx.fillRect(cx1 + 8 * k, top + rh * 0.25, 5 * k, rh * 0.5);
            } else {
              const tx = align === "right" ? cx1 + widths[i] - 8 * k : cx1 + 8 * k;
              drawText(ctx, cell ?? "", tx, top + rh / 2 + 4.5 * k, {
                size: 12.5 * k,
                weight: c.strong ? 700 : 500,
                align,
                max: widths[i] - 14 * k,
              });
            }
            cx1 += widths[i];
          });
        });
        ctx.strokeStyle = PRINT.line;
        ctx.lineWidth = k;
        ctx.strokeRect(x, y, width, hh + rows.length * rh);
        return y + hh + rows.length * rh;
      }

      const SHEET_COLUMNS = [
        { key: "swatch", label: "", width: 3 },
        { key: "no", label: "№", width: 5, strong: true },
        { key: "name", label: "Деталь", width: 30 },
        { key: "size", label: "Д × Ш, мм", width: 20, align: "right" },
        { key: "edges", label: "Кромка Д1/Д2/К1/К2", width: 22, align: "right" },
        { key: "count", label: "Шт", width: 8, align: "right", strong: true },
      ];
      function sheetRows(sheet, job) {
        return sheetParts(sheet, job).map(({ part, count }) => ({
          swatch: PRINT.stroke(hueOf(part.no - 1)),
          no: String(part.no),
          name: part.name || "—",
          size: `${fmt(part.L, 1)} × ${fmt(part.W, 1)}`,
          edges: part.edges.map((c) => EDGE_TYPES[c].short).join(" / "),
          count: String(count),
        }));
      }

      function sheetStats(sheet) {
        return [
          ["Деталей", fmt(sheet.placed.length)],
          ["Заполнение", `${fmt(sheet.util * 100, 1)}%`],
          ["Длина реза", `${fmt(sheet.cut / 1e3, 1)} м`],
          ["Отходы", `${fmt((sheet.w * sheet.h - sheet.used) / 1e6, 2)} м²`],
        ];
      }

      function layoutSheetImage(sheet, job, width) {
        const k = width / 1200;
        const pad = 36 * k;
        const header = 160 * k;
        const dimPad = 44 * k;
        const mapWidth = width - pad * 2 - dimPad;
        const scale = mapWidth / sheet.w;
        const mapHeight = sheet.h * scale + dimPad;
        const rows = sheetRows(sheet, job);
        const table = 30 * k + rows.length * 30 * k;
        const footer = 40 * k;
        return {
          k,
          pad,
          header,
          dimPad,
          scale,
          mapHeight,
          rows,
          height: pad + header + mapHeight + pad + table + footer,
        };
      }

      function renderSheetImage({ sheet, job, project, display, width }) {
        const layout = layoutSheetImage(sheet, job, width);
        const { k, pad, header, dimPad, scale, mapHeight, rows } = layout;
        const { canvas, ctx } = makeCanvas(width, layout.height);
        drawHeader(ctx, {
          x: pad,
          y: pad * 0.8,
          width: width - pad * 2,
          k,
          project,
          title: sheetLabel(sheet),
          badge:
            sheet.count > 1
              ? `× ${sheet.count} ${plural(sheet.count, "лист", "листа", "листов")}`
              : null,
          stats: sheetStats(sheet),
        });
        const top = pad + header;
        drawSheet(ctx, {
          sheet,
          job,
          palette: PRINT,
          display: { ...display, dims: true, edges: true, edgeLabels: true },
          view: { scale, x: pad + dimPad, y: top + dimPad },
          k: k * 1.35,
          maxLabel: 17,
          textScale: TEXT_SCALE[display.text],
        });
        const tableEnd = drawTable(ctx, {
          x: pad,
          y: top + mapHeight + pad * 0.7,
          width: width - pad * 2,
          k,
          columns: SHEET_COLUMNS,
          rows,
        });
        drawText(
          ctx,
          `fBuild · ${new Date().toLocaleString(CONFIG.locale)}`,
          pad,
          tableEnd + 28 * k,
          {
            size: 11 * k,
            color: PRINT.muted,
          },
        );
        return canvas;
      }

      const CANVAS_AREA = 16e6;
      const CANVAS_SIDE = 8192;
      async function buildPng({ result, job, project, display, scope, sheetIndex }) {
        await fontsReady();
        const sheets = scope === "all" ? result.sheets : [result.sheets[sheetIndex]];
        const ratios = sheets.map((sheet) => layoutSheetImage(sheet, job, 1e3).height / 1e3);
        if (sheets.length === 1) {
          const width = Math.floor(
            Math.min(2400, Math.sqrt(CANVAS_AREA / ratios[0]), CANVAS_SIDE / ratios[0]),
          );
          return canvasToBlob(
            renderSheetImage({ sheet: sheets[0], job, project, display, width }),
            "image/png",
          );
        }
        const columns = sheets.length <= 4 ? 2 : 3;
        const rowsCount = Math.ceil(sheets.length / columns);
        const rowRatios = Array.from({ length: rowsCount }, (_, r) =>
          Math.max(...ratios.slice(r * columns, r * columns + columns)),
        );
        const gapRatio = 0.03;
        const totalWidthRatio = columns + gapRatio * (columns + 1);
        const totalHeightRatio = rowRatios.reduce((t, v) => t + v, 0) + gapRatio * (rowsCount + 1);
        const tile = Math.floor(
          Math.min(
            1600,
            Math.sqrt(CANVAS_AREA / (totalWidthRatio * totalHeightRatio)),
            CANVAS_SIDE / totalWidthRatio,
            CANVAS_SIDE / totalHeightRatio,
          ),
        );
        const gap = Math.round(tile * gapRatio);
        const { canvas, ctx } = makeCanvas(tile * totalWidthRatio, tile * totalHeightRatio);
        ctx.fillStyle = "#e9edf1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        let y = gap;
        for (let r = 0; r < rowsCount; r += 1) {
          for (let c = 0; c < columns; c += 1) {
            const sheet = sheets[r * columns + c];
            if (!sheet) continue;
            const page = renderSheetImage({ sheet, job, project, display, width: tile });
            ctx.drawImage(page, gap + c * (tile + gap), y);
          }
          y += Math.round(rowRatios[r] * tile) + gap;
        }
        return canvasToBlob(canvas, "image/png");
      }

      const A4 = { width: 1754, height: 1240, points: [841.89, 595.28] };
      function printSummaryPages({ job, project, summary, includeSpec }) {
        const pages = [];
        const k = A4.width / 1200;
        const pad = 40 * k;
        const contentWidth = A4.width - pad * 2;
        const newPage = () => {
          const page = makeCanvas(A4.width, A4.height);
          pages.push(page);
          return page.ctx;
        };
        let ctx = newPage();
        let y = drawHeader(ctx, {
          x: pad,
          y: pad * 0.8,
          width: contentWidth,
          k,
          project,
          title: "Карта раскроя",
          badge: `${summary.sheetCount} ${plural(summary.sheetCount, "лист", "листа", "листов")}`,
          stats: [
            ["Деталей", `${fmt(summary.placed)} шт`],
            ["Заполнение", `${fmt(summary.util * 100, 1)}%`],
            ["Длина реза", `${fmt(summary.cutLength / 1e3, 1)} м`],
            ["Кромка", `${fmt(summary.edgeTotal / 1e3, 1)} м`],
            ["Стоимость", money(summary.costs.total)],
          ],
        });
        y += 26 * k;
        if (summary.unplaced) {
          drawText(
            ctx,
            `Не размещено деталей: ${summary.unplaced} шт — проверьте размеры`,
            pad,
            y + 6 * k,
            {
              size: 14 * k,
              weight: 700,
              color: PRINT.defect,
            },
          );
          y += 30 * k;
        }
        if (!includeSpec) return pages;
        const columns = [
          { key: "swatch", label: "", width: 3 },
          { key: "no", label: "№", width: 4, strong: true },
          { key: "name", label: "Деталь", width: 28 },
          { key: "size", label: "Д × Ш, мм", width: 15, align: "right" },
          { key: "cut", label: "В распил, мм", width: 15, align: "right" },
          { key: "edges", label: "Кромка Д1/Д2/К1/К2", width: 17, align: "right" },
          { key: "grain", label: "Текстура", width: 9, align: "right" },
          { key: "qty", label: "Шт", width: 7, align: "right", strong: true },
        ];
        const rows = [...job.parts]
          .sort((a, b) => a.no - b.no)
          .map((part) => ({
          swatch: PRINT.stroke(hueOf(part.no - 1)),
          no: String(part.no),
          name: part.name || "—",
          size: `${fmt(part.L, 1)} × ${fmt(part.W, 1)}`,
          cut: `${fmt(part.cutL, 1)} × ${fmt(part.cutW, 1)}`,
          edges: part.edges.map((c) => EDGE_TYPES[c].short).join(" / "),
          grain: part.rot ? "—" : "да",
          qty: String(part.qty),
        }));
        drawText(ctx, "Спецификация деталей", pad, y + 4 * k, { size: 16 * k, weight: 700 });
        y += 16 * k;
        const rowHeight = 30;
        let start = 0;
        while (start < rows.length) {
          const capacity = Math.max(1, Math.floor((A4.height - y - 70 * k) / (rowHeight * k)) - 1);
          const chunk = rows.slice(start, start + capacity);
          drawTable(ctx, { x: pad, y, width: contentWidth, k, columns, rows: chunk, rowHeight });
          start += chunk.length;
          if (start < rows.length) {
            ctx = newPage();
            y = pad;
          }
        }
        return pages;
      }

      function printSheetPage({ sheet, job, project, display, includeParts }) {
        const k = A4.width / 1200;
        const pad = 40 * k;
        const { canvas, ctx } = makeCanvas(A4.width, A4.height);
        const contentWidth = A4.width - pad * 2;
        const top =
          drawHeader(ctx, {
            x: pad,
            y: pad * 0.8,
            width: contentWidth,
            k,
            project,
            title: sheetLabel(sheet),
            badge: sheet.count > 1 ? `Повторить × ${sheet.count}` : null,
            stats: sheetStats(sheet),
          }) +
          20 * k;
        const rows = sheetRows(sheet, job);
        const tableWidth = includeParts ? contentWidth * 0.34 : 0;
        const gap = includeParts ? 24 * k : 0;
        const dimPad = 44 * k;
        const areaW = contentWidth - tableWidth - gap - dimPad;
        const areaH = A4.height - top - 60 * k - dimPad;
        const scale = Math.min(areaW / sheet.w, areaH / sheet.h);
        drawSheet(ctx, {
          sheet,
          job,
          palette: PRINT,
          display: { ...display, dims: true, edges: true, edgeLabels: true },
          view: { scale, x: pad + dimPad, y: top + dimPad },
          k: k * 1.2,
          maxLabel: 16,
          textScale: TEXT_SCALE[display.text],
        });
        drawEdgeLegend(ctx, pad, A4.height - 40 * k, k);
        if (includeParts) {
          const columns = [
            { key: "swatch", label: "", width: 4 },
            { key: "no", label: "№", width: 8, strong: true },
            { key: "name", label: "Деталь", width: 38 },
            { key: "size", label: "Д × Ш", width: 34, align: "right" },
            { key: "count", label: "Шт", width: 12, align: "right", strong: true },
          ];
          const rowHeight = clamp(
            Math.floor((A4.height - top - 90 * k) / k / (rows.length + 1)),
            18,
            30,
          );
          drawTable(ctx, {
            x: pad + contentWidth - tableWidth,
            y: top,
            width: tableWidth,
            k,
            columns,
            rows,
            rowHeight,
            headerHeight: Math.min(30, rowHeight),
          });
        }
        return canvas;
      }

      // ─────────────────────────────────────────────────────────────────────
      // Печать: 4 отдельных документа для цеха
      // ─────────────────────────────────────────────────────────────────────

      const PRINT_DOCS = [
        {
          id: "cut",
          title: "Карта раскроя",
          who: "Пильщик",
          hint: "Сводка, листы и легенда кромки 0,4 / 1 / 2 на полосках",
          icon: LuScissors,
          slug: "раскрой",
        },
        {
          id: "edge",
          title: "Спецификация кромки",
          who: "Кромщик",
          hint: "Стороны облицовки, метраж с припуском, итоги по типам",
          icon: LuRuler,
          slug: "кромка",
        },
        {
          id: "drill",
          title: "Схема присадки",
          who: "Сверловщик",
          hint: "Схема каждой детали и таблица координат отверстий",
          icon: LuDrill,
          slug: "присадка",
        },
        {
          id: "assembly",
          title: "Сборочный чертёж",
          who: "Сборщик",
          hint: "3D-вид с выносками и спецификация по позициям",
          icon: LuBox,
          slug: "сборка",
        },
      ];

      /** Общий лист A4: шапка + функция «новая страница». */
      function pageKit(pages) {
        const k = A4.width / 1200;
        const pad = 40 * k;
        return {
          k,
          pad,
          contentWidth: A4.width - pad * 2,
          newPage() {
            const page = makeCanvas(A4.width, A4.height);
            pages.push(page.canvas);
            return page.ctx;
          },
        };
      }

      /** Таблица с переносом на новые страницы. Возвращает { ctx, y } после таблицы. */
      function drawPagedTable({ ctx, y, x, width, k, columns, rows, rowHeight = 28, newPage, top, bottom }) {
        let start = 0;
        let cursor = y;
        let current = ctx;
        while (start < rows.length) {
          const capacity = Math.max(1, Math.floor((A4.height - cursor - bottom) / (rowHeight * k)) - 1);
          const chunk = rows.slice(start, start + capacity);
          cursor = drawTable(current, { x, y: cursor, width, k, columns, rows: chunk, rowHeight });
          start += chunk.length;
          if (start < rows.length) {
            current = newPage();
            cursor = top;
          }
        }
        return { ctx: current, y: cursor };
      }

      /** Нижний колонтитул и конвертация в JPEG для pdf-lib. */
      async function finalizePages(canvases, project, docTitle) {
        const pages = [];
        for (let i = 0; i < canvases.length; i += 1) {
          const ctx = canvases[i].getContext("2d");
          drawText(
            ctx,
            `fBuild · ${project.name} · ${docTitle} · стр. ${i + 1} из ${canvases.length}`,
            A4.width - 50,
            A4.height - 28,
            { size: 18, color: PRINT.muted, align: "right" },
          );
          pages.push(await canvasToBlob(canvases[i], "image/jpeg", 0.92));
        }
        return pages;
      }

      /** Мини-глиф кромки в ячейке таблицы. */
      function drawEdgeCell(ctx, edges, x, y, w, h, k) {
        const gw = Math.min(w - 10 * k, 46 * k);
        const gh = Math.min(h - 8 * k, 18 * k);
        const gx = x + (w - gw) / 2;
        const gy = y + (h - gh) / 2;
        ctx.fillStyle = "#eef1f4";
        ctx.fillRect(gx, gy, gw, gh);
        ctx.strokeStyle = PRINT.line;
        ctx.lineWidth = k;
        ctx.strokeRect(gx, gy, gw, gh);
        const t = 3 * k;
        const rects = [
          [gx, gy, gw, t],
          [gx, gy + gh - t, gw, t],
          [gx, gy, t, gh],
          [gx + gw - t, gy, t, gh],
        ];
        edges.forEach((code, i) => {
          if (!code) return;
          ctx.fillStyle = EDGE_TYPES[code].color;
          ctx.fillRect(...rects[i]);
        });
      }

      /** Документ 2. Спецификация кромки для кромщика. */
      function printEdgePages(project, positions) {
        const canvases = [];
        const { k, pad, contentWidth, newPage } = pageKit(canvases);
        const parts = project.parts
          .filter((p) => p.L > 0 && p.W > 0 && p.qty > 0 && p.edges.some(Boolean))
          .sort((a, b) => positions.get(a.id) - positions.get(b.id));
        const net = [0, 0, 0, 0];
        const gross = [0, 0, 0, 0];
        const rows = parts.map((part) => {
          const meters = [0, 0, 0, 0];
          part.edges.forEach((code, side) => {
            if (!code) return;
            const len = edgeLength(part, side);
            meters[code] += ((len + 2 * EDGE_ALLOWANCE) * part.qty) / 1e3;
            net[code] += (len * part.qty) / 1e3;
            gross[code] += ((len + 2 * EDGE_ALLOWANCE) * part.qty) / 1e3;
          });
          const no = positions.get(part.id);
          return {
            swatch: PRINT.stroke(hueOf(no - 1)),
            no: String(no),
            name: part.name || "—",
            size: `${fmt(part.L, 1)} × ${fmt(part.W, 1)}`,
            qty: String(part.qty),
            glyph: part.edges,
            e0: part.edges[0] ? EDGE_TYPES[part.edges[0]].short : "—",
            e1: part.edges[1] ? EDGE_TYPES[part.edges[1]].short : "—",
            e2: part.edges[2] ? EDGE_TYPES[part.edges[2]].short : "—",
            e3: part.edges[3] ? EDGE_TYPES[part.edges[3]].short : "—",
            m1: meters[1] ? fmt(meters[1], 2) : "",
            m2: meters[2] ? fmt(meters[2], 2) : "",
            m3: meters[3] ? fmt(meters[3], 2) : "",
          };
        });
        let ctx = newPage();
        let y = drawHeader(ctx, {
          x: pad,
          y: pad * 0.8,
          width: contentWidth,
          k,
          project,
          title: "Спецификация кромки",
          badge: `${parts.length} ${plural(parts.length, "позиция", "позиции", "позиций")}`,
          stats: [
            ...EDGE_TYPES.slice(1).map((t) => [`Кромка ${t.label}`, `${fmt(gross[t.id], 1)} м`]),
            ["Всего с припуском", `${fmt(gross.reduce((a, b) => a + b, 0), 1)} м`],
          ],
        });
        y += 18 * k;
        drawEdgeLegend(ctx, pad, y, k);
        drawText(
          ctx,
          `Д1 — верх, Д2 — низ, К1 — лево, К2 — право · припуск ${EDGE_ALLOWANCE} мм на каждый торец`,
          pad + contentWidth,
          y + 8 * k,
          { size: 11 * k, color: PRINT.muted, align: "right" },
        );
        y += 26 * k;
        const columns = [
          { key: "swatch", label: "", width: 2.5 },
          { key: "no", label: "Поз.", width: 4.5, strong: true },
          { key: "name", label: "Деталь", width: 20 },
          { key: "size", label: "Д × Ш, мм", width: 12, align: "right" },
          { key: "qty", label: "Шт", width: 4.5, align: "right", strong: true },
          { key: "glyph", label: "Схема", width: 7, draw: drawEdgeCell },
          { key: "e0", label: "Д1", width: 5, align: "right" },
          { key: "e1", label: "Д2", width: 5, align: "right" },
          { key: "e2", label: "К1", width: 5, align: "right" },
          { key: "e3", label: "К2", width: 5, align: "right" },
          { key: "m1", label: "0,4 мм, м", width: 8, align: "right" },
          { key: "m2", label: "1 мм, м", width: 8, align: "right" },
          { key: "m3", label: "2 мм, м", width: 8, align: "right" },
        ];
        if (!rows.length) {
          drawText(ctx, "В проекте нет деталей с кромкой", pad, y + 20 * k, { size: 15 * k, color: PRINT.muted });
          return canvases;
        }
        ({ ctx, y } = drawPagedTable({
          ctx,
          y,
          x: pad,
          width: contentWidth,
          k,
          columns,
          rows,
          rowHeight: 30,
          newPage,
          top: pad,
          bottom: 70 * k,
        }));
        // Итоги по типам кромки — то, что кромщик берёт со склада.
        const totals = EDGE_TYPES.slice(1)
          .filter((t) => gross[t.id] > 0)
          .map((t) => ({
            swatch: t.color,
            type: `Кромка ${t.label}`,
            net: fmt(net[t.id], 2),
            gross: fmt(gross[t.id], 2),
            price: project.prices.edges[t.id - 1] ? money(project.prices.edges[t.id - 1]) : "—",
            cost: project.prices.edges[t.id - 1] ? money(gross[t.id] * project.prices.edges[t.id - 1]) : "—",
          }));
        const totalsColumns = [
          { key: "swatch", label: "", width: 3 },
          { key: "type", label: "Тип", width: 25, strong: true },
          { key: "net", label: "Нетто, м", width: 15, align: "right" },
          { key: "gross", label: "С припуском, м", width: 18, align: "right", strong: true },
          { key: "price", label: "Цена за м", width: 18, align: "right" },
          { key: "cost", label: "Стоимость", width: 21, align: "right" },
        ];
        const needed = (totals.length + 2) * 30 * k + 40 * k;
        if (A4.height - y - 70 * k < needed) {
          ctx = newPage();
          y = pad;
        }
        y += 24 * k;
        drawText(ctx, "Итого по типам", pad, y, { size: 15 * k, weight: 700 });
        drawTable(ctx, {
          x: pad,
          y: y + 10 * k,
          width: contentWidth * 0.62,
          k,
          columns: totalsColumns,
          rows: totals,
          rowHeight: 30,
        });
        return canvases;
      }

      /** Документ 3. Схема присадки: по странице на деталь с отверстиями или вырезами. */
      function printDrillPages(project, positions) {
        const canvases = [];
        const { k, pad, contentWidth, newPage } = pageKit(canvases);
        const parts = project.parts
          .filter((p) => p.L > 0 && p.W > 0 && p.qty > 0 && (p.holes.length || p.modifiers.length))
          .sort((a, b) => positions.get(a.id) - positions.get(b.id));
        const columns = [
          { key: "no", label: "№", width: 6.5, strong: true },
          { key: "type", label: "Тип", width: 19 },
          { key: "side", label: "Стор.", width: 8 },
          { key: "x", label: "X", width: 10, align: "right", strong: true },
          { key: "y", label: "Y", width: 10, align: "right", strong: true },
          { key: "d", label: "Ø / размер", width: 13, align: "right" },
          { key: "depth", label: "Глубина", width: 11, align: "right" },
        ];
        for (const part of parts) {
          const no = positions.get(part.id);
          let ctx = newPage();
          const top =
            drawHeader(ctx, {
              x: pad,
              y: pad * 0.8,
              width: contentWidth,
              k,
              project,
              title: `Присадка · поз. ${no}`,
              badge: `× ${part.qty} шт`,
              stats: [
                ["Деталь", part.name || "Без названия"],
                ["Размер", `${fmt(part.L, 1)} × ${fmt(part.W, 1)} мм`],
                ["Толщина", `${fmt(project.material.T, 1)} мм`],
                ["Отверстий", String(part.holes.length)],
                ["Обработка", String(part.modifiers.length)],
              ],
            }) + 18 * k;
          const tableWidth = contentWidth * 0.4;
          const areaW = contentWidth - tableWidth - 24 * k;
          const areaH = A4.height - top - 90 * k;
          const view = fitSchematic(part, areaW, areaH, 46 * k);
          drawPartSchematic(ctx, {
            part,
            view: { ...view, x: pad + view.x, y: top + view.y },
            palette: SCHEMATIC_PRINT,
            k: k * 1.1,
            numbers: true,
          });
          drawText(
            ctx,
            "Начало координат — левый нижний угол · пласть A — лицевая · Д1 сверху",
            pad,
            A4.height - 56 * k,
            { size: 11 * k, color: PRINT.muted, max: areaW },
          );
          // Легенда типов, присутствующих на детали.
          const used = HOLE_TYPES.filter((t) => part.holes.some((h) => h.type === t.id));
          let lx = pad;
          for (const t of used) {
            ctx.fillStyle = t.color;
            ctx.beginPath();
            ctx.arc(lx + 6 * k, A4.height - 76 * k, 5 * k, 0, Math.PI * 2);
            ctx.fill();
            drawText(ctx, t.label, lx + 15 * k, A4.height - 72 * k, { size: 11 * k, weight: 600 });
            setFont(ctx, 11 * k, 600);
            lx += ctx.measureText(t.label).width + 34 * k;
          }
          const rows = part.holes.map((hole, i) => ({
            no: String(i + 1),
            type: holeType(hole.type).label,
            side: sideLabel(hole.side),
            x: fmt(hole.x, 1),
            y: fmt(hole.y, 1),
            d: `Ø${fmt(hole.d, 1)}`,
            depth: hole.side.startsWith("e") || hole.depth < project.material.T ? fmt(hole.depth, 1) : "насквозь",
          }));
          for (const [i, mod] of part.modifiers.entries()) {
            const type = MODIFIER_TYPES.find((t) => t.id === mod.type)?.label ?? mod.type;
            if (isCornerModifier(mod.type)) {
              rows.push({
                no: `М${i + 1}`,
                type: `${type} угла`,
                side: ANCHORS[mod.anchor],
                x: "",
                y: "",
                d: mod.type === "radius" ? `R${fmt(mod.r, 1)}` : `${fmt(mod.r, 1)}×45°`,
                depth: "контур",
              });
            } else {
              const r = modifierRect(mod, part);
              rows.push({
                no: `М${i + 1}`,
                type: mod.type === "circle" ? "Круглый вырез" : "Вырез",
                side: ANCHORS[mod.anchor],
                x: fmt(mod.type === "circle" ? r.x + r.w / 2 : r.x, 1),
                y: fmt(mod.type === "circle" ? r.y + r.h / 2 : r.y, 1),
                d: mod.type === "circle" ? `Ø${fmt(r.w, 1)}` : `${fmt(r.w, 1)}×${fmt(r.h, 1)}`,
                depth: "насквозь",
              });
            }
          }
          drawPagedTable({
            ctx,
            y: top,
            x: pad + contentWidth - tableWidth,
            width: tableWidth,
            k,
            columns,
            rows,
            rowHeight: 26,
            newPage,
            top: pad,
            bottom: 70 * k,
          });
        }
        return canvases;
      }

      /** Документ 4. Сборочный чертёж: 3D-вид с выносками и спецификация. */
      async function printAssemblyPages(project, positions) {
        const canvases = [];
        const { k, pad, contentWidth, newPage } = pageKit(canvases);
        const bom = buildBom(project, positions);
        const layout = layoutAssembly(project, positions);
        const pieces = bom.reduce((t, g) => t + g.qty, 0);
        const area = bom.reduce((t, g) => t + g.area, 0);
        let ctx = newPage();
        const top =
          drawHeader(ctx, {
            x: pad,
            y: pad * 0.8,
            width: contentWidth,
            k,
            project,
            title: "Сборочный чертёж",
            badge: `${pieces} ${plural(pieces, "деталь", "детали", "деталей")}`,
            stats: [
              ["Позиций", String(bom.reduce((t, g) => t + g.items.length, 0))],
              ["Групп", String(bom.length)],
              ["Площадь", `${fmt(area, 2)} м²`],
              ["Габарит", layout.boxes.length ? layout.bounds.size.map((v) => fmt(v)).join(" × ") : "—"],
            ],
          }) + 16 * k;
        const tableWidth = contentWidth * 0.38;
        const imageW = Math.round(contentWidth - tableWidth - 24 * k);
        const imageH = Math.round(A4.height - top - 70 * k);
        const shot = await renderAssemblySnapshot(layout, imageW, imageH);
        ctx.drawImage(shot, pad, top);
        ctx.strokeStyle = PRINT.line;
        ctx.lineWidth = k;
        ctx.strokeRect(pad, top, imageW, imageH);
        if (layout.hidden) {
          drawText(ctx, `Не показано в 3D (роль «Прочее»): ${layout.hidden} шт`, pad + 12 * k, top + imageH - 12 * k, {
            size: 11 * k,
            color: PRINT.muted,
          });
        }
        const columns = [
          { key: "no", label: "Поз.", width: 7, strong: true },
          { key: "name", label: "Наименование", width: 30 },
          { key: "size", label: "Д × Ш × Т", width: 22, align: "right" },
          { key: "qty", label: "Шт", width: 7, align: "right", strong: true },
        ];
        const rows = [];
        for (const group of bom) {
          rows.push({ __section: `${group.name} · ${group.qty} шт` });
          for (const item of group.items) {
            rows.push({
              no: String(item.no),
              name: item.name,
              size: `${fmt(item.L)} × ${fmt(item.W)} × ${fmt(item.T)}`,
              qty: String(item.qty),
            });
          }
        }
        // Первая страница — справа от вида, продолжение — на всю ширину.
        const x0 = pad + contentWidth - tableWidth;
        const capacity = Math.max(1, Math.floor((A4.height - top - 70 * k) / (26 * k)) - 1);
        drawTable(ctx, { x: x0, y: top, width: tableWidth, k, columns, rows: rows.slice(0, capacity), rowHeight: 26 });
        if (rows.length > capacity) {
          ctx = newPage();
          drawPagedTable({
            ctx,
            y: pad,
            x: pad,
            width: contentWidth,
            k,
            columns,
            rows: rows.slice(capacity),
            rowHeight: 26,
            newPage,
            top: pad,
            bottom: 70 * k,
          });
        }
        return canvases;
      }

      /** Сборка выбранного документа в набор JPEG-страниц. */
      async function buildDocumentPages({ doc, solved, project, display, options }) {
        await fontsReady();
        const positions = bomPositions(project.parts);
        const meta = PRINT_DOCS.find((d) => d.id === doc);
        let canvases;
        if (doc === "cut") {
          if (!solved) throw new ExportError("Сначала дождитесь расчёта раскроя");
          canvases = [];
          if (options.summary) {
            for (const page of printSummaryPages({
              job: solved.job,
              project,
              summary: solved.summary,
              includeSpec: options.spec,
            })) {
              canvases.push(page.canvas);
            }
          }
          if (options.sheets) {
            for (const sheet of solved.result.sheets) {
              canvases.push(
                printSheetPage({ sheet, job: solved.job, project, display, includeParts: options.parts }),
              );
            }
          }
        } else if (doc === "edge") {
          canvases = printEdgePages(project, positions);
        } else if (doc === "drill") {
          canvases = printDrillPages(project, positions);
          if (!canvases.length) throw new ExportError("Нет деталей с присадкой или обработкой");
        } else {
          canvases = await printAssemblyPages(project, positions);
        }
        if (!canvases.length) throw new ExportError("Документ пуст — выберите разделы");
        return finalizePages(canvases, project, meta.title);
      }

      async function pagesToPdf(pages, title) {
        const { PDFDocument } = await import("pdf-lib");
        const pdf = await PDFDocument.create();
        pdf.setTitle(title);
        pdf.setAuthor("fBuild");
        pdf.setCreator("fBuild");
        pdf.setProducer("fBuild · pdf-lib");
        pdf.setCreationDate(new Date());
        for (const blob of pages) {
          const image = await pdf.embedJpg(await blob.arrayBuffer());
          const page = pdf.addPage(A4.points);
          page.drawImage(image, { x: 0, y: 0, width: A4.points[0], height: A4.points[1] });
        }
        return new Blob([await pdf.save()], { type: "application/pdf" });
      }

      const DESKTOP_PLATFORMS = new Set(["tdesktop", "web", "weba", "webk", "unknown"]);
      const directDownload = !inTelegram || DESKTOP_PLATFORMS.has(WebApp.platform);
      const serverDelivery = () => Boolean(CONFIG.exportEndpoint) && supports("8.0");
      function canShareFiles(files) {
        try {
          return typeof navigator.share === "function" && Boolean(navigator.canShare?.({ files }));
        } catch {
          return false;
        }
      }

      const shareProbe = {
        png: () => canShareFiles([new File([""], "fcut.png", { type: "image/png" })]),
        pdf: () => canShareFiles([new File([""], "fcut.pdf", { type: "application/pdf" })]),
      };

      function deliveryMethod(purpose) {
        if (serverDelivery()) return "server";
        if (purpose === "print") {
          if (directDownload) return "print";
          return shareProbe.pdf() ? "share" : "viewer";
        }
        if (shareProbe.png()) return "share";
        return directDownload ? "download" : "viewer";
      }

      function SheetCanvas({ sheet, job, theme, display, selected, onSelect, apiRef, resetKey }) {
        const wrapRef = useRef(null);
        const canvasRef = useRef(null);
        const viewRef = useRef(null);
        const sizeRef = useRef({ width: 0, height: 0, dpr: 1 });
        const frameRef = useRef(0);
        const stateRef = useRef({ sheet, job, theme, display, selected, onSelect });
        useLayoutEffect(() => {
          stateRef.current = { sheet, job, theme, display, selected, onSelect };

          cancelAnimationFrame(frameRef.current);
          frameRef.current = requestAnimationFrame(() => {
            const canvas = canvasRef.current;
            const view = viewRef.current;

              sheet: current,
              job: currentJob,
              theme: currentTheme,
              display: currentDisplay,
              selected: sel,
            } = stateRef.current;
            if (!canvas || !view || !current) return;
            const { width, height, dpr } = sizeRef.current;
            const ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);
            drawSheet(ctx, {
              sheet: current,
              job: currentJob,
              palette: { ...PALETTES[currentTheme], background: null },
              display: currentDisplay,
              view,
              selected: sel,
              textScale: TEXT_SCALE[currentDisplay.text],
            });
          });
        }, []);
        const fitScale = useCallback(() => {
          const { width, height } = sizeRef.current;
          const current = stateRef.current.sheet;
          if (!current || !width || !height) return 1;
          return Math.max(
            0.01,
            Math.min(
              (width - VIEW_INSETS.left - VIEW_INSETS.right) / current.w,
              (height - VIEW_INSETS.top - VIEW_INSETS.bottom) / current.h,
            ),
          );
        }, []);
        const fit = useCallback(() => {
          const current = stateRef.current.sheet;
          const { width, height } = sizeRef.current;
          if (!current || !width) return;

            scale,
            x:
              VIEW_INSETS.left +
              (width - VIEW_INSETS.left - VIEW_INSETS.right - current.w * scale) / 2,

              VIEW_INSETS.top +

            const ratio = scale / view.scale;

                (gesture.view.scale * distance) / gesture.distance,
                base * 0.5,
                Math.max(base * 40, 6),

                now - lastTap.time < 320 &&

                  current,
                  (point.x - view.x) / view.scale,
                  (point.y - view.y) / view.scale,

          }),

      }
