            overflow: hidden;
            color: var(--text);
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-2);
          }
        }

        .delivery__actions {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;

          & .btn {
            padding: 0 8px;
          }
        }

        .project-list {
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
        }

        .project-row {
          display: flex;
          align-items: center;
          gap: 4px;
          padding-right: 4px;
          border-bottom: 1px solid var(--border);

          &:last-child {
            border-bottom: 0;
          }

          &.is-current {
            box-shadow: inset 3px 0 0 var(--accent);
            background: var(--accent-soft);
          }
        }

        .project-row__main {
          display: grid;
          flex: 1;
          gap: 2px;
          min-width: 0;
          min-height: 56px;
          padding: 8px 12px;
          text-align: start;

          & b {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          & small {
            color: var(--text-3);
            font-size: 12px;
          }
        }

        .splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          height: var(--tg-viewport, 100dvh);
          padding: 24px;
        }

        .splash__logo,
        .gate__logo {
          width: 56px;
          height: 56px;
          border-radius: 10px;
          font-size: 24px;
        }

        .splash__name {
          font-size: 20px;
          font-weight: 700;
        }

        .splash .state {
          min-height: 0;
        }

        .gate {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          min-height: 100dvh;
          padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
          text-align: center;
        }

        .gate__title {
          font-size: clamp(17px, 4.5vw, 21px);
          font-weight: 600;
          line-height: 1.3;
        }

        .gate .btn {
          text-decoration: none;
        }

        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
          }
        }

        .cam {
          display: grid;
          gap: 12px;
          padding: 12px;
        }

        .cam__sheets {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }

        .cam-canvas {
          position: relative;
          height: clamp(220px, 46dvh, 560px);
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);
          touch-action: pan-y;

          & canvas {
            display: block;
          }
        }

        .cam__sim {
          display: grid;
          grid-template-columns: auto 1fr;
          align-items: center;
          gap: 12px;
          color: var(--text-2);
          font-size: 13px;

          & input {
            width: 100%;
            accent-color: var(--accent);
          }
        }

        .cam__swatch {
          display: inline-block;
          width: 10px;
          height: 10px;
          margin-inline-end: 8px;
          border-radius: 2px;
          vertical-align: baseline;
        }

        .cam__warnings {
          display: grid;
          gap: 4px;
          margin: 0;
          padding: 0;
          list-style: none;
          overflow-wrap: anywhere;
        }

        .cam-tools {
          margin: 0;
          padding: 0;
          list-style: none;

          & li + li {
            border-top: 1px solid var(--border);
          }
        }

        .cam-tools__item {
          display: grid;
          grid-template-columns: 44px 1fr;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 52px;
          padding: 8px 12px;
          text-align: start;

          & b {
            color: var(--accent-text);
            font-variant-numeric: tabular-nums;
          }

          & small {
            display: block;
            color: var(--text-3);
            font-size: 12px;
            overflow-wrap: anywhere;
          }

          &:hover {
            background: var(--surface-2);
          }
        }

        .cam-tools__name {
          display: block;
          overflow-wrap: anywhere;
        }

        .export-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr));
          gap: 8px;
          padding: 12px;
        }

        .code-editor {
          display: block;
          width: 100%;
          min-height: 260px;
          padding: 10px 12px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius);
          background: var(--input);
          color: var(--text);
          font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          tab-size: 2;
          resize: vertical;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          overflow: auto;
          user-select: text;
          -webkit-user-select: text;

          &:focus {
            border-color: var(--accent);
            outline: 0;
            box-shadow: 0 0 0 2px var(--accent-soft);
          }
        }

        .console {
          max-height: 220px;
          margin: 0;
          padding: 8px 12px;
          overflow: auto;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--surface-2);
          font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          user-select: text;
          -webkit-user-select: text;

          & .is-error {
            color: var(--danger);
          }

          & .is-warn {
            color: var(--warning);
          }

          & .is-muted {
            color: var(--text-3);
          }
        }

        .addon-list {
          margin: 0;
          padding: 0;
          list-style: none;

          & li + li {
            border-top: 1px solid var(--border);
          }
        }

        .addon {
          display: grid;
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: 8px;
          padding: 10px 12px;

          & small {
            display: block;
            color: var(--text-3);
            font-size: 12px;
            overflow-wrap: anywhere;
          }
        }

        .addon__title {
          display: block;
          font-weight: 600;
          overflow-wrap: anywhere;
        }

        .addon__actions {
          display: flex;
          align-items: center;
          gap: 4px;
        }

        .perm-list {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;

          & li {
            padding: 1px 8px;
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text-2);
            font-size: 11px;
          }
        }

        .api-ref {
          display: grid;
          margin: 0;
          padding: 4px 12px 12px;

          & div {
            display: grid;
            gap: 2px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
          }

          & dt {
            font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            color: var(--accent-text);
            overflow-wrap: anywhere;
          }

          & dd {
            margin: 0;
            color: var(--text-2);
            font-size: 13px;
          }
        }
      }
    </style>

      function readJpeg(bytes) {
        let i = 2;
        while (i + 9 < bytes.length) {
          if (bytes[i] !== 255) {
            i += 1;
            continue;
          }
          const marker = bytes[i + 1] ?? 0;
          const length = (bytes[i + 2] ?? 0) << 8 | (bytes[i + 3] ?? 0);
          if (marker >= 192 && marker <= 207 && marker !== 196 && marker !== 200 && marker !== 204) {
            return {
              bytes,
              height: (bytes[i + 5] ?? 0) << 8 | (bytes[i + 6] ?? 0),
              width: (bytes[i + 7] ?? 0) << 8 | (bytes[i + 8] ?? 0),
              components: bytes[i + 9] ?? 3
            };
          }
          i += 2 + length;
        }
        throw new Error("Повреждённое изображение страницы");
      }
      function pdfText(value) {
        let hex = "FEFF";

      }
      async function pagesToPdf(pages, title) {
        const images = await Promise.all(pages.map(async (blob) => readJpeg(new Uint8Array(await blob.arrayBuffer()))));
        const encoder = new TextEncoder();
        const chunks = [];
        const offsets = [];
        let size = 0;
        const push = (part) => {
          const bytes = typeof part === "string" ? encoder.encode(part) : part;
          chunks.push(bytes);
          size += bytes.length;
        };
        const object = (id, body, stream) => {
          offsets[id] = size;
          push(`${id} 0 obj
      ${body}
      `);
          if (stream) {
            push("stream\n");
            push(stream);
            push("\nendstream\n");
          }
          push("endobj\n");
        };
        const [W, H] = A4.points;
        const pageIds = images.map((_, i) => 4 + i * 3);
        push("%PDF-1.7\n%âãÏÓ\n");
        object(1, "<< /Type /Catalog /Pages 2 0 R >>");
        object(2, `<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${images.length} >>`);
        const now = pdfDate(new Date());
        object(3, `<< /Title ${pdfText(title)} /Author ${pdfText("fBuild")} /Creator ${pdfText("fBuild")} /Producer ${pdfText("fBuild")} /CreationDate ${now} /ModDate ${now} >>`);
        images.forEach((image, i) => {
          const page = 4 + i * 3;
          const color = image.components === 1 ? "/DeviceGray" : image.components === 4 ? "/DeviceCMYK" : "/DeviceRGB";
          const content = encoder.encode(`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`);
          object(page, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${page + 1} 0 R >> >> /Contents ${page + 2} 0 R >>`);
          object(page + 1, `<< /Type /XObject /Subtype /Image /Width ${image.width} /Height ${image.height} /ColorSpace ${color} /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.bytes.length} >>`, image.bytes);
          object(page + 2, `<< /Length ${content.length} >>`, content);
        });
        const count = 4 + images.length * 3;
        const xref = size;
        push(`xref
      0 ${count}
      0000000000 65535 f 
      ${offsets.slice(1, count).map((o) => `${String(o).padStart(10, "0")} 00000 n 
      `).join("")}`);
        push(`trailer
      << /Size ${count} /Root 1 0 R /Info 3 0 R >>
      startxref
      ${xref}
      %%EOF
      `);
        return new Blob(chunks, { type: "application/pdf" });

      const WIDE = "(width > 1024px)";
      const EXIT_MS = 240;
      function useModal(open2, onClose, dock = false) {
        const ref = useRef(null);
        const [mounted, setMounted] = useState(open2);
        const closeRef = useRef(onClose);
        closeRef.current = onClose;
        useLayer(open2, () => closeRef.current());
        useEffect(() => {
          if (open2) {
            setMounted(true);
            return undefined;
          }
          ref.current?.close();
          const timer = setTimeout(() => setMounted(false), EXIT_MS);
          return () => clearTimeout(timer);
        }, [open2]);
        useLayoutEffect(() => {
          const dialog = ref.current;
          if (!open2 || !mounted || !dialog || dialog.open) return;
          dialog.setAttribute("autofocus", "");
          if (dock && matchMedia(WIDE).matches) {
            dialog.dataset.docked = "true";
            dialog.show();
          } else {
            delete dialog.dataset.docked;
            dialog.showModal();
          }
          raiseToasts();
        }, [open2, mounted, dock]);
        useEffect(() => {
          const dialog = ref.current;
          if (!dialog) return undefined;
          const onCancel = (event) => event.preventDefault();
          const onNativeClose = () => {
            if (open2) closeRef.current();
          };
          const onPointer = (event) => {
            if (event.target !== dialog) return;
            const box = dialog.getBoundingClientRect();
            const inside = event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom;
            if (!inside) closeRef.current();
          };
          dialog.addEventListener("cancel", onCancel);
          dialog.addEventListener("close", onNativeClose);
          dialog.addEventListener("click", onPointer);
          return () => {
            dialog.removeEventListener("cancel", onCancel);
            dialog.removeEventListener("close", onNativeClose);
            dialog.removeEventListener("click", onPointer);
          };
        }, [open2, mounted]);
        return { ref, mounted };
      }

      const INSETS = { top: 64, right: 16, bottom: 60, left: 42 };
      function SheetCanvas({
        sheet,
        job,
        theme,
        display,
        selected,
        onSelect,
        apiRef,
        resetKey
      }) {
        const wrap = useRef(null);
        const canvas = useRef(null);
        const view = useRef(null);
        const size = useRef({ width: 0, height: 0, dpr: 1 });
        const frame = useRef(0);
        const state = useRef({ sheet, job, theme, display, selected, onSelect });
        state.current = { sheet, job, theme, display, selected, onSelect };
        const draw = useCallback(() => {
          cancelAnimationFrame(frame.current);
          frame.current = requestAnimationFrame(() => {
            const node = canvas.current;
            const v = view.current;
            const s = state.current;
            if (!node || !v) return;
            const { width, height, dpr } = size.current;
            const ctx = node.getContext("2d");
            if (!ctx) return;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);
            drawSheet(ctx, {
              sheet: s.sheet,
              job: s.job,
              palette: { ...PALETTES[s.theme], background: null },
              display: s.display,
              view: v,
              selected: s.selected,
              textScale: TEXT_SCALE[s.display.text]
            });
          });
        }, []);
        const fitScale = useCallback(() => {
          const { width, height } = size.current;
          const s = state.current.sheet;
          if (!width || !height) return 1;
          return Math.max(0.01, Math.min((width - INSETS.left - INSETS.right) / s.w, (height - INSETS.top - INSETS.bottom) / s.h));
        }, []);
        const fit = useCallback(() => {
          const { width, height } = size.current;
          const s = state.current.sheet;
          if (!width) return;
          const scale = fitScale();
          view.current = {
            scale,
            x: INSETS.left + (width - INSETS.left - INSETS.right - s.w * scale) / 2,
            y: INSETS.top + (height - INSETS.top - INSETS.bottom - s.h * scale) / 2
          };
          draw();
        }, [draw, fitScale]);
        const zoomAt = useCallback(
          (factor, px, py) => {
            const v = view.current;
            if (!v) return;
            const base = fitScale();
            const scale = clamp(v.scale * factor, base * 0.5, Math.max(base * 40, 6));
            const ratio = scale / v.scale;
            view.current = { scale, x: px - (px - v.x) * ratio, y: py - (py - v.y) * ratio };
            draw();
          },
          [draw, fitScale]
        );
        useEffect(() => {
          apiRef.current = { fit, zoom: (factor) => zoomAt(factor, size.current.width / 2, size.current.height / 2) };
        }, [apiRef, fit, zoomAt]);
        useLayoutEffect(() => {
          const node = wrap.current;
          const c = canvas.current;
          if (!node || !c) return undefined;
          const observer = new ResizeObserver(([entry2]) => {
            if (!entry2) return;
            const { width, height } = entry2.contentRect;
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const first = !size.current.width;
            size.current = { width, height, dpr };
            c.width = Math.round(width * dpr);
            c.height = Math.round(height * dpr);
            c.style.width = `${width}px`;
            c.style.height = `${height}px`;
            if (first || !view.current) fit();
            else draw();
          });
          observer.observe(node);
          return () => {
            observer.disconnect();
            cancelAnimationFrame(frame.current);
          };
        }, [draw, fit]);
        useEffect(() => fit(), [resetKey, fit]);
        useEffect(() => draw(), [sheet, job, theme, display, selected, draw]);
        useEffect(() => {
          const c = canvas.current;
          if (!c) return undefined;
          const pointers = new Map();
          let gesture = null;
          let lastTap = null;
          const local = (e) => {
            const rect = c.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
          };
          const startPan = (point) => {
            if (view.current) gesture = { type: "pan", start: point, view: { ...view.current }, moved: false, time: performance.now() };
          };
          const onDown = (e) => {
            if (!view.current) return;
            c.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, local(e));
            if (pointers.size === 1) startPan(local(e));
            if (pointers.size === 2) {
              const [a, b] = [...pointers.values()];
              gesture = { type: "pinch", distance: Math.hypot(a.x - b.x, a.y - b.y) || 1, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, view: { ...view.current } };
            }
          };
          const onMove = (e) => {
            if (!pointers.has(e.pointerId) || !gesture) return;
            pointers.set(e.pointerId, local(e));
            if (gesture.type === "pan") {
              const p = pointers.get(e.pointerId) ?? gesture.start;
              const dx = p.x - gesture.start.x;
              const dy = p.y - gesture.start.y;
              if (!gesture.moved && Math.hypot(dx, dy) < 6) return;
              gesture.moved = true;
              view.current = { ...gesture.view, x: gesture.view.x + dx, y: gesture.view.y + dy };
              draw();
            } else if (pointers.size >= 2) {
              const [a, b] = [...pointers.values()];
              const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
              const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
              const base = fitScale();
              const scale = clamp(gesture.view.scale * distance / gesture.distance, base * 0.5, Math.max(base * 40, 6));
              const mmX = (gesture.mid.x - gesture.view.x) / gesture.view.scale;
              const mmY = (gesture.mid.y - gesture.view.y) / gesture.view.scale;
              view.current = { scale, x: mid.x - mmX * scale, y: mid.y - mmY * scale };
              draw();
            }
          };
          const onUp = (e) => {
            if (!pointers.has(e.pointerId)) return;
            const point = local(e);
            pointers.delete(e.pointerId);
            if (gesture?.type === "pan" && !gesture.moved && performance.now() - gesture.time < 400 && view.current) {
              const now = performance.now();
              if (lastTap && now - lastTap.time < 320 && Math.hypot(point.x - lastTap.x, point.y - lastTap.y) < 28) {
                lastTap = null;
                if (view.current.scale > fitScale() * 1.4) fit();
                else zoomAt(2.5, point.x, point.y);
              } else {
                lastTap = { ...point, time: now };
                const v = view.current;
                state.current.onSelect(hitTestSheet(state.current.sheet, (point.x - v.x) / v.scale, (point.y - v.y) / v.scale));
              }
            }
            const rest = [...pointers.values()][0];
            if (pointers.size === 1 && rest) startPan(rest);
            else if (pointers.size === 0) gesture = null;
          };
          const onWheel = (e) => {
            e.preventDefault();
            const p = local(e);
            zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
          };
          c.addEventListener("pointerdown", onDown);
          c.addEventListener("pointermove", onMove);
          c.addEventListener("pointerup", onUp);
          c.addEventListener("pointercancel", onUp);
          c.addEventListener("wheel", onWheel, { passive: false });
          return () => {
            c.removeEventListener("pointerdown", onDown);
            c.removeEventListener("pointermove", onMove);
            c.removeEventListener("pointerup", onUp);
            c.removeEventListener("pointercancel", onUp);
            c.removeEventListener("wheel", onWheel);
          };
        }, [draw, fit, fitScale, zoomAt]);
        return html`<div className="viewport__canvas" ref=${wrap}>
          <canvas ref=${canvas} role="img" aria-label="Карта раскроя листа" />
        </div>`;
      }

      function SheetThumb({ sheet, job, theme, active, onClick }) {
        const ref = useRef(null);
        useEffect(() => {
          const canvas = ref.current;
          const ctx = canvas?.getContext("2d");
          if (!canvas || !ctx) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 3);
          const width = 84;
          const height = 54;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, width, height);
          const scale = Math.min((width - 4) / sheet.w, (height - 4) / sheet.h);
          drawSheet(ctx, { sheet, job, palette: PALETTES[theme], display: { edges: false }, view: { scale, x: (width - sheet.w * scale) / 2, y: (height - sheet.h * scale) / 2 }, compact: true });
        }, [sheet, job, theme]);
        return html`<button type="button" className=${classNames("thumb", active && "is-active")} onClick=${onClick} aria-current=${active || undefined} aria-label=${`${sheetLabel(sheet)}, заполнение ${percent(sheet.util, 0)}`}>
          ${sheet.count > 1 && html`<span className="thumb__count">×${sheet.count}</span>`}
          <canvas ref=${ref} style=${{ width: 84, height: 54 }} />

            <b>

      }
      function MaterialCard({
        material,
        index,
        uses,
        removable,
        currency,
        onChange,
        onRemove
      }) {

          </div>
        </div>`;
      }
      function EdgeCard({
        edge,
        uses,
        currency,
        onChange,
        onRemove
      }) {
        return html`<div className="card">
          <div className="card__head">
            <span className="card__swatch" style=${{ background: edge.color }} />
            <span className="card__title">
              <b>${edgeTitle(edge)}</b>
              <small>
                ${edgeSize(edge)} · ${uses} стор.
              </small>
            </span>
            <${IconButton} icon="trash-2" label="Удалить кромку" variant="danger" onClick=${onRemove} />
          </div>
          <div className="grid-2">
            <${TextInput} label="Тип" value=${edge.name} maxLength=${40} placeholder="ПВХ" onChange=${(name) => onChange({ name })} />
            <${TextInput} label="Декор / цвет" value=${edge.decor} maxLength=${60} placeholder="Белый W980" onChange=${(decor) => onChange({ decor })} />
          </div>
          <div className="grid-3">
            <${NumberInput} label="Толщина" unit="мм" min=${0.1} max=${5} value=${edge.thickness} onChange=${(thickness) => onChange({ thickness })} />
            <${NumberInput} label="Ширина" unit="мм" min=${10} max=${100} value=${edge.width} onChange=${(width) => onChange({ width })} />
            <${NumberInput} label="Цена за м" unit=${currency} max=${1_000_000} value=${edge.price} onChange=${(price) => onChange({ price })} />
          </div>
          <${Field} label="Цвет на схемах">
            <${ColorPicker} value=${edge.color} colors=${EDGE_COLORS} onChange=${(color) => onChange({ color })} />
          <//>
        </div>`;
      }

      const opposite = (edge) => edge === 0 ? 1 : edge === 1 ? 0 : edge === 2 ? 3 : 2;
      function autoCount(length, endOffset, step) {
        const span = Math.max(0, length - 2 * endOffset);
        return clamp(Math.floor(span / step) + 1, 2, 24);
      }
      function positionsAlong(length, count, endOffset) {
        if (count <= 1) return [length / 2];
        const step = (length - 2 * endOffset) / (count - 1);
        return Array.from({ length: count }, (_, i) => round(endOffset + i * step, 2));
      }
      const presetBase = (d, T, patch) => ({
        mode: "",
        edge: 2,
        count: 0,
        endOffset: d.confirmatEnd,
        lineOffset: T / 2,
        pins: false,
        spacing: 0,
        ...patch
      });
      const FIELDS = {
        edge: true,
        count: true,
        endOffset: true,
        lineOffset: "От кромки",
        pins: false,
        spacing: null
      };
      const FURNITURE_PRESETS = [
        {
          id: "confirmat",
          name: "Конфирмат 7×50",
          hint: "Пласть Ø7 с зенковкой · торец Ø5 × 50",
          modes: [
            { id: "face", label: "Пласть" },
            { id: "edge", label: "Торец" }
          ],
          fields: FIELDS,
          defaults: (d, T) => presetBase(d, T, { mode: "face", endOffset: d.confirmatEnd }),
          lineOffsetFor: (mode, T) => mode === "face" ? T / 2 : 0,
          countFor: (length, endOffset) => autoCount(length, endOffset, 350),
          generate: ({ mode, edge, positions, lineOffset, T }) => mode === "face" ? positions.map((t) => ({
            edge,
            t,
            inset: lineOffset,
            face: "A",
            purpose: "confirmat",
            d: 7,
            depth: T,
            through: true,
            hardware: true,
            form: "countersink",
            csD: 10,
            csAngle: 90
          })) : positions.map((t) => ({
            edge,
            t,
            inset: 0,
            face: `e${edge}`,
            purpose: "confirmat",
            d: 5,
            depth: 50
          }))
        },
        {
          id: "hinge",
          name: "Петля 35 мм",
          hint: "Чашка Ø35 × 12,5 · планка 37/32",
          modes: [
            { id: "cup", label: "Фасад (чашка)" },
            { id: "plate", label: "Корпус (планка)" }
          ],
          fields: { ...FIELDS, pins: true, lineOffset: "От кромки до оси" },
          defaults: (d, T) => presetBase(d, T, { mode: "cup", endOffset: d.hingeEnd, lineOffset: d.hingeInset }),
          lineOffsetFor: (mode, _T, d) => mode === "cup" ? d.hingeInset : d.plateLine,
          countFor: (length) => length <= 900 ? 2 : length <= 1600 ? 3 : length <= 2000 ? 4 : 5,
          generate: ({ mode, edge, positions, lineOffset, pins }) => {
            const holes = [];
            for (const t of positions) {
              if (mode === "cup") {
                holes.push({ edge, t, inset: lineOffset, face: "A", purpose: "hinge-cup", d: 35, depth: 12.5, hardware: true });
                if (pins) {
                  holes.push({ edge, t: t - 22.5, inset: lineOffset + 9.5, face: "A", purpose: "hinge-pin", d: 8, depth: 11 });
                  holes.push({ edge, t: t + 22.5, inset: lineOffset + 9.5, face: "A", purpose: "hinge-pin", d: 8, depth: 11 });
                }
              } else {
                for (const shift of [-16, 16]) {
                  holes.push({
                    edge,
                    t: t + shift,
                    inset: lineOffset,
                    face: "A",
                    purpose: "hinge-plate",
                    d: 5,
                    depth: 12,
                    form: "threaded",
                    thread: "euro"
                  });
                }
              }
            }
            return holes;
          }
        },
        {
          id: "minifix",
          name: "Минификс 15",
          hint: "Эксцентрик Ø15 · тяга Ø8 × 34 в торец",
          modes: [
            { id: "cam", label: "Деталь (эксцентрик)" },
            { id: "stem", label: "Корпус (шток)" }
          ],
          fields: FIELDS,
          defaults: (d, T) => presetBase(d, T, { mode: "cam", lineOffset: d.minifixInset }),
          lineOffsetFor: (mode, T, d) => mode === "cam" ? d.minifixInset : T / 2,
          countFor: (length, endOffset) => autoCount(length, endOffset, 350),
          generate: ({ mode, edge, positions, lineOffset }) => positions.flatMap(
            (t) => mode === "cam" ? [
              { edge, t, inset: lineOffset, face: "A", purpose: "minifix", d: 15, depth: 13, hardware: true },
              { edge, t, inset: 0, face: `e${edge}`, purpose: "minifix-rod", d: 8, depth: 34 }
            ] : [{ edge, t, inset: lineOffset, face: "A", purpose: "minifix-rod", d: 5, depth: 12 }]
          )
        },
        {
          id: "dowel",
          name: "Шкант 8×30",
          hint: "Торец Ø8 × 16 · пласть Ø8 × 12",
          modes: [
            { id: "edge", label: "Торец" },
            { id: "face", label: "Пласть" }
          ],
          fields: FIELDS,
          defaults: (d, T) => presetBase(d, T, { mode: "edge", endOffset: d.dowelEnd }),
          lineOffsetFor: (mode, T) => mode === "face" ? T / 2 : 0,
          countFor: (length, endOffset) => autoCount(length, endOffset, 250),
          generate: ({ mode, edge, positions, lineOffset }) => positions.map(
            (t) => mode === "edge" ? { edge, t, inset: 0, face: `e${edge}`, purpose: "dowel", d: 8, depth: 16, hardware: true } : { edge, t, inset: lineOffset, face: "A", purpose: "dowel", d: 8, depth: 12 }
          )
        },
        {
          id: "system32",
          name: "Система 32",
          hint: "Линии Ø5 × 12 с шагом 32 мм",
          modes: [
            { id: "both", label: "Две линии" },
            { id: "front", label: "Передняя" }
          ],
          fields: { ...FIELDS, count: false, endOffset: true, lineOffset: "Линия от кромки" },
          defaults: (d, T) => presetBase(d, T, { mode: "both", endOffset: 192, lineOffset: d.system32Line, spacing: d.system32Step }),
          lineOffsetFor: (_mode, _T, d) => d.system32Line,
          countFor: (length, endOffset, params) => Math.max(1, Math.floor((length - 2 * endOffset) / (params.spacing || 32)) + 1),
          generate: ({ mode, edge, length, endOffset, lineOffset, spacing }) => {
            const step = spacing || 32;
            const holes = [];
            for (let t = endOffset; t <= length - endOffset + 0.01; t += step) {
              holes.push({ edge, t: round(t, 2), inset: lineOffset, face: "A", purpose: "custom", d: 5, depth: 12 });
              if (mode === "both") {
                holes.push({ edge: opposite(edge), t: round(t, 2), inset: lineOffset, face: "A", purpose: "custom", d: 5, depth: 12 });
              }
            }
            return holes;
          }
        },
        {
          id: "shelfPin",
          name: "Полкодержатель",
          hint: "Ø5 × 12 · по 4 на полку",
          modes: [{ id: "pins", label: "Под полку" }],
          fields: { ...FIELDS, endOffset: true, lineOffset: "Линия от кромки" },
          defaults: (d, T) => presetBase(d, T, { mode: "pins", edge: 0, endOffset: 400, lineOffset: d.system32Line }),
          lineOffsetFor: (_mode, _T, d) => d.system32Line,
          countFor: (length, endOffset) => autoCount(length, endOffset, 400),
          generate: ({ edge, positions, lineOffset }) => positions.flatMap((t) => [
            { edge, t, inset: lineOffset, face: "A", purpose: "shelf-pin", d: 5, depth: 12, hardware: true },

          const dpr = Math.min(window.devicePixelRatio || 1, 3);
          node.width = Math.round(width * dpr);
          node.height = Math.round(height * dpr);
          const ctx = node.getContext("2d");
          if (!ctx) return;
          const palette = PALETTES[theme];
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = palette.background ?? "#000";
          ctx.fillRect(0, 0, width, height);
          if (view) drawPartSchematic(ctx, { part, edges, view, palette, selectedId: selectedId ?? null, numbers: part.holes.length <= 60 });
        }, [part, edges, view, theme, selectedId, width, height]);
        return html`<div className="schematic" ref=${wrap} style=${{ height }}>
          <canvas
            ref=${canvas}
            role="img"
            aria-label=${`Схема детали ${part.L} × ${part.W} мм`}
            style=${{ width: "100%", height }}
            onClick=${(event) => {
              if (!view || !onTap) return;
              const rect = event.currentTarget.getBoundingClientRect();
              const hit = hitTestSchematic(part, view, event.clientX - rect.left, event.clientY - rect.top);
              if (hit) {
                onTap(hit);
              }
            }}
          />
          ${!valid && html`<div className="schematic__empty">Укажите размеры детали</div>`}
        </div>`;
      }

      function operationMeta(op) {
        switch (op.type) {
          case "radius":
            return `${ANCHORS[op.anchor]} · R${fmt(op.r, 1)}`;
          case "chamfer":
            return `${ANCHORS[op.anchor]} · ${fmt(op.r, 1)} × 45°`;
          case "notch":
            return `${ANCHORS[op.anchor]} · ${fmt(op.w, 1)} × ${fmt(op.h, 1)}`;
          case "groove":
          case "rebate":
          case "edgeGroove":
            return `${EDGE_SIDES[op.edge]?.short ?? ""} · ${fmt(op.width, 1)} × ${fmt(op.depth, 1)}${op.type === "groove" ? ` · от кромки ${fmt(op.offset, 1)}` : ""}`;
          case "circle":
            return `${ANCHORS[op.anchor]} · Ø${fmt(op.w, 1)} · ${op.through ? "насквозь" : `глуб. ${fmt(op.depth, 1)}`}`;
          case "rect":
            return `${ANCHORS[op.anchor]} · ${fmt(op.w, 1)} × ${fmt(op.h, 1)} · ${op.through ? "насквозь" : `глуб. ${fmt(op.depth, 1)}`}`;
          case "frame":
            return `отступ ${fmt(op.offset, 1)} · R${fmt(op.r, 1)} · глуб. ${fmt(op.depth, 1)}`;
        }
      }
      function DrillingPanel({

        const update = (patch) => {
          const next = snapToFace({ ...hole, ...patch }, part);
          onPatch({ holes: part.holes.map((h) => h.id === hole.id ? next : h) });
        };
        const remove = () => {
          onPatch({ holes: part.holes.filter((h) => h.id !== hole.id) });
          onClose();
        };
        const removeGroup = async () => {
          const members = part.holes.filter((h) => h.group === hole.group);
          const ok = await ui.confirm({
            title: "Удалить пакет?",
            message: `${groupLabel(hole.group, [...new Set(members.map((h) => HOLE_PURPOSES.find((p) => p.id === h.purpose)?.label ?? ""))])} — ${members.length} отв.`,

            danger: true
          });
          if (!ok) return;
          onPatch({ holes: part.holes.filter((h) => h.group !== hole.group) });
          onClose();
        };
        const makePattern = () => {
          const copies = linearPattern(hole, pattern.count, pattern.stepX, pattern.stepY);
          onPatch({ holes: [...part.holes.filter((h) => h.id !== hole.id), ...copies] });
          ui.notify(`Создан массив: ${copies.length} отв.`, "success", "Массив");

        return html`<${Sheet}
          open

          footer=${html`<${Fragment}>
            <${IconButton} icon="trash-2" label="Удалить отверстие" variant="danger" onClick=${remove} />
            ${hole.group && html`<${Button} variant="ghost" onClick=${removeGroup}>
              Удалить пакет

            <${Button} variant="primary" onClick=${onClose}>
              Готово

          <//>`}

          <div className="form">

            <${Field} label="Назначение">
              <${ChipSelect}
                label="Назначение"
                value=${hole.purpose}
                options=${HOLE_PURPOSES.map((p) => ({ value: p.id, label: p.label, color: p.color }))}
                onChange=${(purpose) => update({ purpose })}

            <//>
            <${Field} label="Форма отверстия">
              <${Segmented} label="Форма" value=${hole.form} options=${HOLE_FORMS.map((f) => ({ value: f.id, label: f.label }))} onChange=${(form) => update({ form })} />

              <${NumberInput} label="Y от нижнего края" unit="мм" min=${-10_000} max=${part.W} value=${hole.y} disabled=${locked === "y"} onChange=${(y) => update({ y })} />

            ${edge && html`<${NumberInput} label="Ось от пласти A" unit="мм" max=${T} value=${hole.z} hint=${`Толщина ${fmt(T, 1)} мм — по центру ${fmt(T / 2, 1)} мм`} onChange=${(depth) => update({ z: depth })} />`}
            ${hole.form === "threaded" && html`<${Field} label="Резьба">

              <${NumberInput}
                label="Глубина"
                unit="мм"
                min=${0.1}

              <${NumberInput} label="Шаг X" unit="мм" min=${-5000} max=${5000} value=${pattern.stepX} onChange=${(stepX) => setPattern((p) => ({ ...p, stepX }))} />
              <${NumberInput} label="Шаг Y" unit="мм" min=${-5000} max=${5000} value=${pattern.stepY} onChange=${(stepY) => setPattern((p) => ({ ...p, stepY }))} />
            </div>
            <${Button} variant="secondary" icon="copy-plus" onClick=${makePattern} disabled=${!pattern.stepX && !pattern.stepY}>
              Создать массив из ${pattern.count} отв.
            <//>
          </div>
        <//>`;
      }

      function defaultsFor(type, op, part, T) {
        switch (type) {
          case "radius":
          case "chamfer":
            return { anchor: CORNER_ANCHORS.includes(op.anchor) ? op.anchor : 8, r: op.r > 0 ? op.r : 20 };
          case "notch":
            return { anchor: CORNER_ANCHORS.includes(op.anchor) ? op.anchor : 8, w: Math.min(100, part.L / 4), h: Math.min(60, part.W / 4) };
          case "groove":
            return { edge: op.edge, offset: 12, width: 4, depth: Math.min(8, T / 2), face: "A", start: 0, end: 0 };
          case "rebate":
            return { edge: op.edge, width: 10, depth: Math.min(8, T / 2), face: "A", start: 0, end: 0 };
          case "edgeGroove":
            return { edge: op.edge, offset: Math.max(0, (T - 4) / 2), width: Math.min(4, T), depth: 10, start: 0, end: 0 };
          case "circle":
            return { w: Math.min(60, part.W / 3), anchor: 4, dx: 0, dy: 0, through: true };
          case "rect":
            return { w: Math.min(100, part.L / 4), h: Math.min(100, part.W / 4), through: true };
          case "frame":
            return { offset: Math.min(60, Math.min(part.L, part.W) / 5), r: 20, width: 6, depth: Math.min(3, T / 4), face: "A", through: false };
        }
      }
      function OperationSheet({

          onPatch({ operations: part.operations.filter((o) => o.id !== op.id) });
          onClose();

        const corner = isCornerOperation(op.type);
        const along = op.type === "groove" || op.type === "rebate" || op.type === "edgeGroove";

        const offsetMin = -10_000;
        return html`<${Sheet}
          open
          size="lg"

              <${Field} label=${`Кромка · длина ${fmt(length)} мм`}>
                <${Segmented} label="Кромка" size="sm" value=${op.edge} options=${EDGE_SIDES.map((s) => ({ value: s.id, label: s.short }))} onChange=${(edge) => update({ edge })} />

      const SVG = "http://www.w3.org/2000/svg";
      let host = null;

      function icon(name) {
        if (!name) return Object.assign(document.createElement("span"), { className: "menu__spacer" });
        const svg = document.createElementNS(SVG, "svg");
        svg.setAttribute("class", "icon");
        svg.setAttribute("width", "16");
        svg.setAttribute("height", "16");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS(SVG, "use");
        use.setAttribute("href", `#i-${name}`);
        svg.append(use);
        return svg;
      }
      function ensureHost() {
        if (host) return host;
        const el = document.createElement("div");
        el.className = "menu";
        el.setAttribute("role", "menu");
        el.popover = "auto";
        el.addEventListener("toggle", (event) => {
          if (event.newState === "closed") restore?.focus({ preventScroll: true });
        });
        el.addEventListener("keydown", (event) => {
          if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const buttons = [...el.querySelectorAll("button:not(:disabled)")];
          const index = buttons.indexOf(document.activeElement);
          const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 : (index + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
          buttons[next]?.focus();
        });
        host = el;
        return el;
      }
      function showMenu(items, anchor) {
        const el = ensureHost();
        if (el.matches(":popover-open")) el.hidePopover();
        restore = document.activeElement instanceof HTMLElement ? document.activeElement : null;
        const modals = [...document.querySelectorAll("dialog[open]")].filter((d) => d.matches(":modal"));
        (modals.at(-1) ?? document.body).append(el);
        el.replaceChildren(
          ...items.map((item) => {
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("role", "menuitem");
            button.className = classNames("menu__item", item.danger && "is-danger", item.divider && "has-divider");
            button.disabled = Boolean(item.disabled);
            const label = Object.assign(document.createElement("span"), { className: "menu__label", textContent: item.label });
            button.append(icon(item.icon), label);
            if (item.shortcut && hasKeyboard()) button.append(Object.assign(document.createElement("kbd"), { className: "menu__shortcut", textContent: item.shortcut }));
            button.addEventListener("click", () => {
              el.hidePopover();
              haptic.select();
              item.onSelect();
            });
            return button;
          })
        );
        el.showPopover();
        const box = anchor instanceof Element ? anchor.getBoundingClientRect() : new DOMRect(anchor.x, anchor.y, 0, 0);
        const width = el.offsetWidth;
        const height = el.offsetHeight;
        const preferred = anchor instanceof Element ? box.right - width : box.left;
        const left = Math.max(8, Math.min(preferred, innerWidth - width - 8));
        const below = box.bottom + 4;
        const top = below + height > innerHeight - 8 ? Math.max(8, box.top - height - 4) : below;
        el.style.left = `${left}px`;
        el.style.top = `${top}px`;
        el.querySelector("button:not(:disabled)")?.focus({ preventScroll: true });
      }
      function useContextMenu(items) {
        const timer = useRef(null);
        const origin = useRef(null);
        const fired = useRef(false);
        const cancel = useCallback(() => {
          if (timer.current) clearTimeout(timer.current);
          timer.current = null;
        }, []);
        useEffect(() => cancel, [cancel]);
        return {
          onContextMenu: (event) => {
            event.preventDefault();
            cancel();
            showMenu(items(), { x: event.clientX, y: event.clientY });
          },
          onPointerDown: (event) => {
            fired.current = false;
            if (event.pointerType === "mouse") return;
            origin.current = { x: event.clientX, y: event.clientY };
            cancel();
            timer.current = setTimeout(() => {
              fired.current = true;
              haptic.impact("medium");
              if (origin.current) showMenu(items(), origin.current);
            }, 520);
          },
          onPointerMove: (event) => {
            if (origin.current && Math.hypot(event.clientX - origin.current.x, event.clientY - origin.current.y) > 8) cancel();
          },
          onPointerUp: cancel,
          onPointerCancel: cancel,
          onClickCapture: (event) => {
            if (!fired.current) return;
            fired.current = false;
            event.preventDefault();
            event.stopPropagation();
          }
        };
      }

      function slotMaterial(project, slot) {
        const [first, second] = project.materials;
        const thin = project.materials.find((m) => m.T <= 6);
        const thick = project.materials.find((m) => m.T > 6) ?? first;
        if (slot === "back") return (thin ?? thick)?.id ?? "";
        if (slot === "facade") return (project.materials.filter((m) => m.T > 6)[1] ?? second ?? thick)?.id ?? "";
        return thick?.id ?? "";
      }
      function edgeRef2(project, code) {
        if (code < 0) return "";
        const sorted = [...project.edgeMaterials].sort((a, b) => a.thickness - b.thickness);
        return (code === 0 ? sorted[0] : sorted.at(-1) ?? sorted[0])?.id ?? "";
      }
      function instantiateBuiltin(project, template) {
        const product = createProduct({
          name: uniqueName(project, template.name),
          variables: template.variables.map(([name, expr, note]) => createVariable(name, expr, note))
        });
        const parts = template.parts.map(
          (t) => createPart({
            name: t.name,
            role: t.role,
            group: defaultGroup(t.role),
            product: product.id,
            material: slotMaterial(project, t.slot),
            formula: { L: t.L, W: t.W },
            qty: t.qty,
            grain: t.grain ?? true,
            edges: t.edges.map((c) => edgeRef2(project, c))
          })
        );
        return { product, parts };
      }
      function uniqueName(project, base) {
        const names = new Set(project.products.map((p) => p.name));
        if (!names.has(base)) return base;
        for (let i = 2; ; i += 1) if (!names.has(`${base} ${i}`)) return `${base} ${i}`;
      }
      function captureTemplate(project, productId) {
        const product = project.products.find((p) => p.id === productId);
        const materialIndex = new Map(project.materials.map((m, i) => [m.id, i]));
        const edgeIndex = new Map(project.edgeMaterials.map((e, i) => [e.id, i]));
        return {
          variables: (product?.variables ?? []).map(({ name, expr, note }) => ({ name, expr, note })),
          parts: project.parts.filter((p) => p.product === productId).map(({ material, edges, product: _, ...rest }) => ({
            ...rest,
            materialIndex: materialIndex.get(material) ?? 0,
            edgeIndexes: edges.map((e) => e ? edgeIndex.get(e) ?? -1 : -1)
          }))
        };
      }
      function instantiateUser(project, name, payload) {
        const product = createProduct({ name: uniqueName(project, name), variables: payload.variables.map((v) => ({ id: uid(), ...v })) });
        const fallback = project.materials[0]?.id ?? "";
        const parts = payload.parts.map(
          ({ materialIndex, edgeIndexes, ...rest }) => clonePart({
            ...rest,
            product: product.id,
            material: project.materials[materialIndex]?.id ?? fallback,
            edges: edgeIndexes.map((i) => i >= 0 ? project.edgeMaterials[i]?.id ?? "" : "")
          })
        );
        return { product, parts };
      }

      const NAME = `${CONFIG.storagePrefix}-db`;
      const VERSION = 2;
      let opening = null;
      const done = (request) => new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error ?? new Error("IndexedDB"));
      });
      function open() {
        opening ??= new Promise((resolve, reject) => {
          if (!("indexedDB" in globalThis)) {
            reject(new AppError("Хранилище устройства недоступно", "storage", false));
            return;
          }
          const request = indexedDB.open(NAME, VERSION);
          request.onupgradeneeded = (event) => {
            const db2 = request.result;
            if (event.oldVersion < 1) {
              db2.createObjectStore("projects", { keyPath: "id" });
              db2.createObjectStore("versions", { keyPath: "key", autoIncrement: true }).createIndex("projectId", "projectId");
              db2.createObjectStore("stock", { keyPath: "id" });
              db2.createObjectStore("templates", { keyPath: "id" });
            }
            if (event.oldVersion < 2 && !db2.objectStoreNames.contains("scripts")) db2.createObjectStore("scripts", { keyPath: "id" });
          };
          request.onsuccess = () => {
            const db2 = request.result;
            db2.onversionchange = () => {
              db2.close();
              opening = null;
            };
            resolve(db2);
          };
          request.onerror = () => {
            opening = null;
            reject(new AppError("Не удалось открыть хранилище устройства", "storage", true));
          };
          request.onblocked = () => reject(new AppError("Хранилище занято другой вкладкой", "storage", true));
        });
        return opening;
      }
      async function run(store, mode, body) {
        const db2 = await open();
        const tx = db2.transaction(store, mode);
        const complete = new Promise((resolve, reject) => {
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error ?? new Error("IndexedDB"));
          tx.onabort = () => reject(tx.error ?? new Error("IndexedDB"));
        });
        const result = body(tx.objectStore(store));
        const [value] = await Promise.all([result instanceof IDBRequest ? done(result) : result, complete]);
        return value;
      }
      const db = {
        get(store, key) {
          return run(store, "readonly", (os) => os.get(key));
        },
        all(store) {
          return run(store, "readonly", (os) => os.getAll());
        },
        put(store, value) {
          return run(store, "readwrite", (os) => os.put(value));
        },
        delete(store, key) {
          return run(store, "readwrite", (os) => os.delete(key));
        },
        versions(projectId) {
          return run("versions", "readonly", (os) => os.index("projectId").getAll(projectId));
        },
        async dropVersions(projectId, keep) {
          const list = (await db.versions(projectId)).sort((a, b) => b.at - a.at);
          const stale = list.slice(keep).flatMap((v) => v.key === undefined ? [] : [v.key]);
          if (!stale.length) return;
          await run("versions", "readwrite", async (os) => {
            await Promise.all(stale.map((key) => done(os.delete(key))));
            return undefined;
          });
        }
      };

            return { ...state, materials: [...state.materials, createMaterial(action.material)] };

          case "material/remove": {
            const rest = state.materials.filter((m) => m.id !== action.id);
            const fallback = rest[0];
            if (!fallback) return state;
            return {
              ...state,
              materials: rest,
              parts: state.parts.map((p) => p.material === action.id ? { ...p, material: fallback.id } : p)
            };
          }
          case "edge/add":
            if (state.edgeMaterials.length >= CONFIG.limits.edgeMaterials) return state;

          case "part/add":
            return freeSlots(state) > 0 ? { ...state, parts: [...state.parts, action.part] } : state;
          case "part/update":
            return { ...state, parts: state.parts.map((p) => p.id === action.id ? { ...p, ...action.patch } : p) };
          case "part/remove":
            return { ...state, parts: state.parts.filter((p) => p.id !== action.id) };
          case "part/duplicate": {
            const index = state.parts.findIndex((p) => p.id === action.id);

          case "parts/append":

          case "parts/replace":

          case "parts/remove-many": {

          case "parts/duplicate-many": {
            const ids = new Set(action.ids);
            let free = freeSlots(state);
            const parts = [];
            for (const part of state.parts) {
              parts.push(part);
              if (ids.has(part.id) && free > 0) {

      const CHUNK = 4000;

        name: z.string().max(200),

      const TRANSIENT_DELAYS = [250, 800, 2000];
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      async function call(method) {
        let lastError = "";
        for (let attempt = 0; attempt <= TRANSIENT_DELAYS.length; attempt += 1) {
          try {
            return await new Promise((resolve, reject) => {
              try {
                method((error, value) => error ? reject(new Error(String(error))) : resolve(value));
              } catch (error) {
                reject(error instanceof Error ? error : new Error(String(error)));
              }
            });
          } catch (error) {
            lastError = error instanceof Error ? error.message : String(error);
            if (/KEY_INVALID|VALUE_INVALID|KEYS_INVALID|UNSUPPORTED/i.test(lastError)) break;
            const delay = TRANSIENT_DELAYS[attempt];
            if (delay === undefined) break;
            await sleep(delay);
          }
        }
        throw new AppError(`Облако Telegram недоступно${lastError ? `: ${lastError}` : ""}`, "network");
      }
      async function pool(items, task) {
        let next = 0;
        const workers = Array.from({ length: Math.min(PARALLEL, items.length) }, async () => {
          while (next < items.length) {
            const item = items[next++];
            await task(item);
          }
        });
        await Promise.all(workers);
      }
      function batches(items, size = BATCH) {
        const out = [];
        for (let i = 0; i < items.length; i += size) out.push(items.slice(i, i + size));
        return out;
      }
      function generation() {
        const bytes = crypto.getRandomValues(new Uint8Array(6));
        return Array.from(bytes, (b) => (b % 36).toString(36)).join("");

      function parseJson(schema, text3) {
        if (!text3) return null;
        try {
          const parsed = schema.safeParse(JSON.parse(text3));
          return parsed.success ? parsed.data : null;
        } catch {
          return null;
        }
      }
      function readOrphans() {
        try {
          const value = JSON.parse(localStorage.getItem(ORPHANS) ?? "{}");
          return value && typeof value === "object" ? value : {};
        } catch {
          return {};
        }
      }
      function writeOrphans(value) {
        try {
          localStorage.setItem(ORPHANS, JSON.stringify(value));
        } catch {

        }
      }
      class CloudStore {
        queue = Promise.resolve();
        migrated = false;
        get storage() {
          return webApp().CloudStorage;
        }
        enqueue(task) {
          const result = this.queue.then(task);
          this.queue = result.catch(() => undefined);
          return result;
        }
        async keys() {
          return await call((cb) => this.storage.getKeys(cb)) ?? [];
        }
        async getMany(keys) {
          const out = {};
          for (const group of batches(keys)) {
            Object.assign(out, await call((cb) => this.storage.getItems(group, cb)) ?? {});
          }
          return out;
        }
        async removeMany(keys) {
          for (const group of batches(keys)) await call((cb) => this.storage.removeItems(group, cb));
        }
        async set(key, value) {
          await call((cb) => this.storage.setItem(key, value, cb));
        }
        async readMeta(id) {
          const value = await call((cb) => this.storage.getItem(metaKey(id), cb)) ?? "";

        async readBody(id, meta) {
          const keys = Array.from({ length: meta.n }, (_, i) => chunkKey(id, meta.g, i));
          const values = await this.getMany(keys);

      function ToolpathCanvas({ program, machine, theme, progress }) {
        const wrap = useRef(null);
        const canvas = useRef(null);
        const [size, setSize] = useState({ width: 0, height: 0 });
        useLayoutEffect(() => {
          const el = wrap.current;
          if (!el) return undefined;
          const observer = new ResizeObserver(([entry2]) => {
            const box = entry2?.contentRect;
            if (box) setSize({ width: Math.round(box.width), height: Math.round(box.height) });
          });
          observer.observe(el);
          return () => observer.disconnect();
        }, []);
        useEffect(() => {
          const node = canvas.current;
          if (!node || !size.width || !size.height) return;
          const dpr = Math.min(3, devicePixelRatio || 1);
          node.width = size.width * dpr;
          node.height = size.height * dpr;
          const ctx = node.getContext("2d");
          if (!ctx) return;
          const palette = PALETTES[theme];
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, size.width, size.height);
          const shift = originShift(machine, program.width, program.height);
          const pad = 16;
          const s = Math.min((size.width - pad * 2) / program.width, (size.height - pad * 2) / program.height);
          const ox = (size.width - program.width * s) / 2;
          const oy = (size.height + program.height * s) / 2;
          const X = (x) => ox + (x - shift.x) * s;
          const Y = (y) => oy - (y - shift.y) * s;
          ctx.fillStyle = palette.sheet;
          ctx.strokeStyle = palette.sheetStroke;
          ctx.lineWidth = 1;
          ctx.fillRect(X(shift.x), Y(shift.y + program.height), program.width * s, program.height * s);
          ctx.strokeRect(X(shift.x), Y(shift.y + program.height), program.width * s, program.height * s);
          ctx.strokeStyle = palette.muted;
          ctx.globalAlpha = 0.5;
          for (const outline of program.outlines) {
            ctx.beginPath();
            outline.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)));
            ctx.closePath();
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          const totalMoves = program.blocks.reduce((sum, b) => sum + b.ops.reduce((n2, op) => n2 + opMoves(op).length, 0), 0);
          let budget = Math.round(totalMoves * progress);
          let at = { x: shift.x, y: shift.y, z: machine.safeZ };
          let last = at;
          program.blocks.forEach((block, bi) => {
            const color = TOOL_COLORS[bi % TOOL_COLORS.length];
            for (const op of block.ops) {
              for (const m of opMoves(op)) {
                if (budget <= 0) return;
                budget -= 1;
                const next = { x: m.x ?? at.x, y: m.y ?? at.y, z: m.z ?? at.z };
                if (next.x === at.x && next.y === at.y) {
                  at = next;
                  continue;
                }
                ctx.beginPath();
                if (m.g === 0) {
                  ctx.setLineDash([3, 4]);
                  ctx.strokeStyle = palette.dim;
                  ctx.lineWidth = 0.7;
                  ctx.moveTo(X(at.x), Y(at.y));
                  ctx.lineTo(X(next.x), Y(next.y));
                } else {
                  ctx.setLineDash([]);
                  ctx.strokeStyle = color;
                  ctx.lineWidth = Math.max(1, Math.min(block.tool.d * s, 2.5));
                  if (m.g === 2 || m.g === 3) {
                    const cx = at.x + m.i;
                    const cy = at.y + m.j;
                    const r = Math.hypot(m.i, m.j) * s;
                    const a0 = -Math.atan2(at.y - cy, at.x - cx);
                    const a1 = -Math.atan2(next.y - cy, next.x - cx);
                    ctx.arc(X(cx), Y(cy), r, a0, a1, m.g === 3);
                  } else {
                    ctx.moveTo(X(at.x), Y(at.y));
                    ctx.lineTo(X(next.x), Y(next.y));
                  }
                }
                ctx.stroke();
                at = next;
                last = next;
              }
            }
          });
          ctx.setLineDash([]);
          ctx.fillStyle = palette.accent;
          ctx.beginPath();
          ctx.arc(X(last.x), Y(last.y), 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = palette.text;
          ctx.lineWidth = 1.5;
          const o = { x: X(0), y: Y(0) };
          ctx.beginPath();
          ctx.moveTo(o.x, o.y);
          ctx.lineTo(o.x + 22, o.y);
          ctx.moveTo(o.x, o.y);
          ctx.lineTo(o.x, o.y - 22);
          ctx.stroke();
        }, [program, machine, theme, progress, size]);
        return html`<div ref=${wrap} className="cam-canvas">
          <canvas ref=${canvas} style=${{ width: size.width, height: size.height }} aria-label="Траектории инструмента" role="img" />

      function abortError() {
        const error = new Error("Расчёт отменён");
        error.name = "AbortError";
        return error;
      }
      function workerUrl() {
        const source = document.getElementById("solver-worker")?.textContent ?? "";
        return URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      }
      function createSolver() {
        let url = null;
        let worker = null;
        let active = null;
        let sequence2 = 0;
        const settle = (message) => {
          if (!active || message.id !== active.id) return;
          const { resolve, reject } = active;
          active = null;
          if (message.ok) resolve(message.results);
          else reject(new AppError("Не удалось рассчитать раскрой. Проверьте размеры деталей.", message.error));
        };
        const spawn = () => {
          url ??= workerUrl();
          const next = new Worker(url, { name: "fbuild-solver", type: "module" });
          next.onmessage = (event) => settle(event.data);
          next.onerror = (event) => {
            event.preventDefault();
            if (active) settle({ id: active.id, ok: false, error: event.message || "worker" });
            next.terminate();
            worker = null;
          };
          worker = next;
          return next;
        };
        return {
          solve(payloads, signal) {
            if (active) {
              active.reject(abortError());
              active = null;
              worker?.terminate();
              worker = null;
            }
            return new Promise((resolve, reject) => {
              const id = ++sequence2;
              active = { id, resolve, reject };
              signal?.addEventListener("abort", () => {
                if (active?.id !== id) return;
                active = null;
                worker?.terminate();
                worker = null;
                reject(abortError());
              });
              try {
                (worker ?? spawn()).postMessage({ id, payloads });
              } catch (error) {
                settle({ id, ok: false, error: String(error) });
              }
            });
          }
        };
      }

      const solver = createSolver();
      function useSolved(project) {
        const job = useMemo(
          () => buildJob(project),
          [project.materials, project.cut, project.parts, project.offcuts, project.defects, project.edgeMaterials]
        );
        const [state, setState] = useState(loading());
        const [solved, setSolved] = useState(null);
        const [attempt, setAttempt] = useState(0);
        useEffect(() => {
          const payloads = job.groups.map((g) => g.payload);
          if (!payloads.length) {
            setState(loaded(null));
            setSolved(null);
            return undefined;
          }
          const controller = new AbortController();
          setState(loading("Расчёт раскроя…"));
          const timer = setTimeout(() => {
            solver.solve(payloads, controller.signal).then(
              (results) => {
                if (controller.signal.aborted) return;
                const result = mergeResults(job, results);
                const next = { job, result, summary: summarize(result, job) };
                setSolved(next);
                setState(loaded(next));
              },
              (error) => {
                if (!controller.signal.aborted && !isAbort(error)) setState(failed(error));
              }
            );
          }, CONFIG.solveDelay);
          return () => {
            clearTimeout(timer);
            controller.abort();
          };
        }, [job.key, attempt]);
        const current = useMemo(
          () => solved && job.groups.length ? solved.job.key === job.key ? { ...solved, job } : solved : null,
          [solved, job]
        );
        return {
          job,
          state,
          solved: current,
          computing: state.status === "loading" && job.groups.length > 0,
          retry: () => setAttempt((n2) => n2 + 1)
        };
      }

          const onKey = (event) => {
            const mod = event.ctrlKey || event.metaKey;
            const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
            const code = event.code.startsWith("Key") ? event.code.slice(3).toLowerCase() : event.code.startsWith("Digit") ? event.code.slice(5) : key;
            const combo = `${mod ? "mod+" : ""}${event.shiftKey && (mod || key.length > 1) ? "shift+" : ""}${mod ? code : key}`;
            if (combo === "mod+k") {
              event.preventDefault();
              ref.current[combo]?.();
              return;
            }
            if (isTyping(event.target) || modalOpen()) return;
            const handler = ref.current[combo];
            if (!handler) return;
